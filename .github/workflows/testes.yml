name: Testes

on:
  push:
    branches: [main, "etapa/**"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      TZ: America/Sao_Paulo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Instalar dependências
        run: pip install -r requirements-dev.txt
      - name: Motor de regras, paridade com o protótipo e API
        run: python -m pytest -v
      - name: Páginas montadas conferem com as fontes em web/
        run: |
          python web/build.py
          git diff --exit-code backend/app/static || (echo "Rode python web/build.py e faça commit de backend/app/static" && exit 1)
