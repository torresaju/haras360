name: Versão

# Quando a main recebe um merge, lê o arquivo VERSION e, se a tag vX.Y.Z ainda
# não existir, cria a tag e a Release com a nota da versão em docs/HISTORICO.md.
# Anexa à Release o pacote de atualização haras360-X.Y.Z.tar.gz e o SHA-256 dele,
# para ser assinado no Windows e enviado pela tela Administração > Atualização.
# Desde a v1.1.0, compila o APK do caseiro (workflow App Android) e o coloca dentro do
# pacote do servidor e na Release, quando assinado com a chave de produção.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: versao
  cancel-in-progress: false

jobs:
  verificar:
    runs-on: ubuntu-latest
    outputs:
      existe: ${{ steps.v.outputs.existe }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: A tag desta versão já existe?
        id: v
        run: |
          VERSAO="$(tr -d ' \n\r' < VERSION)"
          if git rev-parse -q --verify "refs/tags/v$VERSAO" >/dev/null; then echo "existe=1" >> "$GITHUB_OUTPUT"; else echo "existe=0" >> "$GITHUB_OUTPUT"; fi

  apk:
    needs: verificar
    if: needs.verificar.outputs.existe == '0'
    uses: ./.github/workflows/android.yml
    secrets: inherit

  tag-e-release:
    needs: [verificar, apk]
    if: always() && needs.verificar.outputs.existe == '0' && needs.apk.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: haras360-apk
          path: dist-apk

      - name: Ler versão
        id: v
        run: |
          VERSAO="$(tr -d ' \n\r' < VERSION)"
          if ! echo "$VERSAO" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "VERSION inválido: '$VERSAO' (esperado X.Y.Z)"; exit 1
          fi
          echo "tag=v$VERSAO" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$VERSAO" >/dev/null; then
            echo "existe=1" >> "$GITHUB_OUTPUT"
            echo "A tag v$VERSAO já existe. Nada a fazer."
          else
            echo "existe=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Extrair nota da versão do HISTORICO
        if: steps.v.outputs.existe == '0'
        run: |
          python3 - "${{ steps.v.outputs.tag }}" <<'PY'
          import re, sys
          tag = sys.argv[1]
          texto = open("docs/HISTORICO.md", encoding="utf-8").read()
          m = re.search(r"^## " + re.escape(tag) + r"\b(.*?)(?=^## |\Z)", texto, re.S | re.M)
          if not m:
              sys.exit(f"docs/HISTORICO.md não tem a seção '## {tag}'. Inclua a nota da versão antes do merge.")
          linhas = m.group(0).splitlines()
          titulo = linhas[0][3:].strip()
          open("titulo.txt", "w", encoding="utf-8").write(titulo)
          open("nota.md", "w", encoding="utf-8").write("\n".join(linhas[1:]).strip() + "\n")
          PY

      - name: Criar tag e Release
        if: steps.v.outputs.existe == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.v.outputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "$(cat titulo.txt)"
          git push origin "$TAG"
          APK_EXTRA=""
          if [ "${{ needs.apk.outputs.assinado }}" = "1" ]; then
            APK_DIR="$PWD/dist-apk" bash deploy/gerar-pacote.sh "$TAG" dist
            cp dist-apk/haras360.apk "dist/haras360-${TAG#v}.apk"
            APK_EXTRA="dist/haras360-${TAG#v}.apk"
            APK_NOTA="O app Android (\`haras360-${TAG#v}.apk\`) vai dentro do pacote e fica disponível no Portal Campo › Instalar o app Android."
          else
            bash deploy/gerar-pacote.sh "$TAG" dist
            APK_NOTA="Atenção: os segredos ANDROID_* não estavam cadastrados; o pacote foi gerado sem o app Android."
          fi
          {
            cat nota.md
            echo
            echo "### Pacote de atualização"
            echo
            echo "Baixe \`haras360-${TAG#v}.tar.gz\`, assine no Windows com \`python assinar-pacote.py haras360-${TAG#v}.tar.gz\` e envie em Administração › Atualização e backup."
            echo
            echo "SHA-256: \`$(cut -d' ' -f1 dist/haras360-${TAG#v}.tar.gz.sha256)\`"
            echo
            echo "$APK_NOTA"
          } > nota-final.md
          gh release create "$TAG" --title "$(cat titulo.txt)" --notes-file nota-final.md --verify-tag \
            dist/haras360-${TAG#v}.tar.gz dist/haras360-${TAG#v}.tar.gz.sha256 deploy/assinar-pacote.py $APK_EXTRA
