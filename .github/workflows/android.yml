name: App Android

# Compila e testa o app do caseiro (Flutter). Com os segredos ANDROID_* cadastrados,
# assina o APK com a chave do Ricardo; sem eles, usa a chave de depuração e o APK
# serve só para teste (não é publicado). Também é chamado pelo workflow Versão.

on:
  push:
    branches: [main, "etapa/**"]
    paths: ["mobile/**", ".github/workflows/android.yml", "VERSION"]
  pull_request:
    paths: ["mobile/**", ".github/workflows/android.yml"]
  workflow_dispatch:
  workflow_call:
    outputs:
      assinado:
        description: "1 se o APK foi assinado com a chave de produção"
        value: ${{ jobs.apk.outputs.assinado }}

env:
  FLUTTER_VERSAO: "3.27.4"

jobs:
  apk:
    runs-on: ubuntu-latest
    outputs:
      assinado: ${{ steps.build.outputs.assinado }}
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSAO }}
          channel: stable
          cache: true

      - name: Gerar a pasta android/ e aplicar as configurações do Haras360
        run: |
          flutter create --platforms=android --org br.com.haras360 --project-name haras360 .
          rm -f test/widget_test.dart
          python3 ferramentas/preparar_android.py
          echo "--- android/app/build.gradle ---"; cat android/app/build.gradle* ; echo "--- AndroidManifest ---"; cat android/app/src/main/AndroidManifest.xml

      - name: Dependências, análise e testes de unidade
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos
          flutter test

      - name: Compilar o APK
        id: build
        env:
          KS_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          H360_KEYSTORE_SENHA: ${{ secrets.ANDROID_KEYSTORE_SENHA }}
          H360_CHAVE_ALIAS: ${{ secrets.ANDROID_CHAVE_ALIAS }}
          H360_CHAVE_SENHA: ${{ secrets.ANDROID_CHAVE_SENHA }}
        run: |
          VERSAO="$(tr -d ' \r\n' < ../VERSION)"
          IFS=. read -r MA MI PA <<< "$VERSAO"
          CODIGO=$((MA * 10000 + MI * 100 + PA))
          if [ -n "$KS_BASE64" ]; then
            echo "$KS_BASE64" | base64 -d > "$RUNNER_TEMP/haras360-android.p12"
            export H360_KEYSTORE="$RUNNER_TEMP/haras360-android.p12"
            echo "assinado=1" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Segredos ANDROID_* ausentes: APK assinado com a chave de depuração, somente para teste."
            echo "assinado=0" >> "$GITHUB_OUTPUT"
          fi
          flutter build apk --release --target-platform android-arm,android-arm64 --obfuscate --split-debug-info=build/simbolos --build-name="$VERSAO" --build-number="$CODIGO" \
            --dart-define=APP_VERSAO="$VERSAO" --dart-define=APP_CODIGO="$CODIGO"
          rm -f "$RUNNER_TEMP/haras360-android.p12"
          mkdir -p ../dist-apk
          cp build/app/outputs/flutter-apk/app-release.apk ../dist-apk/haras360.apk
          SHA="$(sha256sum ../dist-apk/haras360.apk | cut -d' ' -f1)"
          printf '{"versao": "%s", "codigo": %s, "sha256": "%s"}\n' "$VERSAO" "$CODIGO" "$SHA" > ../dist-apk/versao.json
          cat ../dist-apk/versao.json

      - name: Conferir a assinatura do APK
        env:
          ESPERADA: ${{ vars.ANDROID_CERT_SHA256 }}
          ASSINADO: ${{ steps.build.outputs.assinado }}
        run: |
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
          "$APKSIGNER" verify --print-certs ../dist-apk/haras360.apk | tee ../dist-apk/certificado.txt
          OBTIDA="$(grep -m1 'certificate SHA-256 digest' ../dist-apk/certificado.txt | awk '{print $NF}' | tr 'a-f' 'A-F')"
          echo "Impressão digital do certificado: $OBTIDA"
          # Variável opcional do repositório: a impressão mostrada pelo gerar-chave-android.py (com ou sem dois-pontos).
          if [ "$ASSINADO" = "1" ] && [ -n "$ESPERADA" ]; then
            [ "$(echo "$ESPERADA" | tr -d ':' | tr 'a-f' 'A-F')" = "$OBTIDA" ] || { echo "::error::O APK foi assinado com outra chave."; exit 1; }
            echo "Confere com ANDROID_CERT_SHA256."
          fi
          ls -la ../dist-apk

      - uses: actions/upload-artifact@v4
        with:
          name: haras360-apk
          path: dist-apk/
          retention-days: 30

  integracao:
    # Ponta a ponta no emulador Android contra a instância de demonstração, com capturas para o manual.
    if: github.workflow == 'App Android'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SECRET_KEY: chave-somente-para-ci
      DB_URL: sqlite:////tmp/haras360-app.db
      H360_COMPARTILHADO: /tmp/haras360-app
      TZ: America/Sao_Paulo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSAO }}
          channel: stable
          cache: true

      - name: Instância de demonstração e código de vínculo do caseiro
        run: |
          pip install -r backend/requirements.txt
          cd backend
          python -m app.cli demonstracao
          nohup python -m uvicorn app.main:app --host 0.0.0.0 --port 8090 > /tmp/uvicorn.log 2>&1 &
          for i in $(seq 1 30); do curl -fs localhost:8090/api/saude && break; sleep 1; done
          python -m app.cli vincular-celular --email caseiro@demonstracao.local | tee /tmp/vinculo.txt
          awk '{print $NF}' /tmp/vinculo.txt | head -1 > /tmp/codigo-vinculo

      - name: Preparar o projeto Android
        working-directory: mobile
        run: |
          flutter create --platforms=android --org br.com.haras360 --project-name haras360 .
          rm -f test/widget_test.dart
          python3 ferramentas/preparar_android.py
          flutter pub get

      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Teste de integração no emulador (Android 11)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash mobile/ferramentas/teste_integracao.sh

      - name: O registro feito no app chegou ao servidor
        run: |
          python3 - <<'PY'
          import sqlite3
          db = sqlite3.connect("/tmp/haras360-app.db")
          n = db.execute("select count(*) from registros where origem = 'App' and dados like '%Pisou em prego%'").fetchone()[0]
          print("Registros do app no servidor:", n)
          assert n == 1, "o registro do app não chegou ao servidor"
          acoes = [r[0] for r in db.execute("select acao from auditoria")]
          assert "app_vinculado" in acoes, acoes
          PY

      - name: Log do servidor
        if: failure()
        run: tail -100 /tmp/uvicorn.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capturas-app
          path: mobile/capturas-app/
