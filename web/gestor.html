<title>Haras360 Gestor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/*SHARED_CSS*/
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px 20px}
.facts div{display:flex;flex-direction:column;gap:2px;min-width:0}
.facts dt{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.facts dd{margin:0;font-weight:500;overflow-wrap:anywhere}
.steps{display:flex;gap:6px;flex-wrap:wrap;font-size:.84rem}
.steps span{padding:4px 10px;border-radius:99px;background:var(--surface-2);color:var(--muted);font-weight:600}
.steps span.on{background:var(--accent-soft);color:var(--accent)}
.notif{display:grid;grid-template-columns:4px minmax(0,1fr) auto;gap:14px;padding:13px 16px 13px 0;border-top:1px solid var(--line-2);align-items:start}
.notif:first-child{border-top:0}
.notif .bar{align-self:stretch;border-radius:0 3px 3px 0;background:var(--info)}
.notif.critico .bar{background:var(--late)} .notif.alerta .bar{background:var(--soon)}
.notif.lida{opacity:.62}
.notif .ch{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.meter{height:10px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line-2);overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent)}
.matrix td:not(:first-child),.matrix th:not(:first-child){text-align:center}
.yes{color:var(--ok);font-weight:700} .no{color:var(--muted)}
input[type=range]{width:100%;accent-color:var(--accent)}
.tbl input.inp{padding:6px 8px;font-size:.88rem}
.w-num{width:84px}
.kv{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 16px;align-items:center}
.kv .field{max-width:180px}
.aud td{vertical-align:top}
.aud .det{font-size:.8rem;color:var(--muted);white-space:pre-wrap;overflow-wrap:anywhere;max-width:420px}
.glos dt{font-weight:700;margin-top:12px}
.glos dd{margin:2px 0 0;color:var(--muted)}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"></script>

<header class="topbar" id="topbar"></header>
<main class="wrapm">
  <div class="pagehead">
    <div><div class="eyebrow" id="v-eyebrow"></div><h1 id="v-title"></h1></div>
    <div class="acts" id="v-acts"><button class="btn pri" data-act="registrar">+ Novo registro</button></div>
  </div>
  <div id="view" class="view-in"></div>
</main>
<div id="modal" class="modal" hidden></div>
<div id="toast" role="status" hidden></div>

</script>
<script>

</script>
<script>

</script>
<script>
(function () {
  let S = null;
  const $ = s => document.querySelector(s);
  const esc = H.esc, br = H.br, IC = UI.ICON;
  let view = 'painel', param = null, fichaTab = 'prontuario', filtroCat = 'todos', agendaFiltro = 'aberto', agendaCat = 'todos', notifFiltro = 'todas';
  let importacao = null;
  let chat = [{ de: 'bot', t: 'Olá. Sou o assistente ABCCMM do Haras360. Consulto o plantel, a agenda sanitária e o protocolo de vacinação. Nesta versão, as respostas sobre normas da associação usam uma base reduzida.', f: 'Haras360' }];

  async function recarregar() { S = await API.get('/api/estado'); H.LIMITE_ANIMAIS = S.limiteAnimais; }
  /* executa uma alteração na API, recarrega o estado e redesenha */
  async function executar(el, fn, ok) {
    if (el && el.disabled) return null;
    const txt = el ? el.innerHTML : '';
    if (el) { el.disabled = true; el.innerHTML = 'Salvando...'; }
    try {
      const r = await fn();
      await recarregar();
      if (ok !== false) UI.toast(typeof ok === 'string' ? ok : (r && r.resumo) || 'Alteração salva.');
      return r || true;
    } catch (e) { UI.toast(e.message); return null; }
    finally { if (el && el.isConnected) { el.disabled = false; el.innerHTML = txt; } }
  }
  const confirmar = UI.confirmar;
  const naoLidas = () => H.notificacoes(S).filter(n => !S.lidas.includes(n.id));
  const primeiroNome = () => (S.usuario.nome || '').split(' ')[0];

  const modOn = m => !S.plano || S.plano.modulos[m] !== false;
  function menu() {
    return [
      { id: 'painel', rotulo: 'Dashboard', ic: 'dash' },
      { grupo: 'Animais', ic: 'cavalo', itens: [{ id: 'animais', rotulo: 'Plantel', tambem: ['ficha'] }, { id: 'importar', rotulo: 'Importar ABCCMM', off: !modOn('importacao') }] },
      { grupo: 'Sanidade', ic: 'escudo', itens: [{ id: 'sanidade', rotulo: 'Vacinas e manejos' }, { id: 'protocolos', rotulo: 'Protocolos' }] },
      { id: 'reproducao', rotulo: 'Reprodução', ic: 'repro' },
      { id: 'agenda', rotulo: 'Agenda', ic: 'agenda' },
      { id: 'relatorios', rotulo: 'Relatórios', ic: 'graf', breve: true },
      { grupo: 'Administração', ic: 'engr', itens: [{ id: 'equipe', rotulo: 'Equipe' }, { id: 'parametros', rotulo: 'Parametrizações', tambem: ['imagens'] }, { id: 'auditoria', rotulo: 'Auditoria' }, { id: 'assistente', rotulo: 'Assistente', off: !modOn('assistente') }, { id: 'plano', rotulo: 'Plano' }] },
      { grupo: 'Ajuda', ic: 'ajuda', itens: [{ id: 'sobre', rotulo: 'Sobre' }, { href: '/ajuda', rotulo: 'Manual' }, { id: 'glossario', rotulo: 'Glossário' }] }
    ];
  }
  const TITULOS = {
    painel: ['Visão geral do rebanho, sanidade e reprodução', 'Dashboard'], animais: ['Animais', 'Plantel'], sanidade: ['Sanidade', 'Vacinas e manejos'], reproducao: ['Reprodução', 'Gestações e coberturas'], imagens: ['Parametrizações', 'Imagens do haras'], ficha: ['Ficha do animal', ''], importar: ['Plantel', 'Importar Relatório de Plantel'],
    agenda: ['Agenda', 'Próximos eventos e prazos'], protocolos: ['Sanidade', 'Protocolos e intervalos'], notificacoes: ['Alertas', 'Notificações'],
    equipe: ['Usuários, perfis e sessões', 'Equipe do haras'], assistente: ['Inteligência artificial', 'Assistente ABCCMM'], plano: ['Administração', 'Plano e cobrança'],
    parametros: ['Administração', 'Parametrizações do haras'], auditoria: ['Administração', 'Auditoria'], sobre: ['Ajuda', 'Sobre o Haras360'], glossario: ['Ajuda', 'Glossário']
  };

  function go(v, p) {
    if ((v === 'importar' && !modOn('importacao')) || (v === 'assistente' && !modOn('assistente'))) { UI.toast('Este módulo não está incluído no plano do haras.'); return; }
    view = v; param = p || null; if (v === 'ficha' && !p) view = 'animais'; render(); window.scrollTo(0, 0);
  }

  function render() {
    const nl = naoLidas().length;
    $('#topbar').innerHTML = UI.topbar({ menu: menu(), atual: view, home: '/gestor', sub: S.haras.nome, haras: S.haras, marca: S.imagens.logo, cabecalho: S.imagens.cabecalho, usuario: S.usuario, perfilTxt: 'Gestor', sino: { view: 'notificacoes', n: nl },
      usuarioItens: [{ act: 'minha-senha', rotulo: 'Alterar minha senha' }, { act: 'novos-codigos', rotulo: 'Novos códigos de recuperação do 2FA' }] });
    const [eb, ti0] = TITULOS[view] || ['', ''];
    const ti = ti0;
    $('#v-eyebrow').textContent = eb;
    $('#v-title').textContent = view === 'ficha' ? ((H.animal(S, param) || {}).nome || 'Animal') : ti;
    $('#v-acts').hidden = ['parametros', 'auditoria', 'sobre', 'glossario', 'plano', 'equipe'].includes(view);
    document.title = 'Haras360 · ' + ($('#v-title').textContent || 'Gestor');
    const v = $('#view');
    v.classList.remove('view-in'); void v.offsetWidth; v.classList.add('view-in');
    v.innerHTML = VIEWS[view](param);
    if (AFTER[view]) AFTER[view](param);
  }

  /* ================= PAINEL ================= */
  const SANITARIOS = ['vacina', 'vermifugacao', 'exame', 'odontologia', 'ferrageamento'];
  function categoriasRebanho(ativos) {
    const c = { eguas: 0, machos: 0, potros: 0, outros: 0 };
    ativos.forEach(a => { if (!a.nascimento) c.outros++; else if (H.idadeMeses(a.nascimento) < 24) c.potros++; else if (a.sexo === 'F') c.eguas++; else c.machos++; });
    return c;
  }
  function rosca(partes, total) {
    const R0 = 52, C = 2 * Math.PI * R0; let acc = 0;
    const arcos = partes.filter(p => p.n).map(p => { const l = C * p.n / total; const a = '<circle cx="70" cy="70" r="' + R0 + '" fill="none" stroke="' + p.cor + '" stroke-width="18" stroke-dasharray="' + l.toFixed(2) + ' ' + (C - l).toFixed(2) + '" stroke-dashoffset="' + (-acc).toFixed(2) + '" transform="rotate(-90 70 70)"/>'; acc += l; return a; }).join('');
    return '<svg class="rosca" viewBox="0 0 140 140" role="img" aria-label="' + partes.map(p => p.rot + ': ' + p.n).join(', ') + '"><circle cx="70" cy="70" r="' + R0 + '" fill="none" stroke="var(--line-2)" stroke-width="18"/>' + arcos +
      '<text x="70" y="70" text-anchor="middle" class="rosca-n">' + total + '</text><text x="70" y="90" text-anchor="middle" class="rosca-t">Animais</text></svg>';
  }
  function vPainel() {
    const ts = H.tarefas(S);
    const atras = ts.filter(t => t.status === 'atrasado'), pend = ts.filter(t => t.doc);
    const vacAtr = atras.filter(t => t.cat === 'vacina'), vac7 = ts.filter(t => t.cat === 'vacina' && (t.status === 'hoje' || t.status === 'semana'));
    const ativos = S.animais.filter(a => a.vivo), n = ativos.length;
    const gest = ativos.map(a => [a, H.gestacao(S, a)]).filter(x => x[1]);
    const lim30 = H.iso(H.addDias(H.hoje(), 30)), hojeIso = H.iso(H.hoje());
    const partos = gest.filter(([, g]) => g.parto >= hojeIso && g.parto <= lim30);
    const proximos = ts.filter(t => !t.doc && t.status !== 'atrasado').slice(0, 6);
    const campo = S.registros.filter(r => r.origem !== 'Portal Gestor').sort((a, b) => a.data < b.data ? 1 : -1).slice(0, 4);
    const mes = hojeIso.slice(0, 7);
    const repMes = S.registros.filter(r => r.tipo === 'reprodutivo' && (r.data || '').startsWith(mes));
    const conta = ev => repMes.filter(r => r.evento === ev).length;
    const cat = categoriasRebanho(ativos);
    const partes = [{ rot: 'Éguas', n: cat.eguas, cor: '#193D30' }, { rot: 'Machos', n: cat.machos, cor: '#4E8A66' }, { rot: 'Potros', n: cat.potros, cor: '#D5A064' }, { rot: 'Outros', n: cat.outros, cor: '#82978A' }];
    const pct = x => n ? Math.round(x / n * 100) + '%' : '0%';
    const kpi = (cls, ic, num, rot, act) => '<button class="kpi2 ' + cls + '" ' + act + '><span class="kpi-ic">' + UI.ICON[ic] + '</span><span><b>' + num + '</b><span>' + rot + '</span></span></button>';
    const evento = t => { const dd = t.due || ''; return '<button class="ev" data-act="ver-animal" data-id="' + t.animalId + '"><span class="ev-d"><b>' + dd.slice(8, 10) + '</b><small>' + (H.brCurta(dd).split(' ')[1] || '').toUpperCase() + '</small></span><span class="ev-ic">' + UI.ICON[t.cat === 'vacina' ? 'vacina' : t.cat === 'reprodutivo' ? 'repro' : 'escudo'] + '</span><span class="ev-t"><b>' + esc(t.titulo) + '</b><small>' + esc(t.animal) + (t.status === 'hoje' ? ' · hoje' : '') + '</small></span></button>'; };
    return '<div class="sec">' +
      '<div class="spread"><p class="muted">' + saudacao() + ', ' + esc(primeiroNome()) + '.</p><span class="data-chip">' + UI.ICON.agenda + new Date().toLocaleDateString('pt-BR', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }) + '</span></div>' +
      '<div class="kpis5">' +
      kpi('k-ok', 'cavalo', n, 'Animais', 'data-act="nav" data-v="animais"') +
      kpi('k-late', 'escudo', vacAtr.length, 'Vacinas vencidas', 'data-act="nav" data-v="sanidade"') +
      kpi('k-soon', 'agenda', vac7.length, 'Vacinas (7 dias)', 'data-act="nav" data-v="sanidade"') +
      kpi('k-repro', 'repro', gest.length, 'Gestações ativas', 'data-act="nav" data-v="reproducao"') +
      kpi('k-info', 'cavalo', partos.length, 'Previsão de parto (30 dias)', 'data-act="nav" data-v="reproducao"') +
      '</div>' +
      '<div class="grid3">' +
      '<div class="card"><div class="card-h"><h3>' + UI.ICON.agenda + 'Próximos eventos</h3><button class="btn ghost sm" data-act="nav" data-v="agenda">Ver agenda →</button></div>' + (proximos.length ? '<div class="evs">' + proximos.map(evento).join('') + '</div>' : '<p class="muted small">Nada previsto.</p>') + '</div>' +
      '<div class="card"><div class="card-h"><h3>Rebanho por categoria</h3></div><div class="rosca-w">' + rosca(partes, n) + '<ul class="leg">' + partes.map(p => '<li><i style="background:' + p.cor + '"></i>' + p.rot + '<b>' + p.n + ' <small>(' + pct(p.n) + ')</small></b></li>').join('') + '</ul></div><p class="small muted">Potros: até 2 anos. Outros: sem data de nascimento.</p></div>' +
      '<div class="card"><div class="card-h"><h3>' + UI.ICON.repro + 'Situação reprodutiva</h3></div><dl class="lst">' +
      '<div><dt>Gestações ativas</dt><dd>' + gest.length + '</dd></div><div><dt>Coberturas no mês</dt><dd>' + conta('Cobertura') + '</dd></div><div><dt>Inseminações no mês</dt><dd>' + conta('Inseminação') + '</dd></div><div><dt>Previsão de parto (30 dias)</dt><dd>' + partos.length + '</dd></div></dl></div>' +
      '</div>' +
      '<div class="grid2">' +
      '<div class="card flush"><div class="card-h" style="padding:16px 18px 0"><h3>Atenção agora</h3><span class="small muted">' + atras.length + ' atrasado' + (atras.length === 1 ? '' : 's') + ' · ' + pend.length + ' pendência' + (pend.length === 1 ? '' : 's') + ' ABCCMM</span></div>' +
      '<div class="tasks" style="padding:4px 18px 8px 0">' + (atras.length + pend.length ? atras.concat(pend).slice(0, 8).map(t => UI.linhaTarefa(t)).join('') : '<div class="empty">Nada atrasado nem pendente. Bom trabalho.</div>') + '</div></div>' +
      '<div class="card"><div class="card-h"><h3>Últimos registros do campo</h3><span class="small muted">Caseiro</span></div>' + UI.linhaTempo(S, campo, { comAnimal: true }) + '</div>' +
      '</div>' +
      '<div class="banner">' + UI.fundo(S.imagens.banner, 'banner-img') + '<div class="banner-in"><span class="banner-ic">' + UI.ICON.graf + '</span><div><h2>Desempenho do haras</h2><p>Acompanhe a sanidade, a reprodução e o histórico de cada animal em um só lugar.</p></div>' +
      '<button class="btn gold" data-act="em-breve" data-m="Relatórios">Relatórios em breve</button></div></div>' +
      '<p class="small muted">' + n + ' de ' + H.LIMITE_ANIMAIS + ' animais no plano ' + esc(S.plano.nome) + ' · mensalidade ' + (mensal(n) === null ? 'a definir' : H.moeda(mensal(n))) + ' · <a href="#" data-act="nav" data-v="plano">ver plano</a></p>' +
      '</div>';
  }
  function saudacao() { const h = new Date().getHours(); return h < 12 ? 'Bom dia' : h < 18 ? 'Boa tarde' : 'Boa noite'; }
  function vSanidade() { return vAgenda('sanidade'); }
  function vReproducao() {
    const ativos = S.animais.filter(a => a.vivo);
    const gest = ativos.map(a => [a, H.gestacao(S, a)]).filter(x => x[1]).sort((x, y) => x[1].parto < y[1].parto ? -1 : 1);
    const ts = H.tarefas(S).filter(t => t.cat === 'reprodutivo' || t.parto);
    const regs = S.registros.filter(r => r.tipo === 'reprodutivo').sort((a, b) => a.data < b.data ? 1 : -1).slice(0, 12);
    return '<div class="sec">' +
      '<div class="card"><div class="card-h"><h3>' + UI.ICON.repro + 'Gestações</h3><span class="small muted">' + gest.length + ' em andamento</span></div>' +
      (gest.length ? gest.map(([a, g]) => gestBloco(a, g)).join('<hr class="div">') : '<p class="muted small">Nenhuma égua com diagnóstico positivo registrado.</p>') + '</div>' +
      '<div class="card flush"><div class="card-h" style="padding:16px 18px 0"><h3>Próximas etapas reprodutivas</h3></div><div class="tasks" style="padding:4px 18px 8px 0">' + (ts.length ? ts.slice(0, 10).map(t => UI.linhaTarefa(t)).join('') : '<div class="empty">Nada previsto.</div>') + '</div></div>' +
      '<div class="card"><div class="card-h"><h3>Últimos eventos</h3><button class="btn ghost sm" data-act="registrar">' + IC.plus + 'Registrar</button></div>' + UI.linhaTempo(S, regs, { comAnimal: true }) + '</div>' +
      '<p class="small muted">Registro de cio e relatórios de fertilidade chegam na v1.4.0.</p></div>';
  }
  function gestBloco(a, g) {
    return '<div class="gest"><div class="spread"><a href="#" data-act="ver-animal" data-id="' + a.id + '"><b>' + esc(a.nome) + '</b></a><span class="chip c-accent">' + g.mes + 'º mês · ' + g.dias + ' dias</span></div>' +
      '<div class="gbar" role="img" aria-label="' + g.pct + '% da gestação"><i style="width:' + g.pct + '%"></i></div>' +
      '<div class="gmarks"><span>Cobertura ' + H.brCurta(g.cobertura) + '</span><span>Rino 5º · 7º · 9º</span><span>Parto ' + H.brCurta(g.parto) + '</span></div>' +
      '<p class="small muted">Parto previsto ' + H.relativo(g.parto) + (g.garanhao ? ' · garanhão ' + esc(g.garanhao) : '') + '</p></div>';
  }

  /* ================= ANIMAIS ================= */
  let busca = '', sexoF = '';
  function vAnimais() {
    return '<div class="sec"><div class="spread"><div class="row"><input id="busca" class="inp" style="width:min(320px,100%)" placeholder="Buscar por nome, registro ou chip" value="' + esc(busca) + '">' +
      '<select id="sexoF" class="inp" style="width:auto"><option value="">Todos os sexos</option><option value="F"' + (sexoF === 'F' ? ' selected' : '') + '>Fêmeas</option><option value="M"' + (sexoF === 'M' ? ' selected' : '') + '>Machos</option></select></div>' +
      '<div class="row"><button class="btn" data-act="nav" data-v="importar">' + IC.upload + 'Importar PDF ABCCMM</button><button class="btn pri" data-act="novo-animal">' + IC.plus + 'Novo animal</button></div></div>' +
      '<div class="card flush"><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Animal</th><th>Sexo</th><th>Idade</th><th>Livro</th><th>DNA</th><th>Situação</th><th>Próxima etapa</th></tr></thead><tbody id="tb-animais"></tbody></table></div></div></div>';
  }
  function linhasAnimais() {
    const q = H.norm(busca);
    const ts = H.tarefas(S);
    const lst = S.animais.filter(a => (!sexoF || a.sexo === sexoF) && (!q || H.norm(a.nome + ' ' + a.registro + ' ' + a.chip).includes(q)));
    if (!lst.length) return '<tr><td colspan="7"><div class="empty">Nenhum animal encontrado.</div></td></tr>';
    return lst.map(a => {
      const t = ts.filter(x => x.animalId === a.id);
      const at = t.filter(x => x.status === 'atrasado').length, pd = t.filter(x => x.doc).length;
      const prox = t.find(x => !x.doc && x.status !== 'atrasado');
      const g = H.gestacao(S, a);
      const sit = [!a.vivo ? '<span class="chip c-muted">Inativo</span>' : '', at ? '<span class="chip c-late">' + at + ' atrasado' + (at > 1 ? 's' : '') + '</span>' : '', pd ? '<span class="chip c-info">' + pd + ' pendência' + (pd > 1 ? 's' : '') + '</span>' : '', g ? '<span class="chip c-accent">Gestante ' + g.mes + 'º mês</span>' : '', (a.vivo && !at && !pd) ? '<span class="chip c-ok">Em dia</span>' : ''].join(' ');
      return '<tr class="click" data-act="ver-animal" data-id="' + a.id + '"><td><b>' + esc(a.nome) + '</b><br><span class="mono muted">' + (a.registro ? 'Reg. ' + esc(a.registro) : 'Sem registro') + '</span></td><td>' + (a.sexo === 'F' ? 'Fêmea' : 'Macho') + '</td><td style="white-space:nowrap">' + H.idadeTxt(a.nascimento) + '</td><td class="small">' + esc(a.livro || '-') + '</td><td><span class="chip ' + (/sem/i.test(a.dna) ? 'c-late' : 'c-ok') + '">' + esc(a.dna || '-') + '</span></td><td><div class="row" style="gap:4px">' + sit + '</div></td><td class="small">' + (prox ? esc(prox.titulo) + '<br><span class="muted">' + H.br(prox.due) + '</span>' : '-') + '</td></tr>';
    }).join('');
  }

  /* ================= FICHA ================= */
  function vFicha(id) {
    const a = H.animal(S, id); if (!a) return '<div class="empty">Animal não encontrado.</div>';
    const g = H.gestacao(S, a);
    const tabs = [['prontuario', 'Prontuário'], ['agenda', 'Agenda'], ['dados', 'Dados e genealogia']];
    let corpo = '';
    if (fichaTab === 'prontuario') {
      const regs = S.registros.filter(r => r.animalId === a.id && (filtroCat === 'todos' || r.tipo === filtroCat)).sort((x, y) => x.data < y.data ? 1 : -1);

  /* ================= IMPORTAR ================= */
  function vImportar() {
    if (!importacao) {
      return '<div class="sec"><div class="steps"><span class="on">1. Enviar PDF</span><span>2. Conferir</span><span>3. Importar</span></div>' +
        '<div class="grid2"><div class="card stack"><h2>Relatório de Plantel da ABCCMM</h2><p class="muted">Envie o PDF gerado no Sistema de Gestão ABCCMM. O Haras360 lê nome, livro, registro, sexo, bloqueio, situação, DNA, nascimento e microchip de cada animal e confere com o resumo do relatório antes de gravar.</p>' +
        '<label class="drop" id="drop" for="pdf">' + IC.upload + '<b>Arraste o PDF aqui ou clique para escolher</b><span class="small muted">Arquivo .pdf · o conteúdo é lido no seu navegador</span></label><input id="pdf" type="file" accept="application/pdf,.pdf" hidden>' +
        '<p id="imp-st" class="note" hidden></p></div>' +
        '<div class="card stack"><h3>Como funciona</h3><ol class="small" style="margin:0;padding-left:18px;display:flex;flex-direction:column;gap:8px"><li>Animais já cadastrados são reconhecidos pelo registro, chip ou nome, e não são duplicados.</li><li>Animais sem registro ou sem exame de DNA geram pendências documentais.</li><li>A data de nascimento alimenta o motor de regras, que calcula a agenda de vacinas e manejos.</li><li>A genealogia é completada depois, na ficha, à mão ou pelo certificado.</li></ol>' +
        '<p class="note">O PDF é lido no seu navegador; só os dados dos animais selecionados são enviados ao servidor. O CPF do associado não é gravado.</p></div></div></div>';
    }
    const { res, comp } = importacao;
    const sel = importacao.sel;
    const novos = comp.filter((c, i) => sel.has(i) && c.situacao === 'novo').length;
    const atual = comp.filter((c, i) => sel.has(i) && c.situacao === 'atualizar').length;
    const ativos = S.animais.filter(a => a.vivo).length;
    const depois = ativos + comp.filter((c, i) => sel.has(i) && c.situacao === 'novo' && c.novo.vivo).length;
    const confere = res.totalInformado === null ? '<p class="note warn">O resumo do relatório não foi encontrado. Confira a lista manualmente.</p>' : res.totalInformado === res.animais.length ? '<p class="note good">Conferência ok: ' + res.animais.length + ' animais lidos, igual ao total informado no relatório (' + res.machos + ' machos e ' + res.femeas + ' fêmeas).</p>' : '<p class="note bad">Atenção: ' + res.animais.length + ' animais lidos, mas o relatório informa ' + res.totalInformado + '. Confira as linhas não reconhecidas abaixo.</p>';
    const lim = depois > H.LIMITE_ANIMAIS ? '<p class="note bad">O plano atende até ' + H.LIMITE_ANIMAIS + ' animais por haras. Desmarque ' + (depois - H.LIMITE_ANIMAIS) + ' animal(is) para continuar.</p>' : (depois !== ativos && mensal(depois) !== null && mensal(depois) !== mensal(ativos)) ? '<p class="note">Com ' + depois + ' animais ativos, a mensalidade passa de ' + H.moeda(mensal(ativos) || 0) + ' para ' + H.moeda(mensal(depois)) + '.</p>' : '';
    const sit = { novo: '<span class="chip c-ok">Novo</span>', atualizar: '<span class="chip c-soon">Atualizar</span>', igual: '<span class="chip c-muted">Já cadastrado</span>' };
    const rot = { nome: 'nome', livro: 'livro', registro: 'registro', sexo: 'sexo', bloqueado: 'bloqueio', vivo: 'situação', dna: 'DNA', nascimento: 'nascimento', chip: 'chip' };
    return '<div class="sec"><div class="steps"><span>1. Enviar PDF</span><span class="on">2. Conferir</span><span>3. Importar</span></div>' +
      '<div class="card"><dl class="facts"><div><dt>Arquivo</dt><dd>' + esc(importacao.arquivo) + '</dd></div><div><dt>Associado(a)</dt><dd>' + esc(res.associado || 'Não identificado') + '</dd></div><div><dt>CPF</dt><dd class="mono">' + esc(H.mascaraCPF(res.cpf)) + '</dd></div><div><dt>Impresso em</dt><dd>' + (res.impresso ? br(res.impresso) : '-') + '</dd></div></dl></div>' +
      confere + lim +
      '<div class="card flush"><div class="tbl-wrap"><table class="tbl"><thead><tr><th><span class="sr">Incluir</span></th><th>Situação</th><th>Animal</th><th>Livro</th><th>Registro</th><th>Sexo</th><th>Nascimento</th><th>DNA</th><th>Chip</th><th>Alertas</th></tr></thead><tbody>' +
      comp.map((c, i) => {
        const n = c.novo;
        const al = [!n.registro ? 'Sem registro' : '', /sem/i.test(n.dna) ? 'Sem DNA' : '', n.bloqueado ? 'Bloqueado' : '', !n.vivo ? 'Morto' : ''].filter(Boolean).map(x => '<span class="chip c-late">' + x + '</span>').join(' ');
        const dif = c.situacao === 'atualizar' ? '<br><span class="small muted">Muda: ' + c.diffs.map(d => rot[d]).join(', ') + '</span>' : '';
        return '<tr><td><input type="checkbox" data-chg="imp-sel" data-i="' + i + '"' + (sel.has(i) ? ' checked' : '') + (c.situacao === 'igual' ? ' disabled' : '') + ' aria-label="Incluir ' + esc(n.nome) + '"></td><td>' + sit[c.situacao] + '</td><td><b>' + esc(n.nome) + '</b>' + dif + '</td><td class="small">' + esc(n.livro || '-') + '</td><td class="mono">' + esc(n.registro || '-') + '</td><td>' + n.sexo + '</td><td class="mono">' + br(n.nascimento) + '</td><td class="small">' + esc(n.dna) + '</td><td class="mono small">' + esc(n.chip || '-') + '</td><td><div class="row" style="gap:4px">' + (al || '<span class="muted small">-</span>') + '</div></td></tr>';
      }).join('') + '</tbody></table></div></div>' +
      (res.ignoradas.length ? '<div class="note warn"><b>Linhas não reconhecidas:</b><br>' + res.ignoradas.map(esc).join('<br>') + '</div>' : '') +
      '<div class="row" style="justify-content:flex-end"><button class="btn" data-act="imp-cancelar">Cancelar</button><button class="btn pri" data-act="imp-confirmar"' + ((novos + atual === 0 || depois > H.LIMITE_ANIMAIS) ? ' disabled' : '') + '>' + IC.check + 'Importar ' + novos + ' novo(s) e atualizar ' + atual + '</button></div></div>';
  }
  async function lerPDF(file) {
    const st = $('#imp-st');
    const msg = (t, c) => { st.textContent = t; st.className = 'note ' + (c || ''); st.hidden = false; };
    if (!file) return;
    if (!/pdf$/i.test(file.type) && !/\.pdf$/i.test(file.name)) return msg('Envie um arquivo em PDF.', 'bad');
    msg('Lendo o PDF...');
    try {
      const linhas = await H.linhasPDF(file);
      const res = H.lerPlantel(linhas);
      if (!linhas.length) return msg('Não encontramos texto neste PDF. Ele pode ser uma imagem digitalizada; gere o relatório novamente no Sistema de Gestão ABCCMM.', 'bad');
      if (!res.animais.length) return msg(res.valido ? 'O PDF é da ABCCMM, mas não encontramos linhas de animais. Confira se é o Relatório de Plantel.' : 'Este PDF não parece ser um Relatório de Plantel da ABCCMM.', 'bad');
      const comp = H.compararImportacao(S, res.animais);
      importacao = { arquivo: file.name, res, comp, sel: new Set(comp.map((c, i) => c.situacao !== 'igual' ? i : -1).filter(i => i >= 0)) };
      render();
    } catch (e) { msg('Não foi possível ler o PDF: ' + e.message, 'bad'); }
  }
  async function confirmarImportacao(el) {
    const { res, comp, sel } = importacao;
    const animais = comp.filter((c, i) => sel.has(i) && c.situacao !== 'igual').map(c => c.novo);
    const r = await executar(el, () => API.post('/api/importacao', { arquivo: importacao.arquivo, associado: res.associado, impresso: res.impresso, animais }));
    if (r) { importacao = null; go('animais'); }
  }

  /* ================= AGENDA ================= */
  function vAgenda(modulo) {
    let ts = H.tarefas(S);
    if (modulo === 'sanidade') ts = ts.filter(t => SANITARIOS.includes(t.cat));
    if (agendaCat !== 'todos') ts = ts.filter(t => t.cat === agendaCat);
    const lim90 = H.iso(H.addDias(H.hoje(), 90));
    if (agendaFiltro === 'aberto') ts = ts.filter(t => t.status !== 'futuro');
    if (agendaFiltro === '90') ts = ts.filter(t => t.doc || t.due <= lim90);
    const grupos = [['atrasado', 'Atrasados'], ['pendente', 'Pendências documentais'], ['hoje', 'Hoje'], ['semana', 'Próximos 7 dias'], ['mes', 'Próximos 30 dias'], ['futuro', 'Programados']];
    const seg = [['aberto', 'Em aberto'], ['90', 'Próximos 90 dias'], ['tudo', 'Tudo']];
    const cats = [...new Set(H.tarefas(S).map(t => t.cat))].filter(c => modulo !== 'sanidade' || SANITARIOS.includes(c));
    return '<div class="sec"><div class="spread"><div class="seg" role="group" aria-label="Período">' + seg.map(([k, l]) => '<button data-act="agenda-f" data-f="' + k + '" aria-pressed="' + (agendaFiltro === k) + '">' + l + '</button>').join('') + '</div>' +
      '<select id="agendaCat" class="inp" style="width:auto"><option value="todos">Todas as categorias</option>' + cats.map(c => '<option value="' + c + '"' + (agendaCat === c ? ' selected' : '') + '>' + H.CATS[c].nome + '</option>').join('') + '</select></div>' +
      (ts.length ? grupos.map(([k, l]) => { const g = ts.filter(t => t.status === k); return g.length ? '<div class="card flush"><div class="card-h" style="padding:14px 18px 0"><h3>' + l + '</h3><span class="small muted">' + g.length + '</span></div><div class="tasks" style="padding:2px 18px 6px 0">' + g.map(t => UI.linhaTarefa(t)).join('') + '</div></div>' : ''; }).join('') : '<div class="card empty">Nada para mostrar com esses filtros.</div>') +
      '<p class="small muted">Datas calculadas pelo motor de regras a partir do nascimento, do último registro e dos protocolos configurados. Ajuste intervalos em Protocolos.</p></div>';
  }

  /* ================= PROTOCOLOS ================= */
  function vProtocolos() {
    const vac = S.protocolos.filter(p => p.cat === 'vacina'), outros = S.protocolos.filter(p => p.cat !== 'vacina');
    const inp = (p, k, val, extra) => '<input class="inp w-num mono" id="p-' + p.id + '-' + k + '" value="' + esc(val) + '" inputmode="numeric"' + (extra || '') + '>';
    return '<div class="sec"><p class="note">Vacinas seguem o protocolo publicado pela VetJr. UFMG; os demais manejos usam padrões de mercado. Os intervalos são editáveis e devem ser validados pelo médico veterinário responsável pelo plantel.</p>' +
      '<div class="card spread"><div><h3>Reforço da vacina de raiva</h3><p class="small muted">Em estados endêmicos para raiva o reforço passa a ser semestral.</p></div><div class="seg" role="group" aria-label="Reforço da raiva"><button data-act="raiva" data-v="0" aria-pressed="' + !S.haras.raivaSemestral + '">Anual</button><button data-act="raiva" data-v="1" aria-pressed="' + !!S.haras.raivaSemestral + '">Semestral</button></div></div>' +
      '<div class="card flush"><div class="card-h" style="padding:16px 18px 0"><h2>Vacinas</h2><span class="chip nodot c-info">Fonte: VetJr. UFMG</span></div><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Ativa</th><th>Vacina</th><th>1ª dose (meses)</th><th>Série inicial (dias entre doses)</th><th>Reforço (dias)</th><th>Via</th></tr></thead><tbody>' +
      vac.map(p => '<tr><td><input type="checkbox" id="p-' + p.id + '-ativo"' + (p.ativo ? ' checked' : '') + ' aria-label="Ativar ' + esc(p.nome) + '"></td><td><b>' + esc(p.nome) + '</b> <span class="chip nodot ' + (/^Obrigat/.test(p.obrig) ? 'c-late' : 'c-muted') + '">' + esc(p.obrig) + '</span>' + (p.nota ? '<br><span class="small muted">' + esc(p.nota) + '</span>' : '') + '</td><td>' + inp(p, 'idade', p.idadeMeses) + '</td><td>' + inp(p, 'serie', (p.serie || []).join(', '), ' placeholder="dose única" style="width:130px"') + '</td><td>' + (p.id === 'raiva' ? '<span class="mono">' + (S.haras.raivaSemestral ? 180 : 365) + '</span><br><span class="small muted">pela configuração acima</span>' : inp(p, 'ref', p.reforcoDias)) + '</td><td class="small">' + esc(p.via || '') + '</td></tr>').join('') +

      '<li>Potros que concluíram a série inicial recebem o primeiro reforço aos 12 meses de idade.</li>' +
      '<li>Diagnóstico de gestação positivo agenda rinopneumonite no 5º, 7º e 9º mês e a previsão de parto em ' + S.haras.gestacaoDias + ' dias após a cobertura (ajustável em Parametrizações).</li>' +
      '<li>Vacinas multivalentes atualizam todas as doenças marcadas no mesmo registro.</li>' +
      '<li>Animais sem registro, sem exame de DNA ou bloqueados geram pendência documental.</li></ul></div>' +
      '<div class="row" style="justify-content:flex-end"><button class="btn" data-act="restaurar-prot">Restaurar padrões</button><button class="btn pri" data-act="salvar-prot">' + IC.check + 'Salvar protocolos</button></div></div>';
  }
  function salvarProtocolos(el) {
    const lista = [];
    for (const p of S.protocolos) {
      const g = k => document.getElementById('p-' + p.id + '-' + k);
      const item = { id: p.id };
      const at = g('ativo'); if (at) item.ativo = at.checked;
      const id = g('idade'); if (id) { const v = parseInt(id.value, 10); if (isNaN(v) || v < 0 || v > 120) { UI.toast('Idade inválida em ' + p.nome + '. Use meses entre 0 e 120.'); id.focus(); return; } item.idadeMeses = v; }
      const se = g('serie'); if (se) { const arr = se.value.split(/[,;\s]+/).filter(Boolean).map(Number); if (arr.some(x => isNaN(x) || x < 1 || x > 400)) { UI.toast('Série inválida em ' + p.nome + '. Informe dias separados por vírgula, ex.: 30, 30.'); se.focus(); return; } item.serie = arr; }
      const rf = g('ref'); if (rf) { const v = parseInt(rf.value, 10); if (isNaN(v) || v < 1 || v > 1500) { UI.toast('Intervalo inválido em ' + p.nome + '.'); rf.focus(); return; } item.reforcoDias = v; }
      lista.push(item);
    }
    executar(el, () => API.put('/api/protocolos', lista)).then(r => { if (r) render(); });
  }

  /* ================= ASSISTENTE ================= */
  function vAssistente() { return UI.chatHTML(chat, 'Pergunte ao assistente', 'Respostas com base no plantel, na agenda e no protocolo de vacinação. A próxima versão será treinada com as normas e regulamentos da ABCCMM.'); }
  function perguntar(q) {
    q = (q || '').trim(); if (!q) return;
    chat.push({ de: 'me', t: q });
    const r = H.responder(S, q);
    chat.push({ de: 'bot', t: r.t, f: r.f });

  /* ================= PLANO ================= */
  let simN = null;
  const valorFaixa = v => v === null || v === undefined ? 'A definir' : (Number(v) === 0 ? 'Grátis' : H.moeda(Number(v)));
  function mensal(n) {
    let t = 0;
    for (const f of S.plano.faixas) { const q = Math.max(0, Math.min(n, f.ate) - f.de + 1); if (q) { if (f.valor === null || f.valor === undefined) return null; t += q * f.valor; } }
    return Math.round(t * 100) / 100;
  }
  function vPlano() {
    const n = S.animais.filter(a => a.vivo).length, P = S.plano, m = P.mensalidade;
    if (simN === null) simN = Math.min(Math.max(n, 4), P.limite);
    return '<div class="sec"><div class="grid2"><div class="card stack"><div class="eyebrow">Plano do haras</div><div class="spread"><h2>' + esc(P.nome) + '</h2><b style="font-family:var(--f-display);font-size:1.8rem">' + (m === null ? 'A definir' : H.moeda(m) + '<span class="small muted" style="font-family:var(--f-body)"> /mês</span>') + '</b></div>' +
      '<div class="meter" role="img" aria-label="' + n + ' de ' + P.limite + ' animais"><i style="width:' + Math.min(100, n / P.limite * 100) + '%"></i></div><p class="small muted">' + n + ' de ' + P.limite + ' animais ativos. Animais mortos ou baixados deixam de contar.</p>' +
      '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Módulo</th><th>Incluído</th></tr></thead><tbody>' + Object.entries(P.modulosNomes).map(([k, l]) => '<tr><td>' + esc(l) + '</td><td>' + (P.modulos[k] ? '<span class="yes">Sim</span>' : '<span class="no">Não</span>') + '</td></tr>').join('') + '</tbody></table></div>' +
      '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Animais</th><th class="num">Por animal / mês</th></tr></thead><tbody>' + P.faixas.map(f => '<tr><td>' + f.de + ' a ' + f.ate + '</td><td class="num mono">' + valorFaixa(f.valor) + '</td></tr>').join('') + '</tbody></table></div>' +
      '<p class="note">Planos, módulos e valores são definidos pelo administrador da plataforma. A cobrança é progressiva: cada animal paga o valor da faixa em que entra.</p></div>' +
      '<div class="card stack"><h3>Simular mensalidade</h3><label for="sim" class="lbl">Quantidade de animais: <b id="sim-n" style="color:var(--ink)">' + simN + '</b></label><input id="sim" type="range" min="1" max="' + P.limite + '" value="' + simN + '"><div id="sim-out"></div></div></div></div>';
  }
  function simOut() {
    const n = simN, parts = [];
    for (const f of S.plano.faixas) { const q = Math.max(0, Math.min(n, f.ate) - f.de + 1); if (q) parts.push(q + ' × ' + valorFaixa(f.valor).toLowerCase()); }
    const m = mensal(n);
    $('#sim-n').textContent = n;
    $('#sim-out').innerHTML = '<b style="font-family:var(--f-display);font-size:2rem">' + (m === null ? 'A definir' : H.moeda(m)) + '</b>' + (m === null ? '' : '<span class="muted"> por mês</span>') + '<p class="small muted mono">' + parts.join(' + ') + '</p>';
  }

  const VIEWS = { painel: vPainel, sanidade: vSanidade, reproducao: vReproducao, animais: vAnimais, ficha: vFicha, importar: vImportar, agenda: vAgenda, protocolos: vProtocolos, notificacoes: vNotificacoes, equipe: vEquipe, assistente: vAssistente, plano: vPlano, parametros: vParametros, auditoria: vAuditoria, sobre: vSobre, glossario: vGlossario };
  const AFTER = {
    animais() {
      $('#tb-animais').innerHTML = linhasAnimais();
      $('#busca').addEventListener('input', e => { busca = e.target.value; $('#tb-animais').innerHTML = linhasAnimais(); });
      $('#sexoF').addEventListener('change', e => { sexoF = e.target.value; $('#tb-animais').innerHTML = linhasAnimais(); });
    },
    ficha(id) {
      const fc = $('#filtroCat'); if (fc) fc.addEventListener('change', e => { filtroCat = e.target.value; render(); });
      const ce = $('#cert'); if (ce) ce.addEventListener('change', async e => {
        const f = e.target.files[0]; e.target.value = ''; if (!f) return;
        const st = $('#cert-st'); st.hidden = false; st.className = 'note'; st.textContent = 'Lendo o certificado...';
        try {
          const g = H.lerGenealogia(await H.linhasPDF(f));
          const ks = Object.keys(g);
          if (!ks.length) { st.className = 'note warn'; st.textContent = 'Não encontramos campos de genealogia (Pai, Mãe, Avós) neste PDF. Preencha manualmente.'; return; }
          ks.forEach(k => { const el = document.getElementById('d-' + k); if (el) { el.value = g[k]; el.style.borderColor = 'var(--accent)'; el.style.background = 'var(--accent-soft)'; } });
          st.className = 'note good'; st.textContent = ks.length + ' campo(s) preenchido(s) a partir do PDF. Confira e clique em Salvar dados.';
        } catch (err) { st.className = 'note bad'; st.textContent = 'Não foi possível ler o PDF: ' + err.message; }
      });
    },
    importar() {
      const inp = $('#pdf'), dr = $('#drop'); if (!inp) return;
      inp.addEventListener('change', e => lerPDF(e.target.files[0]));
      ['dragenter', 'dragover'].forEach(ev => dr.addEventListener(ev, e => { e.preventDefault(); dr.classList.add('over'); }));
      ['dragleave', 'drop'].forEach(ev => dr.addEventListener(ev, e => { e.preventDefault(); dr.classList.remove('over'); }));
      dr.addEventListener('drop', e => lerPDF(e.dataTransfer.files[0]));
    },
    agenda() { $('#agendaCat').addEventListener('change', e => { agendaCat = e.target.value; render(); }); },
    assistente() {
      const m = $('#msgs'); m.scrollTop = m.scrollHeight;
      $('#chat-f').addEventListener('submit', e => { e.preventDefault(); perguntar($('#chat-q').value); setTimeout(() => { const q = $('#chat-q'); if (q) q.focus(); }, 0); });
    },
    plano() { simOut(); $('#sim').addEventListener('input', e => { simN = Number(e.target.value); simOut(); }); },
    equipe() { carregarSessoes(); },
    parametros() {
      UI.ligarEditorImagens('/api/haras/imagens', async () => { await recarregar(); render(); });
      $('#logo-arq').addEventListener('change', async e => {
        const f = e.target.files[0]; e.target.value = ''; if (!f) return;
        try { const img = await UI.prepararLogo(f); if (await executar(null, () => API.put('/api/haras/logo', { imagem: img }))) render(); }
        catch (err) { UI.toast(err.message); }
      });
    },
    auditoria() {
      carregarAuditoria();
      $('#aud-f').addEventListener('submit', e => { e.preventDefault(); audF.acao = $('#af-acao').value; audF.texto = $('#af-texto').value.trim(); audF.de = $('#af-de').value; audF.ate = $('#af-ate').value; carregarAuditoria(); });
    }
  };

  /* ================= AÇÕES ================= */
  const senhaForm = (id, rot) => '<div class="field"><label for="' + id + '">' + rot + '</label><input id="' + id + '" type="password" class="inp" autocomplete="new-password" minlength="8"></div>';
  const ACT = {
    nav: el => go(el.dataset.v),
    'agenda-ir': el => { agendaFiltro = el.dataset.f; go('agenda'); },
    'ver-animal': el => { fichaTab = 'prontuario'; filtroCat = 'todos'; UI.fechar(); go('ficha', el.dataset.id); },
    tab: el => { fichaTab = el.dataset.t; render(); },
    registrar: el => UI.formRegistro(S, { animalId: el.dataset.id || (view === 'ficha' ? param : undefined) }),
    'registrar-tarefa': el => { const t = H.tarefas(S).find(x => x.id === el.dataset.id); if (t) UI.formRegistro(S, UI.preDeTarefa(t)); },
    fechar: () => UI.fechar(),
    'rem-foto': el => UI.remFoto(Number(el.dataset.i)),
    'ver-foto': el => UI.verFoto(S, el.dataset.r, Number(el.dataset.i)),
    'salvar-registro': async el => {
      const r = UI.lerRegistro(S); if (!r) return;
      if (await executar(el, () => API.post('/api/registros', r))) { UI.fechar(); render(); }
    },
    'excluir-reg': el => confirmar(el, 'Confirmar exclusão', async () => { if (await executar(el, () => API.del('/api/registros/' + el.dataset.id))) render(); }),
    'novo-animal': () => {
      if (S.animais.filter(a => a.vivo).length >= S.limiteAnimais) { UI.toast('Limite de ' + S.limiteAnimais + ' animais ativos atingido.'); return; }
      UI.abrir({
        titulo: 'Novo animal', corpo: '<form id="fa" class="fgrid" novalidate>' +
          '<div class="field full"><label for="n-nome">Nome</label><input id="n-nome" class="inp"></div>' +
          '<div class="field"><label for="n-sexo">Sexo</label><select id="n-sexo" class="inp"><option value="F">Fêmea</option><option value="M">Macho</option></select></div>' +
          '<div class="field"><label for="n-nasc">Nascimento</label><input id="n-nasc" type="date" class="inp" max="' + H.iso(H.hoje()) + '"></div>' +
          '<div class="field"><label for="n-reg">Registro ABCCMM</label><input id="n-reg" class="inp" placeholder="Deixe vazio se ainda não registrado"></div>' +
          '<div class="field"><label for="n-chip">Microchip</label><input id="n-chip" class="inp" inputmode="numeric"></div>' +
          '<div class="field"><label for="n-livro">Livro</label><input id="n-livro" class="inp" placeholder="Ex.: MM6 - DEFINITIVO FECHADO FÊMEA"></div>' +
          '<div class="field"><label for="n-dna">DNA</label><select id="n-dna" class="inp"><option>Sem exame</option><option>DNA - VP</option></select></div>' +
          '<p class="note full" id="n-erro" hidden></p></form>',
        rodape: '<button class="btn" data-act="fechar">Cancelar</button><button class="btn pri" data-act="salvar-novo-animal">' + IC.check + 'Cadastrar</button>'
      });
    },
    'salvar-novo-animal': async el => {
      const v = id => document.getElementById(id).value.trim();
      const err = m => { const e = $('#n-erro'); e.textContent = m; e.className = 'note bad full'; e.hidden = false; };
      if (!v('n-nome')) return err('Informe o nome do animal.');
      if (!v('n-nasc')) return err('Informe a data de nascimento. Ela é a base da agenda sanitária.');
      const r = await executar(el, () => API.post('/api/animais', { nome: v('n-nome'), sexo: v('n-sexo'), nascimento: v('n-nasc'), registro: v('n-reg'), chip: v('n-chip'), livro: v('n-livro'), dna: v('n-dna'), vivo: true, bloqueado: false }));
      if (r) { UI.fechar(); fichaTab = 'agenda'; go('ficha', r.id); }
    },
    'salvar-dados': async el => {
      const a = H.animal(S, el.dataset.id); if (!a) return;
      const v = id => document.getElementById('d-' + id).value.trim();
      if (!v('nome')) { UI.toast('O nome não pode ficar vazio.'); return; }
      if (!v('nasc')) { UI.toast('Informe a data de nascimento.'); return; }
      const genealogia = {}; ['pai', 'mae', 'avoPaterno', 'avoPaterna', 'avoMaterno', 'avoMaterna'].forEach(k => { genealogia[k] = v(k); });
      if (await executar(el, () => API.put('/api/animais/' + a.id, { nome: v('nome'), pelagem: v('pelagem'), registro: v('registro'), livro: v('livro'), sexo: v('sexo'), nascimento: v('nasc'), chip: v('chip'), dna: v('dna'), vivo: v('vivo') === '1', bloqueado: v('bloq') === '1', genealogia }))) render();
    },
    'imp-cancelar': () => { importacao = null; render(); },
    'imp-confirmar': el => confirmarImportacao(el),
    'agenda-f': el => { agendaFiltro = el.dataset.f; render(); },
    raiva: async el => { const sem = el.dataset.v === '1'; if (await executar(el, () => API.put('/api/haras', { raivaSemestral: sem }), 'Reforço da raiva: ' + (sem ? 'semestral' : 'anual') + '. Agenda recalculada.')) render(); },
    'salvar-prot': el => salvarProtocolos(el),
    'restaurar-prot': el => confirmar(el, 'Confirmar restauração', async () => { if (await executar(el, () => API.post('/api/protocolos/restaurar'))) render(); }),
    'notif-f': el => { notifFiltro = el.dataset.f; render(); },
    ler: async el => { if (await executar(el, () => API.post('/api/notificacoes/lidas', { ids: [el.dataset.id] }), false)) render(); },
    'ler-todas': async el => { const ids = H.notificacoes(S).map(n => n.id).filter(id => !S.lidas.includes(id)); if (!ids.length) return; if (await executar(el, () => API.post('/api/notificacoes/lidas', { ids }), 'Notificações marcadas como lidas.')) render(); },
    convidar: () => UI.abrir({
      titulo: 'Adicionar usuário', corpo: '<form class="fgrid" novalidate><div class="field full"><label for="u-nome">Nome</label><input id="u-nome" class="inp"></div><div class="field full"><label for="u-email">E-mail (login)</label><input id="u-email" type="email" class="inp"></div><div class="field"><label for="u-perfil">Perfil</label><select id="u-perfil" class="inp"><option value="operador">Caseiro / operador de campo</option><option value="gestor">Proprietário / gestor</option></select></div>' + senhaForm('u-senha', 'Senha inicial (mín. 8)') + '<p class="note full" id="u-erro" hidden></p></form><p class="small muted">Passe o endereço do portal, o e-mail e a senha inicial para a pessoa. Ela pode trocar a senha depois.</p>',
      rodape: '<button class="btn" data-act="fechar">Cancelar</button><button class="btn pri" data-act="salvar-usuario">Adicionar</button>'
    }),
    'salvar-usuario': async el => {
      const v = id => document.getElementById(id).value.trim();
      const err = m => { const e = $('#u-erro'); e.textContent = m; e.className = 'note bad full'; e.hidden = false; };
      if (!v('u-nome')) return err('Informe o nome.');
      if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v('u-email'))) return err('Informe um e-mail válido.');
      if (document.getElementById('u-senha').value.length < 8) return err('A senha inicial precisa ter pelo menos 8 caracteres.');
      if (await executar(el, () => API.post('/api/usuarios', { nome: v('u-nome'), email: v('u-email'), perfil: v('u-perfil'), senha: document.getElementById('u-senha').value }))) { UI.fechar(); render(); }
    },
    'toggle-user': async el => { const u = (S.usuarios || []).find(x => String(x.id) === el.dataset.id); if (!u) return; if (await executar(el, () => API.patch('/api/usuarios/' + u.id, { ativo: !u.ativo }), u.nome + (u.ativo ? ' desativado.' : ' reativado.'))) render(); },
    'senha-user': el => {
      const u = (S.usuarios || []).find(x => String(x.id) === el.dataset.id); if (!u) return;
      UI.abrir({ titulo: 'Redefinir senha de ' + esc(u.nome), corpo: '<form class="stack" novalidate>' + senhaForm('r-senha', 'Nova senha (mín. 8)') + '<input type="hidden" id="r-uid" value="' + u.id + '"></form>', rodape: '<button class="btn" data-act="fechar">Cancelar</button><button class="btn pri" data-act="salvar-senha-user">Redefinir</button>' });
    },
    'salvar-senha-user': async el => {
      const s = document.getElementById('r-senha').value; if (s.length < 8) { UI.toast('A senha precisa ter pelo menos 8 caracteres.'); return; }
      if (await executar(el, () => API.post('/api/usuarios/' + document.getElementById('r-uid').value + '/senha', { senha: s }))) UI.fechar();
    },
    'minha-senha': () => UI.abrir({ titulo: 'Alterar minha senha', corpo: '<form class="stack" novalidate><div class="field"><label for="m-atual">Senha atual</label><input id="m-atual" type="password" class="inp" autocomplete="current-password"></div>' + senhaForm('m-nova', 'Nova senha (mín. 8)') + '</form>', rodape: '<button class="btn" data-act="fechar">Cancelar</button><button class="btn pri" data-act="salvar-minha-senha">Alterar</button>' }),
    'salvar-minha-senha': async el => {
      const n = document.getElementById('m-nova').value; if (n.length < 8) { UI.toast('A nova senha precisa ter pelo menos 8 caracteres.'); return; }
      if (await executar(el, () => API.post('/api/me/senha', { atual: document.getElementById('m-atual').value, nova: n }), 'Senha alterada.')) UI.fechar();
    },
    sair: async () => { try { await API.post('/api/logout'); } catch (e) { } location.href = '/entrar'; },
    sug: el => perguntar(el.dataset.q),
    'fora-plano': el => UI.toast(el.dataset.m + ' não está incluído no plano deste haras.'),
    'em-breve': el => UI.toast(el.dataset.m + ' chega na próxima versão (v1.4.0).'),
    'recarregar-sessoes': () => carregarSessoes(),
    'vincular-celular': async el => {
      const u = (S.usuarios || []).find(x => String(x.id) === el.dataset.id);
      let r; try { el.disabled = true; r = await API.post('/api/usuarios/' + u.id + '/vinculo'); } catch (e) { UI.toast(e.message); return; } finally { el.disabled = false; }
      UI.abrir({ titulo: 'Vincular o celular de ' + esc(u.nome), corpo: '<div class="stack">' +
        (r.instalar ? '<details class="instalar-app"><summary><b>1. O app ainda não está no celular?</b> Toque aqui</summary><p class="small">Leia este código com a <b>câmera</b> do celular do caseiro (ou abra <a class="mono" href="' + esc(r.instalar.link) + '">' + esc(r.instalar.link) + '</a>) e instale. Se o Android pedir, permita instalar apps desta origem.</p><div class="qr-box qr-pequeno">' + r.instalar.qr + '</div></details>'
          : '<p class="small muted">O APK ainda não está neste servidor: ele chega com o pacote de atualização da versão.</p>') +
        '<ol class="passos" start="2"><li>Abra o app Haras360 e toque em <b>Ler QR Code</b>.</li><li>Aponte o celular para o código abaixo.</li></ol>' +
        '<div class="qr-box">' + r.qr + '</div><p class="small muted">Vale por ' + r.minutos + ' minutos e uma única vez. Gerar outro invalida este.</p>' +
        '<details><summary class="small">Sem câmera? Digite no app</summary><p class="small">Servidor: <span class="mono">' + esc(r.servidor) + '</span><br>Código: <span class="mono">' + esc(r.codigo) + '</span></p></details>' +
        '<p class="note">O celular aparece em Sessões e aparelhos ativos, onde você pode encerrá-lo a qualquer momento.</p></div>',
        rodape: '<button class="btn pri" data-act="fechar">Concluir</button>' });
      UI.onClose = () => carregarSessoes();
    },
    'encerrar-sessao': el => confirmar(el, 'Confirmar', async () => { try { const r = await API.del('/api/sessoes/' + el.dataset.id); UI.toast(r.resumo); carregarSessoes(); } catch (e) { UI.toast(e.message); } }),
    'dois-fatores-user': el => { const u = (S.usuarios || []).find(x => String(x.id) === el.dataset.id); confirmar(el, 'Confirmar redefinição', async () => { if (await executar(el, () => API.post('/api/usuarios/' + u.id + '/2fa/redefinir'))) render(); }); },
    'novos-codigos': () => UI.abrir({ titulo: 'Novos códigos de recuperação', corpo: '<form class="stack" novalidate><p>Os códigos atuais deixam de valer. Confirme sua senha.</p><div class="field"><label for="nc-senha">Senha</label><input id="nc-senha" type="password" class="inp" autocomplete="current-password"></div></form>', rodape: '<button class="btn" data-act="fechar">Cancelar</button><button class="btn pri" data-act="gerar-codigos">Gerar</button>' }),
    'gerar-codigos': async el => { try { el.disabled = true; const r = await API.post('/api/me/codigos-recuperacao', { senha: document.getElementById('nc-senha').value }); UI.fechar(); UI.mostrarCodigos(r.codigos); } catch (e) { el.disabled = false; UI.toast(e.message); } },
    'img-padrao': el => confirmar(el, 'Confirmar', async () => { if (await executar(el, () => API.del('/api/haras/imagens/' + el.dataset.tipo))) render(); }),
    'remover-logo': el => confirmar(el, 'Confirmar remoção', async () => { if (await executar(el, () => API.del('/api/haras/logo'))) render(); }),
    'pa-raiva': el => { document.querySelectorAll('[data-act="pa-raiva"]').forEach(b => b.setAttribute('aria-pressed', String(b === el))); },
    'salvar-params': async el => {
      const g = Number($('#pa-gest').value), t = Number($('#pa-tol').value);
      if (!(g >= 300 && g <= 380)) { UI.toast('Dias de gestação devem ficar entre 300 e 380.'); return; }
      if (!(t >= 0 && t <= 90)) { UI.toast('A tolerância deve ficar entre 0 e 90 dias.'); return; }
      const sem = document.querySelector('[data-act="pa-raiva"][aria-pressed="true"]').dataset.v === '1';
      if (await executar(el, () => API.put('/api/haras', { nome: $('#pa-nome').value, municipio: $('#pa-mun').value, proprietario: $('#pa-prop').value, raivaSemestral: sem, gestacaoDias: g, toleranciaReinicio: t }))) render();
    }
  };
  document.addEventListener('click', e => {
    const el = e.target.closest('[data-act]'); if (!el) return;
    const f = ACT[el.dataset.act]; if (!f) return;
    if (el.tagName === 'A' || el.tagName === 'TR' || el.closest('form')) e.preventDefault();
    f(el, e);
  });
  document.addEventListener('change', async e => {
    const el = e.target.closest('[data-chg]'); if (!el) return;
    if (el.dataset.chg === 'imp-sel') { const i = Number(el.dataset.i); el.checked ? importacao.sel.add(i) : importacao.sel.delete(i); render(); }
    if (el.dataset.chg === 'pref') {
      const p = JSON.parse(JSON.stringify(S.notifPrefs)); p[el.dataset.t][el.dataset.k] = el.checked;
      if (await executar(null, () => API.put('/api/notif-prefs', p), 'Preferência salva.')) render();
    }
  });
  (async () => {
    $('#view').innerHTML = '<div class="empty">Carregando o haras...</div>';
    try {
      await recarregar();
      if (S.usuario.perfil !== 'gestor') { location.href = '/campo'; return; }
      render();
    } catch (e) {
      if (/usuários de um haras/.test(e.message)) { location.href = '/admin'; return; }
      $('#view').innerHTML = '<div class="note bad">' + esc(e.message) + '</div>';
    }
  })();
})();
</script>
