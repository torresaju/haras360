<title>Haras360 Gestor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/*SHARED_CSS*/
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px 20px}
.facts div{display:flex;flex-direction:column;gap:2px;min-width:0}
.facts dt{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.facts dd{margin:0;font-weight:500;overflow-wrap:anywhere}
.steps{display:flex;gap:6px;flex-wrap:wrap;font-size:.84rem}
.steps span{padding:4px 10px;border-radius:99px;background:var(--surface-2);color:var(--muted);font-weight:600}
.steps span.on{background:var(--accent-soft);color:var(--accent)}
.notif{display:grid;grid-template-columns:4px minmax(0,1fr) auto;gap:14px;padding:13px 16px 13px 0;border-top:1px solid var(--line-2);align-items:start}
.notif:first-child{border-top:0}
.notif .bar{align-self:stretch;border-radius:0 3px 3px 0;background:var(--info)}
.notif.critico .bar{background:var(--late)} .notif.alerta .bar{background:var(--soon)}
.notif.lida{opacity:.62}
.notif .ch{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.meter{height:10px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line-2);overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent)}
.matrix td:not(:first-child),.matrix th:not(:first-child){text-align:center}
.yes{color:var(--ok);font-weight:700} .no{color:var(--muted)}
input[type=range]{width:100%;accent-color:var(--accent)}
.tbl input.inp{padding:6px 8px;font-size:.88rem}
.w-num{width:84px}
.kv{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 16px;align-items:center}
.kv .field{max-width:180px}
.aud td{vertical-align:top}
.aud .det{font-size:.8rem;color:var(--muted);white-space:pre-wrap;overflow-wrap:anywhere;max-width:420px}
.glos dt{font-weight:700;margin-top:12px}
.glos dd{margin:2px 0 0;color:var(--muted)}
/* v1.6.0: certificado, externos e vendas */
.arvore{display:grid;grid-template-columns:repeat(4,minmax(160px,1fr));column-gap:10px;row-gap:4px;overflow-x:auto;padding-bottom:4px;align-items:center}
.arvore>small{font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.arvore .no{border:1px solid var(--line-2);border-left:3px solid var(--accent);border-radius:6px;padding:5px 8px;font-size:.78rem;line-height:1.25;background:var(--surface)}
.arvore .no.f{border-left-color:#D5A064}
.arvore .no span{display:block;color:var(--muted);font-family:var(--f-mono,monospace);font-size:.7rem}
.receber{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;cursor:pointer;font:inherit}
.receber b{color:var(--ink)}
.venda{border-top:1px solid var(--line-2);padding:14px 0}
.venda:first-child{border-top:0;padding-top:0}
.dif td:nth-child(2){color:var(--muted);text-decoration:line-through}
.dif td:nth-child(3){color:var(--ok);font-weight:600}
.secao-venda{border-top:1px solid var(--line-2);padding-top:12px;margin-top:4px}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"></script>

<header class="topbar" id="topbar"></header>
<main class="wrapm">
  <div class="pagehead">
    <div><div class="eyebrow" id="v-eyebrow"></div><h1 id="v-title"></h1></div>
    <div class="acts" id="v-acts"><button class="btn pri" data-act="registrar">+ Novo registro</button></div>
  </div>
  <div id="view" class="view-in"></div>
</main>
<div id="modal" class="modal" hidden></div>
<div id="toast" role="status" hidden></div>

<script>
(function () {
  let S = null;
  const $ = s => document.querySelector(s);
  const esc = H.esc, br = H.br, IC = UI.ICON;
  let view = 'painel', param = null, fichaTab = 'prontuario', filtroCat = 'todos', agendaFiltro = 'aberto', agendaCat = 'todos', notifFiltro = 'todas';
  let importacao = null;
  let chat = [{ de: 'bot', t: 'Olá. Sou o assistente ABCCMM do Haras360. Consulto o plantel, a agenda sanitária e o protocolo de vacinação. Nesta versão, as respostas sobre normas da associação usam uma base reduzida.', f: 'Haras360' }];

  async function recarregar() { S = await API.get('/api/estado'); H.LIMITE_ANIMAIS = S.limiteAnimais; }
  /* executa uma alteração na API, recarrega o estado e redesenha */
  async function executar(el, fn, ok) {
    if (el && el.disabled) return null;
    const txt = el ? el.innerHTML : '';
    if (el) { el.disabled = true; el.innerHTML = 'Salvando...'; }
    try {
      const r = await fn();
      await recarregar();
      if (ok !== false) UI.toast(typeof ok === 'string' ? ok : (r && r.resumo) || 'Alteração salva.');
      return r || true;
    } catch (e) { UI.toast(e.message); return null; }
    finally { if (el && el.isConnected) { el.disabled = false; el.innerHTML = txt; } }
  }
  const confirmar = UI.confirmar;
  const naoLidas = () => H.notificacoes(S).filter(n => !S.lidas.includes(n.id));
  const primeiroNome = () => (S.usuario.nome || '').split(' ')[0];

  const modOn = m => !S.plano || S.plano.modulos[m] !== false;
  function menu() {
    return [
      { id: 'painel', rotulo: 'Dashboard', ic: 'dash' },
      { grupo: 'Animais', ic: 'cavalo', itens: [{ id: 'animais', rotulo: 'Plantel', tambem: ['ficha'] }, { id: 'importar', rotulo: 'Importar ABCCMM', off: !modOn('importacao') }, { id: 'vendas', rotulo: 'Vendas' }] },
      { grupo: 'Sanidade', ic: 'escudo', itens: [{ id: 'sanidade', rotulo: 'Vacinas e manejos' }, { id: 'protocolos', rotulo: 'Protocolos' }] },
      { id: 'reproducao', rotulo: 'Reprodução', ic: 'repro' },
      { id: 'agenda', rotulo: 'Agenda', ic: 'agenda' },
      { id: 'relatorios', rotulo: 'Relatórios', ic: 'graf', off: !modOn('relatorios') },
      { grupo: 'Administração', ic: 'engr', itens: [{ id: 'equipe', rotulo: 'Equipe' }, { id: 'parametros', rotulo: 'Parametrizações', tambem: ['imagens'] }, { id: 'auditoria', rotulo: 'Auditoria' }, { id: 'assistente', rotulo: 'Assistente', off: !modOn('assistente') }, { id: 'plano', rotulo: 'Plano' }] },
      { grupo: 'Ajuda', ic: 'ajuda', itens: [{ id: 'sobre', rotulo: 'Sobre' }, { href: '/ajuda', rotulo: 'Manual' }, { id: 'glossario', rotulo: 'Glossário' }, { id: 'normas', rotulo: 'Normas da ABCCMM' }] }
    ];
  }
  const TITULOS = {
    painel: ['Visão geral do rebanho, sanidade e reprodução', 'Dashboard'], animais: ['Animais', 'Plantel'], sanidade: ['Sanidade', 'Vacinas e manejos'], reproducao: ['Reprodução', 'Gestações, cios e coberturas'], relatorios: ['Desempenho do haras', 'Relatórios'], imagens: ['Parametrizações', 'Imagens do haras'], ficha: ['Ficha do animal', ''], importar: ['Plantel', 'Importar da ABCCMM'],
    agenda: ['Agenda', 'Próximos eventos e prazos'], protocolos: ['Sanidade', 'Protocolos e intervalos'], notificacoes: ['Alertas', 'Notificações'],
    equipe: ['Usuários, perfis e sessões', 'Equipe do haras'], assistente: ['Inteligência artificial', 'Assistente ABCCMM'], plano: ['Administração', 'Plano e cobrança'],
    parametros: ['Administração', 'Parametrizações do haras'], auditoria: ['Administração', 'Auditoria'], sobre: ['Ajuda', 'Sobre o Haras360'], glossario: ['Ajuda', 'Glossário'], normas: ['Ajuda', 'Normas da ABCCMM'], vendas: ['Animais', 'Vendas e recebimentos']
  };

  function go(v, p) {
    if ((v === 'importar' && !modOn('importacao')) || (v === 'assistente' && !modOn('assistente')) || (v === 'relatorios' && !modOn('relatorios'))) { UI.toast('Este módulo não está incluído no plano do haras.'); return; }
    view = v; param = p || null; if (v === 'ficha' && !p) view = 'animais'; render(); window.scrollTo(0, 0);
  }

  function render() {
    const nl = naoLidas().length;
    $('#topbar').innerHTML = UI.topbar({ menu: menu(), atual: view, home: '/gestor', sub: S.haras.nome, haras: S.haras, marca: S.imagens.logo, cabecalho: S.imagens.cabecalho, usuario: S.usuario, perfilTxt: 'Gestor', sino: { view: 'notificacoes', n: nl },
      usuarioItens: [{ act: 'minha-senha', rotulo: 'Alterar minha senha' }, { act: 'novos-codigos', rotulo: 'Novos códigos de recuperação do 2FA' }] });
    const [eb, ti0] = TITULOS[view] || ['', ''];
    const ti = ti0;
    $('#v-eyebrow').textContent = eb;
    $('#v-title').textContent = view === 'ficha' ? ((H.animal(S, param) || {}).nome || 'Animal') : ti;
    $('#v-acts').hidden = ['parametros', 'auditoria', 'sobre', 'glossario', 'plano', 'equipe', 'relatorios', 'normas', 'vendas'].includes(view);
    document.title = 'Haras360 · ' + ($('#v-title').textContent || 'Gestor');
    const v = $('#view');
    v.classList.remove('view-in'); void v.offsetWidth; v.classList.add('view-in');
    v.innerHTML = VIEWS[view](param);
    if (AFTER[view]) AFTER[view](param);
  }

  /* ================= PAINEL ================= */
  const SANITARIOS = ['vacina', 'vermifugacao', 'exame', 'odontologia', 'ferrageamento'];
  function categoriasRebanho(ativos) {
    const c = { eguas: 0, machos: 0, potros: 0, outros: 0 };
    ativos.forEach(a => { if (!a.nascimento) c.outros++; else if (H.idadeMeses(a.nascimento) < 24) c.potros++; else if (a.sexo === 'F') c.eguas++; else c.machos++; });
    return c;
  }
  function rosca(partes, total) {
    const R0 = 52, C = 2 * Math.PI * R0; let acc = 0;
    const arcos = partes.filter(p => p.n).map(p => { const l = C * p.n / total; const a = '<circle cx="70" cy="70" r="' + R0 + '" fill="none" stroke="' + p.cor + '" stroke-width="18" stroke-dasharray="' + l.toFixed(2) + ' ' + (C - l).toFixed(2) + '" stroke-dashoffset="' + (-acc).toFixed(2) + '" transform="rotate(-90 70 70)"/>'; acc += l; return a; }).join('');
    return '<svg class="rosca" viewBox="0 0 140 140" role="img" aria-label="' + partes.map(p => p.rot + ': ' + p.n).join(', ') + '"><circle cx="70" cy="70" r="' + R0 + '" fill="none" stroke="var(--line-2)" stroke-width="18"/>' + arcos +
      '<text x="70" y="70" text-anchor="middle" class="rosca-n">' + total + '</text><text x="70" y="90" text-anchor="middle" class="rosca-t">Animais</text></svg>';
  }
  function vPainel() {
    const ts = H.tarefas(S);
    const atras = ts.filter(t => t.status === 'atrasado'), pend = ts.filter(t => t.doc);
    const vacAtr = atras.filter(t => t.cat === 'vacina'), vac7 = ts.filter(t => t.cat === 'vacina' && (t.status === 'hoje' || t.status === 'semana'));
    const ativos = S.animais.filter(a => a.vivo), n = ativos.length;
    const gest = ativos.map(a => [a, H.gestacao(S, a)]).filter(x => x[1]);
    const lim30 = H.iso(H.addDias(H.hoje(), 30)), hojeIso = H.iso(H.hoje());
    const partos = gest.filter(([, g]) => g.parto >= hojeIso && g.parto <= lim30);
    const proximos = ts.filter(t => !t.doc && t.status !== 'atrasado').slice(0, 6);
    const campo = S.registros.filter(r => r.origem !== 'Portal Gestor' && r.origem !== 'App do gestor').sort((a, b) => a.data < b.data ? 1 : -1).slice(0, 4);
    const mes = hojeIso.slice(0, 7);
    const repMes = S.registros.filter(r => r.tipo === 'reprodutivo' && (r.data || '').startsWith(mes));
    const conta = ev => repMes.filter(r => r.evento === ev).length;
    const cat = categoriasRebanho(ativos);
    const partes = [{ rot: 'Éguas', n: cat.eguas, cor: '#193D30' }, { rot: 'Machos', n: cat.machos, cor: '#4E8A66' }, { rot: 'Potros', n: cat.potros, cor: '#D5A064' }, { rot: 'Outros', n: cat.outros, cor: '#82978A' }];
    const pct = x => n ? Math.round(x / n * 100) + '%' : '0%';
    const kpi = (cls, ic, num, rot, act) => '<button class="kpi2 ' + cls + '" ' + act + '><span class="kpi-ic">' + UI.ICON[ic] + '</span><span><b>' + num + '</b><span>' + rot + '</span></span></button>';
    const evento = t => { const dd = t.due || ''; return '<button class="pev" data-act="ver-animal" data-id="' + t.animalId + '"><span class="ev-d"><b>' + dd.slice(8, 10) + '</b><small>' + (H.brCurta(dd).split(' ')[1] || '').toUpperCase() + '</small></span><span class="ev-ic">' + UI.ICON[t.cat === 'vacina' ? 'vacina' : t.cat === 'reprodutivo' ? 'repro' : 'escudo'] + '</span><span class="ev-t"><b>' + esc(t.titulo) + '</b><small>' + esc(t.animal) + (t.status === 'hoje' ? ' · hoje' : '') + '</small></span></button>'; };
    return '<div class="sec">' +
      '<div class="spread"><p class="muted">' + saudacao() + ', ' + esc(primeiroNome()) + '.</p><span class="data-chip">' + UI.ICON.agenda + new Date().toLocaleDateString('pt-BR', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }) + '</span></div>' +
      '<div class="kpis5">' +
      kpi('k-ok', 'cavalo', n, 'Animais', 'data-act="nav" data-v="animais"') +
      kpi('k-late', 'escudo', vacAtr.length, 'Vacinas vencidas', 'data-act="nav" data-v="sanidade"') +
      kpi('k-soon', 'agenda', vac7.length, 'Vacinas (7 dias)', 'data-act="nav" data-v="sanidade"') +
      kpi('k-repro', 'repro', gest.length, 'Gestações ativas', 'data-act="nav" data-v="reproducao"') +
      kpi('k-info', 'cavalo', partos.length, 'Previsão de parto (30 dias)', 'data-act="nav" data-v="reproducao"') +
      '</div>' + aReceber() +
      '<div class="grid3">' +
      '<div class="card"><div class="card-h"><h3>' + UI.ICON.agenda + 'Próximos eventos</h3><button class="btn ghost sm" data-act="nav" data-v="agenda">Ver agenda →</button></div>' + (proximos.length ? '<div class="pevs">' + proximos.map(evento).join('') + '</div>' : '<p class="muted small">Nada previsto.</p>') + '</div>' +
      '<div class="card"><div class="card-h"><h3>Rebanho por categoria</h3></div><div class="rosca-w">' + rosca(partes, n) + '<ul class="leg">' + partes.map(p => '<li><i style="background:' + p.cor + '"></i>' + p.rot + '<b>' + p.n + ' <small>(' + pct(p.n) + ')</small></b></li>').join('') + '</ul></div><p class="small muted">Potros: até 2 anos. Outros: sem data de nascimento.</p></div>' +
      '<div class="card"><div class="card-h"><h3>' + UI.ICON.repro + 'Situação reprodutiva</h3></div><dl class="lst">' +
      '<div><dt>Gestações ativas</dt><dd>' + gest.length + '</dd></div><div><dt>Coberturas no mês</dt><dd>' + conta('Cobertura') + '</dd></div><div><dt>Inseminações no mês</dt><dd>' + conta('Inseminação') + '</dd></div><div><dt>Previsão de parto (30 dias)</dt><dd>' + partos.length + '</dd></div></dl></div>' +
      '</div>' +
      '<div class="grid2">' +
      '<div class="card flush"><div class="card-h" style="padding:16px 18px 0"><h3>Atenção agora</h3><span class="small muted">' + atras.length + ' atrasado' + (atras.length === 1 ? '' : 's') + ' · ' + pend.length + ' pendência' + (pend.length === 1 ? '' : 's') + ' ABCCMM</span></div>' +
      '<div class="tasks" style="padding:4px 18px 8px 0">' + (atras.length + pend.length ? atras.concat(pend).slice(0, 8).map(t => UI.linhaTarefa(t)).join('') : '<div class="empty">Nada atrasado nem pendente. Bom trabalho.</div>') + '</div></div>' +
      '<div class="card"><div class="card-h"><h3>Últimos registros do campo</h3><span class="small muted">Caseiro</span></div>' + UI.linhaTempo(S, campo, { comAnimal: true }) + '</div>' +
      '</div>' +
      '<div class="banner">' + UI.fundo(S.imagens.banner, 'banner-img') + '<div class="banner-in"><span class="banner-ic">' + UI.ICON.graf + '</span><div><h2>Desempenho do haras</h2><p>Acompanhe a sanidade, a reprodução e o histórico de cada animal em um só lugar.</p></div>' +
      (modOn('relatorios') ? '<button class="btn gold" data-act="nav" data-v="relatorios">Ver relatórios</button>' : '') + '</div></div>' +
      '<p class="small muted">' + n + ' de ' + H.LIMITE_ANIMAIS + ' animais no plano ' + esc(S.plano.nome) + ' · mensalidade ' + (mensal(n) === null ? 'a definir' : H.moeda(mensal(n))) + ' · <a href="#" data-act="nav" data-v="plano">ver plano</a></p>' +
      '</div>';
  }
  /* v1.6.0: valores a receber das vendas parceladas (só o gestor recebe S.vendas) */
  const reais = c => H.moeda((c || 0) / 100);
  function aReceber() {
    const ab = (S.vendas || []).flatMap(v => v.parcelas.filter(p => !p.pagoEm));
    if (!ab.length) return '';
    const atr = ab.filter(p => p.situacao === 'atrasada'), vence = ab.filter(p => p.situacao === 'vence');
    return '<button class="note receber' + (atr.length ? ' bad' : vence.length ? ' warn' : '') + '" data-act="nav" data-v="vendas"><span><b>A receber: ' + reais(ab.reduce((s, p) => s + p.valor, 0)) + '</b> · ' + ab.length + ' parcela(s) em aberto' +
      (atr.length ? ' · ' + atr.length + ' em atraso (' + reais(atr.reduce((s, p) => s + p.valor, 0)) + ')' : '') + (vence.length ? ' · ' + vence.length + ' vence(m) em 7 dias' : '') + '</span><span>Ver vendas →</span></button>';
  }
  function saudacao() { const h = new Date().getHours(); return h < 12 ? 'Bom dia' : h < 18 ? 'Boa tarde' : 'Boa noite'; }
  function vSanidade() { return vAgenda('sanidade'); }
  function vReproducao() {
    const ativos = S.animais.filter(a => a.vivo);
    const gest = ativos.map(a => [a, H.gestacao(S, a)]).filter(x => x[1]).sort((x, y) => x[1].parto < y[1].parto ? -1 : 1);
    const ts = H.tarefas(S).filter(t => t.cat === 'reprodutivo' || t.parto);
    const cios = ts.filter(t => t.cio);
    const regs = S.registros.filter(r => r.tipo === 'reprodutivo').sort((a, b) => a.data < b.data ? 1 : -1).slice(0, 12);
    return '<div class="sec">' +
      '<div class="card"><div class="card-h"><h3>' + UI.ICON.repro + 'Gestações</h3><span class="small muted">' + gest.length + ' em andamento</span></div>' +
      (gest.length ? gest.map(([a, g]) => gestBloco(a, g)).join('<hr class="div">') : '<p class="muted small">Nenhuma égua com diagnóstico positivo registrado.</p>') + '</div>' +
      '<div class="card flush"><div class="card-h" style="padding:16px 18px 0"><h3>Próximas etapas reprodutivas</h3></div><div class="tasks" style="padding:4px 18px 8px 0">' + (ts.length ? ts.slice(0, 10).map(t => UI.linhaTarefa(t)).join('') : '<div class="empty">Nada previsto.</div>') + '</div></div>' +
      '<div class="card"><div class="card-h"><h3>Últimos eventos</h3><button class="btn ghost sm" data-act="registrar">' + IC.plus + 'Registrar</button></div>' + UI.linhaTempo(S, regs, { comAnimal: true }) + '</div>' +
      '<p class="small muted">' + (S.haras.previsaoCio ? 'Previsão do cio ligada: ciclo de ' + S.haras.cicloDias + ' dias e cio do potro do ' + S.haras.cioPotroDe + 'º ao ' + S.haras.cioPotroAte + 'º dia após o parto (' + cios.length + ' égua(s) com previsão). ' : 'Previsão do cio desligada. ') + 'Ajuste em <a href="#" data-act="nav" data-v="parametros">Parametrizações</a>.</p></div>';
  }
  function gestBloco(a, g) {
    return '<div class="gest"><div class="spread"><a href="#" data-act="ver-animal" data-id="' + a.id + '"><b>' + esc(a.nome) + '</b></a><span class="chip c-accent">' + g.mes + 'º mês · ' + g.dias + ' dias</span></div>' +
      '<div class="gbar" role="img" aria-label="' + g.pct + '% da gestação"><i style="width:' + g.pct + '%"></i></div>' +
      '<div class="gmarks"><span>Cobertura ' + H.brCurta(g.cobertura) + '</span><span>Rino 5º · 7º · 9º</span><span>Parto ' + H.brCurta(g.parto) + '</span></div>' +
      '<p class="small muted">Parto previsto ' + H.relativo(g.parto) + (g.garanhao ? ' · garanhão ' + esc(g.garanhao) : '') + '</p></div>';
  }

  /* ================= RELATÓRIOS (v1.4.0) ================= */
  let relTipo = 'sanitario', relF = { de: '', ate: '', animal: '', categoria: '' }, relSeq = 0;
  const REL_TABS = [['sanitario', 'Sanitário'], ['reprodutivo', 'Reprodutivo'], ['plantel', 'Plantel'], ['campo', 'Atividade do campo'], ['vendas', 'Vendas']];
  const relQuery = () => new URLSearchParams(Object.entries(relF).filter(([, v]) => v)).toString();
  function vRelatorios() {
    const animais = S.animais.slice().sort((a, b) => a.nome < b.nome ? -1 : 1);
    return '<div class="sec"><div class="card"><div class="tabs" role="tablist">' + REL_TABS.map(([k, l]) => '<button role="tab" aria-selected="' + (relTipo === k) + '" data-act="rel-tab" data-t="' + k + '">' + l + '</button>').join('') + '</div>' +

      '<div class="field"><label for="rf-animal">Animal</label><select id="rf-animal" class="inp"><option value="">Todos</option>' + animais.map(a => '<option value="' + a.id + '"' + (relF.animal === a.id ? ' selected' : '') + '>' + esc(a.nome) + (a.baixa ? ' (baixado)' : '') + '</option>').join('') + '</select></div>' +
      '<div class="field"><label for="rf-cat">Categoria</label><select id="rf-cat" class="inp">' + [['', 'Todas'], ['eguas', 'Éguas'], ['machos', 'Machos'], ['potros', 'Potros'], ['outros', 'Outros']].map(([k, l]) => '<option value="' + k + '"' + (relF.categoria === k ? ' selected' : '') + '>' + l + '</option>').join('') + '</select></div>' +
      '<div class="row rel-acoes"><button type="button" class="btn pri" data-act="rel-aplicar">Aplicar</button><button type="button" class="btn ghost" data-act="rel-limpar">Limpar</button>' +

  function lerFiltrosRel() { relF = { de: $('#rf-de').value, ate: $('#rf-ate').value, animal: $('#rf-animal').value, categoria: $('#rf-cat').value }; }
  async function carregarRel() {
    const seq = ++relSeq, q = relQuery();
    $('#rel-xlsx').href = '/api/relatorios/' + relTipo + '/exportar?formato=xlsx' + (q ? '&' + q : '');
    $('#rel-csv').href = '/api/relatorios/' + relTipo + '/exportar?formato=csv' + (q ? '&' + q : '');
    try {
      const r = await API.get('/api/relatorios/' + relTipo + (q ? '?' + q : ''));
      if (seq !== relSeq || !$('#rel-corpo')) return;
      if (!relF.de) $('#rf-de').value = r.periodo.de;
      if (!relF.ate) $('#rf-ate').value = r.periodo.ate;
      $('#rel-corpo').innerHTML = desenharRel(r);
    } catch (e) { if ($('#rel-corpo')) $('#rel-corpo').innerHTML = '<div class="note bad">' + esc(e.message) + '</div>'; }
  }
  const CORES_G = ['#193D30', '#D5A064', '#4E8A66', '#82978A', '#8A5E26', '#6B4E8C', '#2C5B84'];
  function grafico(g) {
    const total = g.serie.reduce((s, x) => s + (+x.valor || 0), 0);
    const aria = g.titulo + ': ' + g.serie.map(x => x.rotulo + ' ' + x.valor).join(', ');
    let corpo;
    if (!total) corpo = '<p class="muted small">Sem dados no período.</p>';
    else if (g.tipo === 'rosca') {
      const R0 = 52, C = 2 * Math.PI * R0; let acc = 0;
      const arcos = g.serie.map((p, i) => { if (!p.valor) return ''; const l = C * p.valor / total; const a = '<circle cx="70" cy="70" r="' + R0 + '" fill="none" stroke="' + CORES_G[i % CORES_G.length] + '" stroke-width="18" stroke-dasharray="' + l.toFixed(2) + ' ' + (C - l).toFixed(2) + '" stroke-dashoffset="' + (-acc).toFixed(2) + '" transform="rotate(-90 70 70)"/>'; acc += l; return a; }).join('');
      corpo = '<div class="rosca-w"><svg class="rosca" viewBox="0 0 140 140" role="img" aria-label="' + esc(aria) + '"><circle cx="70" cy="70" r="' + R0 + '" fill="none" stroke="var(--line-2)" stroke-width="18"/>' + arcos + '<text x="70" y="78" text-anchor="middle" class="rosca-n">' + total + '</text></svg>' +
        '<ul class="leg">' + g.serie.map((p, i) => '<li><i style="background:' + CORES_G[i % CORES_G.length] + '"></i>' + esc(p.rotulo) + '<b>' + p.valor + ' <small>(' + Math.round(p.valor / total * 100) + '%)</small></b></li>').join('') + '</ul></div>';
    } else if (g.tipo === 'linha') {
      const n = g.serie.length, max = Math.max(...g.serie.map(x => x.valor), 1), W = 520, Hh = 160;
      const px = i => 24 + (n > 1 ? i * (W - 48) / (n - 1) : (W - 48) / 2), py = v => Hh - 26 - v / max * (Hh - 56);
      const pts = g.serie.map((x, i) => px(i).toFixed(1) + ',' + py(x.valor).toFixed(1)).join(' ');
      const passo = Math.ceil(n / 7);
      corpo = '<svg class="g-linha" viewBox="0 0 ' + W + ' ' + Hh + '" role="img" aria-label="' + esc(aria) + '"><line x1="24" y1="' + (Hh - 26) + '" x2="' + (W - 24) + '" y2="' + (Hh - 26) + '" class="g-eixo"/>' +
        '<polyline points="' + pts + '" class="g-l"/>' + g.serie.map((x, i) => '<circle cx="' + px(i).toFixed(1) + '" cy="' + py(x.valor).toFixed(1) + '" r="3.5" class="g-p"><title>' + esc(x.rotulo) + ': ' + x.valor + '</title></circle>' +
          (x.valor ? '<text x="' + px(i).toFixed(1) + '" y="' + (py(x.valor) - 9).toFixed(1) + '" text-anchor="middle" class="g-v">' + x.valor + '</text>' : '') +
          (i % passo === 0 || i === n - 1 ? '<text x="' + px(i).toFixed(1) + '" y="' + (Hh - 6) + '" text-anchor="middle" class="g-x">' + esc(x.rotulo) + '</text>' : '')).join('') + '</svg>';
    } else {
      const max = Math.max(...g.serie.map(x => x.valor), 1);
      corpo = '<div class="g-barras" role="img" aria-label="' + esc(aria) + '">' + g.serie.map(x => '<div class="g-b"><span>' + esc(x.rotulo) + '</span><div class="g-trilho"><i style="width:' + (x.valor / max * 100).toFixed(1) + '%"></i></div><b>' + x.valor + '</b></div>').join('') + '</div>';
    }
    return '<div class="card"><div class="card-h"><h3>' + esc(g.titulo) + '</h3></div>' + corpo + '</div>';
  }
  function desenharRel(r) {
    const kpis = '<div class="rel-kpis">' + r.indicadores.map(i => '<div class="rel-kpi"><b>' + esc(String(i.valor)) + '</b><span>' + esc(i.rotulo) + '</span>' + (i.dica ? '<small>' + esc(i.dica) + '</small>' : '') + '</div>').join('') + '</div>';
    const per = '<p class="small muted">' + esc(r.titulo) + ' · ' + br(r.periodo.de) + ' a ' + br(r.periodo.ate) + (r.filtros.animal ? ' · ' + esc(r.filtros.animal) : '') + (r.filtros.categoria ? ' · ' + esc(r.filtros.categoria) : '') + '</p>';
    const grafs = '<div class="rel-grafs">' + r.graficos.map(grafico).join('') + '</div>';
    const tabs = r.tabelas.map(t => '<div class="card flush"><div class="card-h" style="padding:16px 18px 6px"><h3>' + esc(t.nome) + '</h3><span class="small muted">' + t.linhas.length + ' linha(s)</span></div>' +
      (t.linhas.length ? '<div class="tbl-wrap"><table class="tbl"><thead><tr>' + t.colunas.map(c => '<th>' + esc(c) + '</th>').join('') + '</tr></thead><tbody>' +
        t.linhas.slice(0, 300).map((ln, i) => { const id = t.links && t.links[i]; return '<tr' + (id ? ' class="click" data-act="ver-animal" data-id="' + esc(id) + '"' : '') + '>' + ln.map(v => '<td>' + esc(String(v)) + '</td>').join('') + '</tr>'; }).join('') + '</tbody></table></div>' +
        (t.linhas.length > 300 ? '<p class="small muted" style="padding:8px 18px">Mostrando 300 de ' + t.linhas.length + '. A planilha traz todas.</p>' : '') : '<div class="empty">Nada no período.</div>') + '</div>').join('');
    return '<div class="stack">' + per + kpis + grafs + tabs + '</div>';
  }

  /* ================= ANIMAIS ================= */
  let busca = '', sexoF = '', sitF = 'ativos';
  function vAnimais() {
    return '<div class="sec"><div class="spread"><div class="row"><input id="busca" class="inp" style="width:min(320px,100%)" placeholder="Buscar por nome, registro ou chip" value="' + esc(busca) + '">' +
      '<select id="sexoF" class="inp" style="width:auto"><option value="">Todos os sexos</option><option value="F"' + (sexoF === 'F' ? ' selected' : '') + '>Fêmeas</option><option value="M"' + (sexoF === 'M' ? ' selected' : '') + '>Machos</option></select>' +
      '<select id="sitF" class="inp" style="width:auto" aria-label="Situação">' + [['ativos', 'Plantel ativo'], ['baixados', 'Baixados'], ['todos', 'Todos do haras'], ['externos', 'Animais externos']].map(([k, l]) => '<option value="' + k + '"' + (sitF === k ? ' selected' : '') + '>' + l + '</option>').join('') + '</select></div>' +
      '<div class="row"><button class="btn" data-act="nav" data-v="importar">' + IC.upload + 'Importar PDF ABCCMM</button><button class="btn" data-act="novo-externo">' + IC.plus + 'Novo externo</button><button class="btn pri" data-act="novo-animal">' + IC.plus + 'Novo animal</button></div></div>' +
      '<div class="card flush"><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Animal</th><th>Sexo</th><th>Idade</th><th>Livro</th><th>DNA</th><th>Situação</th><th>Próxima etapa</th></tr></thead><tbody id="tb-animais"></tbody></table></div></div></div>';
  }
  function linhasAnimais() {
    const q = H.norm(busca);
    const ts = H.tarefas(S);
    const sit = a => sitF === 'externos' ? a.externo : !a.externo && (sitF === 'todos' || (sitF === 'baixados' ? !!a.baixa : (a.vivo && !a.baixa)));
    const lst = S.animais.filter(a => sit(a) && (!sexoF || a.sexo === sexoF) && (!q || H.norm(a.nome + ' ' + a.registro + ' ' + a.chip).includes(q)));
    if (!lst.length) return '<tr><td colspan="7"><div class="empty">Nenhum animal encontrado.</div></td></tr>';
    return lst.map(a => {
      const t = ts.filter(x => x.animalId === a.id);
      const at = t.filter(x => x.status === 'atrasado').length, pd = t.filter(x => x.doc).length;
      const prox = t.find(x => !x.doc && x.status !== 'atrasado');
      const g = H.gestacao(S, a);
      const sit = a.externo ? '<span class="chip c-info">Externo</span>' + ((a.contato || {}).proprietario ? ' <span class="small muted">' + esc(a.contato.proprietario) + '</span>' : '') : [a.baixa ? '<span class="chip c-muted">' + esc(a.baixa.motivo) + ' em ' + H.br(a.baixa.data) + '</span>' : !a.vivo ? '<span class="chip c-muted">Inativo</span>' : '', at ? '<span class="chip c-late">' + at + ' atrasado' + (at > 1 ? 's' : '') + '</span>' : '', pd ? '<span class="chip c-info">' + pd + ' pendência' + (pd > 1 ? 's' : '') + '</span>' : '', g ? '<span class="chip c-accent">Gestante ' + g.mes + 'º mês</span>' : '', (a.vivo && !at && !pd) ? '<span class="chip c-ok">Em dia</span>' : ''].join(' ');
      if (a.externo) return '<tr class="click" data-act="ver-animal" data-id="' + a.id + '"><td><b>' + esc(a.nome) + '</b><br><span class="mono muted">' + (a.registro ? 'Reg. ' + esc(a.registro) : 'Sem registro') + '</span></td><td>' + (a.sexo === 'F' ? 'Fêmea' : 'Macho') + '</td><td style="white-space:nowrap">' + (a.nascimento ? H.idadeTxt(a.nascimento) : '-') + '</td><td class="small">' + esc(a.livro || '-') + '</td><td><span class="chip ' + (/sem/i.test(a.dna) ? 'c-late' : 'c-ok') + '">' + esc(a.dna || '-') + '</span></td><td><div class="row" style="gap:4px">' + sit + '</div></td><td class="small">-</td></tr>';
      return '<tr class="click" data-act="ver-animal" data-id="' + a.id + '"><td><b>' + esc(a.nome) + '</b><br><span class="mono muted">' + (a.registro ? 'Reg. ' + esc(a.registro) : 'Sem registro') + '</span></td><td>' + (a.sexo === 'F' ? 'Fêmea' : 'Macho') + '</td><td style="white-space:nowrap">' + H.idadeTxt(a.nascimento) + '</td><td class="small">' + esc(a.livro || '-') + '</td><td><span class="chip ' + (/sem/i.test(a.dna) ? 'c-late' : 'c-ok') + '">' + esc(a.dna || '-') + '</span></td><td><div class="row" style="gap:4px">' + sit + '</div></td><td class="small">' + (prox ? esc(prox.titulo) + '<br><span class="muted">' + H.br(prox.due) + '</span>' : '-') + '</td></tr>';
    }).join('');
  }

  }

  /* v1.6.0: genealogia de 4 gerações (pos P, M, PP ... MMMM) e dados do certificado */
  function arvore(lst) {
    if (!lst || !lst.length) return '';
    const por = {}; lst.forEach(x => { por[x.pos] = x; });
    const ger = n => n === 1 ? ['P', 'M'] : ger(n - 1).flatMap(x => [x + 'P', x + 'M']);
    const tit = ['Pais', 'Avós', 'Bisavós', 'Trisavós'];
    // grade de 16 linhas: cada geração ocupa 16/2^n linhas, alinhando cada animal entre os seus pais
    return '<h3 style="margin:22px 0 8px">Genealogia (certificado)</h3><div class="arvore" role="list">' + tit.map((t, i) => '<small style="grid-column:' + (i + 1) + ';grid-row:1">' + t + '</small>').join('') +
      [1, 2, 3, 4].map(n => ger(n).map((pos, i) => {
        const x = por[pos], f = pos.slice(-1) === 'M', sp = 16 / Math.pow(2, n);
        return '<div class="no' + (f ? ' f' : '') + '" role="listitem" style="grid-column:' + n + ';grid-row:' + (2 + i * sp) + ' / span ' + sp + '">' + (x ? esc(x.nome) + (x.registro || x.dna ? '<span>' + esc([x.registro, x.dna].filter(Boolean).join(' · ')) + '</span>' : '') : '<span>-</span>') + '</div>';
      }).join('')).join('') + '</div>';
  }
  function painelCertificado(a) {
    const c = a.certificado; if (!c) return '';
    const m = c.mensuracoes || {}, cr = c.criador || {}, pr = c.proprietario || {};
    const dd = (t, v) => '<div><dt>' + t + '</dt><dd>' + esc(v || '-') + '</dd></div>';
    const pessoa = p => [p.nome, p.cadastro ? 'cadastro ' + p.cadastro : '', p.propriedade, [p.municipio, p.uf].filter(Boolean).join('/')].filter(Boolean).join(' · ');
    return '<div class="spread" style="margin:22px 0 8px"><h3>Certificado de registro</h3>' + (c.pdf ? '<a class="btn sm" href="/api/animais/' + a.id + '/certificado.pdf" download>' + IC.file + 'Baixar o PDF</a>' : '') + '</div>' +
      '<dl class="facts">' + dd('Classificação', c.classificacao) + dd('Volume e página', [c.volume, c.pagina].filter(Boolean).join(' / ')) + dd('Resenha', c.dataResenha ? br(c.dataResenha) : '') + dd('Registro em', c.dataRegistro ? br(c.dataRegistro) : '') +
      '</dl><dl class="facts" style="margin-top:12px">' + [['altura', 'Altura'], ['comprimento', 'Comprimento'], ['largura', 'Largura'], ['perimetro', 'Perímetro']].map(([k, t]) => dd(t, Object.entries(m[k] || {}).map(([p, v]) => p + ' ' + String(v).replace('.', ',') + ' m').join(' · '))).join('') + '</dl>' +
      '<dl class="facts" style="margin-top:12px">' + dd('Criador', pessoa(cr)) + dd('Proprietário', pessoa(pr)) + dd('Enviado em', c.enviadoEm ? br(c.enviadoEm) : '') + '</dl>';
  }

  async function previaCert(files, animalId) {
    const fd = new FormData(); [...files].forEach(f => fd.append('arquivos', f)); if (animalId) fd.append('animalId', animalId);
    return (await API.upload('/api/certificados/previa', fd)).certificados;
  }
  function gravarCert(files, acoes) {
    const fd = new FormData(); files.forEach(f => fd.append('arquivos', f)); fd.append('acoes', JSON.stringify(acoes));
    return API.upload('/api/certificados/gravar', fd);
  }
  async function lerLote(files) {
    const st = $('#cert-lote-st'); const msg = (t, c) => { st.textContent = t; st.className = 'note ' + (c || ''); st.hidden = false; };
    files = [...files].filter(f => /\.pdf$/i.test(f.name) || /pdf$/i.test(f.type));
    if (!files.length) return msg('Envie arquivos em PDF.', 'bad');
    if (files.length > 30) return msg('Envie até 30 certificados por vez.', 'bad');
    msg('Lendo ' + files.length + ' certificado(s)...');
    try {
      const res = await previaCert(files);
      certLote = { itens: res.map((c, i) => ({ file: files[i], res: c, acao: c.ok ? (c.situacao === 'igual' ? 'ignorar' : opcoesCert(c)[0][0]) : null })) };
      render();
    } catch (e) { msg(e.message, 'bad'); }
  }
  async function gravarLote(el) {
    const it = certLote.itens.filter(x => x.res.ok);
    const acoes = it.map(x => x.acao === 'criar-externo' ? { acao: 'criar', externo: true } : { acao: x.acao, animalId: x.res.animalId });
    const r = await executar(el, () => gravarCert(it.map(x => x.file), acoes), false);
    if (!r) return;
    certLote = null; render();
    UI.toast(r.resumo);
  }
  function vImportarPlantel() {

        ((S.normas || []).length ? '<p class="small">Dúvidas sobre registro, livros ou prazos? <a href="#" data-act="nav" data-v="normas">Consulte as normas da ABCCMM</a>.</p>' : '') +

    const lim = depois > H.LIMITE_ANIMAIS ? '<p class="note bad">O plano atende até ' + H.LIMITE_ANIMAIS + ' animais por haras. Desmarque ' + (depois - H.LIMITE_ANIMAIS) + ' animal(is) para continuar.</p>' : (depois !== ativos && mensal(depois) !== null && mensal(depois) !== mensal(ativos)) ? '<p class="note">Com ' + depois + ' animais ativos, a mensalidade passa de ' + H.moeda(mensal(ativos) || 0) + ' para ' + H.moeda(mensal(depois)) + '.</p>' : '';
    const sit = { novo: '<span class="chip c-ok">Novo</span>', atualizar: '<span class="chip c-soon">Atualizar</span>', igual: '<span class="chip c-muted">Já cadastrado</span>' };
    const rot = { nome: 'nome', livro: 'livro', registro: 'registro', sexo: 'sexo', bloqueado: 'bloqueio', vivo: 'situação', dna: 'DNA', nascimento: 'nascimento', chip: 'chip' };

      '<div class="card"><dl class="facts"><div><dt>Arquivo</dt><dd>' + esc(importacao.arquivo) + '</dd></div><div><dt>Associado(a)</dt><dd>' + esc(res.associado || 'Não identificado') + '</dd></div><div><dt>CPF</dt><dd class="mono">' + esc(H.mascaraCPF(res.cpf)) + '</dd></div><div><dt>Impresso em</dt><dd>' + (res.impresso ? br(res.impresso) : '-') + '</dd></div></dl></div>' +

      comp.map((c, i) => {
        const n = c.novo;

        const dif = c.situacao === 'atualizar' ? '<br><span class="small muted">Muda: ' + c.diffs.map(d => rot[d]).join(', ') + '</span>' : '';

  }
  async function lerPDF(file) {
    const st = $('#imp-st');
    const msg = (t, c) => { st.textContent = t; st.className = 'note ' + (c || ''); st.hidden = false; };
    if (!file) return;
    if (!/pdf$/i.test(file.type) && !/\.pdf$/i.test(file.name)) return msg('Envie um arquivo em PDF.', 'bad');
    msg('Lendo o PDF...');
    try {
      const linhas = await H.linhasPDF(file);
      const res = H.lerPlantel(linhas);
      if (!linhas.length) return msg('Não encontramos texto neste PDF. Ele pode ser uma imagem digitalizada; gere o relatório novamente no Sistema de Gestão ABCCMM.', 'bad');
      if (!res.animais.length) return msg(res.valido ? 'O PDF é da ABCCMM, mas não encontramos linhas de animais. Confira se é o Relatório de Plantel.' : 'Este PDF não parece ser um Relatório de Plantel da ABCCMM.', 'bad');
      const comp = H.compararImportacao(S, res.animais);
      importacao = { arquivo: file.name, res, comp, sel: new Set(comp.map((c, i) => c.situacao !== 'igual' ? i : -1).filter(i => i >= 0)) };
      render();
    } catch (e) { msg('Não foi possível ler o PDF: ' + e.message, 'bad'); }
  }
  async function confirmarImportacao(el) {
    const { res, comp, sel } = importacao;
    const animais = comp.filter((c, i) => sel.has(i) && c.situacao !== 'igual').map(c => c.novo);
    const r = await executar(el, () => API.post('/api/importacao', { arquivo: importacao.arquivo, associado: res.associado, impresso: res.impresso, animais }));
    if (r) { importacao = null; go('animais'); }
  }

  /* ================= AGENDA ================= */
  function vAgenda(modulo) {
    let ts = H.tarefas(S);
    if (modulo === 'sanidade') ts = ts.filter(t => SANITARIOS.includes(t.cat));
    if (agendaCat !== 'todos') ts = ts.filter(t => t.cat === agendaCat);
    const lim90 = H.iso(H.addDias(H.hoje(), 90));
    if (agendaFiltro === 'aberto') ts = ts.filter(t => t.status !== 'futuro');
    if (agendaFiltro === '90') ts = ts.filter(t => t.doc || t.due <= lim90);
    const grupos = [['atrasado', 'Atrasados'], ['pendente', 'Pendências documentais'], ['hoje', 'Hoje'], ['semana', 'Próximos 7 dias'], ['mes', 'Próximos 30 dias'], ['futuro', 'Programados']];
    const seg = [['aberto', 'Em aberto'], ['90', 'Próximos 90 dias'], ['tudo', 'Tudo']];
    const cats = [...new Set(H.tarefas(S).map(t => t.cat))].filter(c => modulo !== 'sanidade' || SANITARIOS.includes(c));
    return '<div class="sec"><div class="spread"><div class="seg" role="group" aria-label="Período">' + seg.map(([k, l]) => '<button data-act="agenda-f" data-f="' + k + '" aria-pressed="' + (agendaFiltro === k) + '">' + l + '</button>').join('') + '</div>' +
      '<select id="agendaCat" class="inp" style="width:auto"><option value="todos">Todas as categorias</option>' + cats.map(c => '<option value="' + c + '"' + (agendaCat === c ? ' selected' : '') + '>' + H.CATS[c].nome + '</option>').join('') + '</select></div>' +
      (ts.length ? grupos.map(([k, l]) => { const g = ts.filter(t => t.status === k); return g.length ? '<div class="card flush"><div class="card-h" style="padding:14px 18px 0"><h3>' + l + '</h3><span class="small muted">' + g.length + '</span></div><div class="tasks" style="padding:2px 18px 6px 0">' + g.map(t => UI.linhaTarefa(t)).join('') + '</div></div>' : ''; }).join('') : '<div class="card empty">Nada para mostrar com esses filtros.</div>') +
      '<p class="small muted">Datas calculadas pelo motor de regras a partir do nascimento, do último registro e dos protocolos configurados. Ajuste intervalos em Protocolos.</p></div>';
  }

  function vProtocolos() {

    const inp = (p, k, val, extra) => '<input class="inp w-num mono" id="p-' + p.id + '-' + k + '" value="' + esc(val) + '" inputmode="numeric"' + (extra || '') + '>';
    return '<div class="sec"><p class="note">Vacinas seguem o protocolo publicado pela VetJr. UFMG; os demais manejos usam padrões de mercado. Os intervalos são editáveis e devem ser validados pelo médico veterinário responsável pelo plantel.</p>' +

  function salvarProtocolos(el) {
    const lista = [];
    for (const p of S.protocolos) {
      const g = k => document.getElementById('p-' + p.id + '-' + k);
      const item = { id: p.id };
      const at = g('ativo'); if (at) item.ativo = at.checked;
      const id = g('idade'); if (id) { const v = parseInt(id.value, 10); if (isNaN(v) || v < 0 || v > 120) { UI.toast('Idade inválida em ' + p.nome + '. Use meses entre 0 e 120.'); id.focus(); return; } item.idadeMeses = v; }
      const se = g('serie'); if (se) { const arr = se.value.split(/[,;\s]+/).filter(Boolean).map(Number); if (arr.some(x => isNaN(x) || x < 1 || x > 400)) { UI.toast('Série inválida em ' + p.nome + '. Informe dias separados por vírgula, ex.: 30, 30.'); se.focus(); return; } item.serie = arr; }
      const rf = g('ref'); if (rf) { const v = parseInt(rf.value, 10); if (isNaN(v) || v < 1 || v > 1500) { UI.toast('Intervalo inválido em ' + p.nome + '.'); rf.focus(); return; } item.reforcoDias = v; }
      lista.push(item);
    }
    executar(el, () => API.put('/api/protocolos', lista)).then(r => { if (r) render(); });
  }

  function docValido(doc) {
    const d = doc.replace(/\D/g, '');

    if (d.length === 11 && !/^(\d)\1+$/.test(d)) return dv(d, [10, 9, 8, 7, 6, 5, 4, 3, 2]) === +d[9] && dv(d, [11, 10, 9, 8, 7, 6, 5, 4, 3, 2]) === +d[10];
    if (d.length === 14 && !/^(\d)\1+$/.test(d)) return dv(d, [5, 4, 3, 2, 9, 8, 7, 6, 5, 4, 3, 2]) === +d[12] && dv(d, [6, 5, 4, 3, 2, 9, 8, 7, 6, 5, 4, 3, 2]) === +d[13];

  async function lerCertNovo(file) {

      const c = (await previaCert([file]))[0];
      if (!c.ok) { certNovo = null; return msg(esc(c.erro), 'bad'); }
      if (c.situacao !== 'novo') { certNovo = null; return msg('Este certificado é de <b>' + esc(c.animal) + '</b>, que já está cadastrado' + (c.externo ? ' como externo' : '') + '. <a href="#" data-act="ver-animal" data-id="' + c.animalId + '">Abra a ficha</a> e use Atualizar pelo certificado.', 'warn'); }
      const d = c.dados, set = (id, v) => { const el = document.getElementById(id); if (el && v) { el.value = v; el.style.borderColor = 'var(--accent)'; el.style.background = 'var(--accent-soft)'; } };
      set('n-nome', d.nome); set('n-sexo', d.sexo); set('n-nasc', d.nascimento); set('n-chip', d.chip); set('n-livro', d.livro); set('n-pelagem', d.pelagem);
      if (d.registro) { $('#n-semreg').checked = false; $('#n-reg').disabled = false; set('n-reg', d.registro); }
      const dna = $('#n-dna'); if (d.dna && ![...dna.options].some(o => o.value === d.dna)) dna.insertAdjacentHTML('beforeend', '<option>' + esc(d.dna) + '</option>'); set('n-dna', d.dna);
      certNovo = file;
      msg('Dados preenchidos a partir do certificado. A genealogia (' + d.genealogia.arvore.length + ' ancestrais), as mensurações, o criador, o proprietário e o PDF serão gravados junto.' + (c.avisos.length ? '<br>' + c.avisos.map(esc).join('<br>') : ''), 'good');
    } catch (e) { msg(esc(e.message), 'bad'); }
  }

      if (await executar(el, () => API.post('/api/usuarios/' + document.getElementById('r-uid').value + '/senha', { senha: s }))) UI.fechar();
    },
    'minha-senha': () => UI.abrir({ titulo: 'Alterar minha senha', corpo: '<form class="stack" novalidate><div class="field"><label for="m-atual">Senha atual</label><input id="m-atual" type="password" class="inp" autocomplete="current-password"></div>' + senhaForm('m-nova', 'Nova senha (mín. 8)') + '</form>', rodape: '<button class="btn" data-act="fechar">Cancelar</button><button class="btn pri" data-act="salvar-minha-senha">Alterar</button>' }),
    'salvar-minha-senha': async el => {
      const n = document.getElementById('m-nova').value; if (n.length < 8) { UI.toast('A nova senha precisa ter pelo menos 8 caracteres.'); return; }
      if (await executar(el, () => API.post('/api/me/senha', { atual: document.getElementById('m-atual').value, nova: n }), 'Senha alterada.')) UI.fechar();
    },
    sair: async () => { try { await API.post('/api/logout'); } catch (e) { } location.href = '/entrar'; },
    sug: el => perguntar(el.dataset.q),
    'fora-plano': el => UI.toast(el.dataset.m + ' não está incluído no plano deste haras.'),
    'em-breve': el => UI.toast(el.dataset.m + ' chega em uma próxima versão.'),
    'recarregar-sessoes': () => carregarSessoes(),
    'vincular-celular': async el => {
      const u = (S.usuarios || []).find(x => String(x.id) === el.dataset.id);
      let r; try { el.disabled = true; r = await API.post('/api/usuarios/' + u.id + '/vinculo'); } catch (e) { UI.toast(e.message); return; } finally { el.disabled = false; }
      UI.abrir({ titulo: 'Vincular o celular de ' + esc(u.nome), corpo: '<div class="stack">' +
        (r.instalar ? '<details class="instalar-app"><summary><b>1. O app ainda não está no celular?</b> Toque aqui</summary><p class="small">Leia este código com a <b>câmera</b> do celular do caseiro (ou abra <a class="mono" href="' + esc(r.instalar.link) + '">' + esc(r.instalar.link) + '</a>) e instale. Se o Android pedir, permita instalar apps desta origem.</p><div class="qr-box qr-pequeno">' + r.instalar.qr + '</div></details>'
          : '<p class="small muted">O APK ainda não está neste servidor: ele chega com o pacote de atualização da versão.</p>') +
        '<ol class="passos" start="2"><li>Abra o app Haras360 e toque em <b>Ler QR Code</b>.</li><li>Aponte o celular para o código abaixo.</li></ol>' +
        '<div class="qr-box">' + r.qr + '</div><p class="small muted">Vale por ' + r.minutos + ' minutos e uma única vez. Gerar outro invalida este.</p>' +
        '<details><summary class="small">Sem câmera? Digite no app</summary><p class="small">Servidor: <span class="mono">' + esc(r.servidor) + '</span><br>Código: <span class="mono">' + esc(r.codigo) + '</span></p></details>' +
        '<p class="note">O celular aparece em Sessões e aparelhos ativos, onde você pode encerrá-lo a qualquer momento.</p></div>',
        rodape: '<button class="btn pri" data-act="fechar">Concluir</button>' });
      UI.onClose = () => carregarSessoes();
    },
    'encerrar-sessao': el => confirmar(el, 'Confirmar', async () => { try { const r = await API.del('/api/sessoes/' + el.dataset.id); UI.toast(r.resumo); carregarSessoes(); } catch (e) { UI.toast(e.message); } }),
    'dois-fatores-user': el => { const u = (S.usuarios || []).find(x => String(x.id) === el.dataset.id); confirmar(el, 'Confirmar redefinição', async () => { if (await executar(el, () => API.post('/api/usuarios/' + u.id + '/2fa/redefinir'))) render(); }); },
    'novos-codigos': () => UI.abrir({ titulo: 'Novos códigos de recuperação', corpo: '<form class="stack" novalidate><p>Os códigos atuais deixam de valer. Confirme sua senha.</p><div class="field"><label for="nc-senha">Senha</label><input id="nc-senha" type="password" class="inp" autocomplete="current-password"></div></form>', rodape: '<button class="btn" data-act="fechar">Cancelar</button><button class="btn pri" data-act="gerar-codigos">Gerar</button>' }),
    'gerar-codigos': async el => { try { el.disabled = true; const r = await API.post('/api/me/codigos-recuperacao', { senha: document.getElementById('nc-senha').value }); UI.fechar(); UI.mostrarCodigos(r.codigos); } catch (e) { el.disabled = false; UI.toast(e.message); } },
    'img-padrao': el => confirmar(el, 'Confirmar', async () => { if (await executar(el, () => API.del('/api/haras/imagens/' + el.dataset.tipo))) render(); }),
    'remover-logo': el => confirmar(el, 'Confirmar remoção', async () => { if (await executar(el, () => API.del('/api/haras/logo'))) render(); }),
    'pa-cio': el => { document.querySelectorAll('[data-act="pa-cio"]').forEach(b => b.setAttribute('aria-pressed', String(b === el))); },
    'pa-raiva': el => { document.querySelectorAll('[data-act="pa-raiva"]').forEach(b => b.setAttribute('aria-pressed', String(b === el))); },
    'salvar-params': async el => {
      const g = Number($('#pa-gest').value), t = Number($('#pa-tol').value);
      if (!(g >= 300 && g <= 380)) { UI.toast('Dias de gestação devem ficar entre 300 e 380.'); return; }
      if (!(t >= 0 && t <= 90)) { UI.toast('A tolerância deve ficar entre 0 e 90 dias.'); return; }
      const ci = Number($('#pa-ciclo').value), pd = Number($('#pa-pde').value), pa = Number($('#pa-pate').value);
      if (!(ci >= 18 && ci <= 25)) { UI.toast('O ciclo deve ficar entre 18 e 25 dias.'); return; }
      if (!(pd >= 5 && pd <= 15 && pa >= 6 && pa <= 20 && pd <= pa)) { UI.toast('Confira a janela do cio do potro: início entre 5 e 15, fim entre 6 e 20, e o início antes do fim.'); return; }
      const sem = document.querySelector('[data-act="pa-raiva"][aria-pressed="true"]').dataset.v === '1';
      const cio = document.querySelector('[data-act="pa-cio"][aria-pressed="true"]').dataset.v === '1';
      if (await executar(el, () => API.put('/api/haras', { nome: $('#pa-nome').value, municipio: $('#pa-mun').value, proprietario: $('#pa-prop').value, raivaSemestral: sem, gestacaoDias: g, toleranciaReinicio: t,
        previsaoCio: cio, cicloDias: ci, cioPotroDe: pd, cioPotroAte: pa }))) render();
    }
  };
  document.addEventListener('click', e => {
    const el = e.target.closest('[data-act]'); if (!el) return;
    const f = ACT[el.dataset.act]; if (!f) return;
    if (el.tagName === 'A' || el.tagName === 'TR' || el.closest('form')) e.preventDefault();
    f(el, e);
  });
  document.addEventListener('change', async e => {
    const el = e.target.closest('[data-chg]'); if (!el) return;
    if (el.dataset.chg === 'semreg') { const alvo = document.getElementById(el.dataset.alvo); alvo.disabled = el.checked; if (el.checked) alvo.value = ''; else alvo.focus(); }
    if (el.dataset.chg === 'cert-novo') { const f = el.files[0]; el.value = ''; lerCertNovo(f); }
    if (el.dataset.chg === 'cert-ficha') { const f = el.files[0]; el.value = ''; lerCertFicha(f, el.dataset.id); }
    if (el.dataset.chg === 'cert-lote') { const fs = [...el.files]; el.value = ''; lerLote(fs); }
    if (el.dataset.chg === 'lote-acao') { certLote.itens[Number(el.dataset.i)].acao = el.value; render(); }
    if (el.dataset.chg === 'b-motivo') { const venda = el.value === 'Venda'; $('#b-venda').hidden = !venda; $('#b-dest').hidden = venda; }
    if (el.dataset.chg === 'v-comp') $('#v-novo').hidden = !!el.value;
    if (el.dataset.chg === 'v-forma') { const p = el.value === 'parcelado'; $('#v-parc').hidden = !p; $('#v-av').hidden = p; previaParcelas(); }
    if (el.dataset.chg === 'imp-sel') { const i = Number(el.dataset.i); el.checked ? importacao.sel.add(i) : importacao.sel.delete(i); render(); }
    if (el.dataset.chg === 'pref') {
      const p = JSON.parse(JSON.stringify(S.notifPrefs)); p[el.dataset.t][el.dataset.k] = el.checked;
      if (await executar(null, () => API.put('/api/notif-prefs', p), 'Preferência salva.')) render();
    }
  });
  document.addEventListener('input', e => { if (e.target.dataset && e.target.dataset.calc) previaParcelas(); });
  (async () => {
    $('#view').innerHTML = '<div class="empty">Carregando o haras...</div>';
    try {
      await recarregar();
      if (S.usuario.perfil !== 'gestor') { location.href = '/campo'; return; }
      const alvo = new URLSearchParams(location.search).get('animal');
      if (alvo && H.animal(S, alvo)) { history.replaceState(null, '', '/gestor'); view = 'ficha'; param = alvo; }
      render();
    } catch (e) {
      if (/usuários de um haras/.test(e.message)) { location.href = '/admin'; return; }
      $('#view').innerHTML = '<div class="note bad">' + esc(e.message) + '</div>';
    }
  })();
})();
</script>
