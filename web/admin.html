<title>Haras360 Administração</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/*SHARED_CSS*/
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px 20px;margin:0}
.facts div{display:flex;flex-direction:column;gap:2px;min-width:0}
.facts dt{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.facts dd{margin:0;font-weight:500;overflow-wrap:anywhere}
.matrix td:not(:first-child),.matrix th:not(:first-child){text-align:center}
.tbl input.inp,.tbl select.inp{padding:6px 8px;font-size:.88rem}
.w-num{width:90px}
.aud td{vertical-align:top}
.aud .det{font-size:.8rem;color:var(--muted);white-space:pre-wrap;overflow-wrap:anywhere;max-width:420px}
.glos dt{font-weight:700;margin-top:12px}
.glos dd{margin:2px 0 0;color:var(--muted)}
.hcard{display:flex;flex-direction:column;gap:12px}
.users{display:flex;flex-direction:column}
.users>div{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line-2)}
.log{font-family:var(--f-mono);font-size:.8rem;background:var(--surface-2);border-radius:8px;padding:10px 12px;max-height:260px;overflow:auto;white-space:pre-wrap}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:900px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.kpi b{font-family:var(--f-display);font-size:1.8rem;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi span{font-size:.84rem;color:var(--muted)}
/* v1.7.0: financeiro */
.fin-kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:900px){.fin-kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.acoes-v{display:flex;flex-direction:column;gap:4px;align-items:flex-end}
.fin-kpis .kpi b{font-size:1.45rem}
.barras{display:flex;flex-direction:column;gap:8px}
.barras .b{display:grid;grid-template-columns:120px minmax(0,1fr) 120px;gap:10px;align-items:center;font-size:.86rem}
.barras .t{height:10px;border-radius:99px;background:var(--surface-2);overflow:hidden;border:1px solid var(--line-2)}
.barras .t i{display:block;height:100%;background:var(--accent)}
.barras .b b{text-align:right;font-variant-numeric:tabular-nums}
.meses{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:6px;align-items:end;padding-top:6px}
.meses .m{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:.7rem;color:var(--muted)}
.meses .m .cols{display:flex;gap:2px;align-items:flex-end;height:120px}
.meses .m .cols i{width:9px;border-radius:3px 3px 0 0;background:var(--accent);min-height:1px}
.meses .m .cols i.r{background:#D5A064}
.leg2{display:flex;gap:14px;font-size:.8rem;color:var(--muted)}
.leg2 i{display:inline-block;width:10px;height:10px;border-radius:2px;background:var(--accent);margin-right:5px;vertical-align:-1px}
.leg2 i.r{background:#D5A064}
.calc{font-size:.8rem;color:var(--muted)}
</style>

<header class="topbar" id="topbar"></header>
<main class="wrapm">
  <div class="pagehead"><div><div class="eyebrow" id="v-eyebrow"></div><h1 id="v-title"></h1></div><div class="acts" id="v-acts"></div></div>
  <div id="view" class="view-in"></div>
</main>
<div id="modal" class="modal" hidden></div>
<div id="toast" role="status" hidden></div>

</script>
<script>

</script>
<script>
/*UI*/
</script>
<script>
(function () {
  let S = null, F = null, perfil = 'admin', view = 'haras', poll = null;
  const $ = s => document.querySelector(s);
  const esc = H.esc, IC = UI.ICON;
  /* v1.7.0: o perfil Financeiro só carrega o financeiro; o administrador carrega o painel e, no Financeiro, os dados dele */
  async function recarregar() {
    if (perfil === 'financeiro') { F = await API.get('/api/financeiro/painel'); S = { usuario: F.usuario, marca: F.marca, versao: F.versao }; return; }
    S = await API.get('/api/admin/painel');
    if (view === 'financeiro') F = await API.get('/api/financeiro/painel');
  }
  async function executar(el, fn, ok) {
    if (el && el.disabled) return null;
    const txt = el ? el.innerHTML : '';
    if (el) { el.disabled = true; el.innerHTML = 'Salvando...'; }
    try { const r = await fn(); await recarregar(); if (ok !== false) UI.toast(typeof ok === 'string' ? ok : (r && r.resumo) || 'Alteração salva.'); return r || true; }
    catch (e) { UI.toast(e.message); return null; }
    finally { if (el && el.isConnected) { el.disabled = false; el.innerHTML = txt; } }
  }
  const menu = () => perfil === 'financeiro' ? [
    { id: 'financeiro', rotulo: 'Financeiro', ic: 'graf' },
    { grupo: 'Ajuda', ic: 'ajuda', itens: [{ href: '/ajuda#financeiro', rotulo: 'Manual' }] }
  ] : [
    { id: 'haras', rotulo: 'Haras e gestores', ic: 'cavalo' },
    { id: 'financeiro', rotulo: 'Financeiro', ic: 'graf' },
    { id: 'administradores', rotulo: 'Administradores', ic: 'escudo' },
    { id: 'marca', rotulo: 'Marca e imagens', ic: 'imagem' },
    { id: 'parametros', rotulo: 'Parametrizações', ic: 'engr' },
    { id: 'auditoria', rotulo: 'Auditoria', ic: 'agenda' },
    { id: 'atualizacao', rotulo: 'Atualização e backup', ic: 'graf' },
    { grupo: 'Ajuda', ic: 'ajuda', itens: [{ id: 'sobre', rotulo: 'Sobre' }, { href: '/ajuda', rotulo: 'Manual' }, { id: 'glossario', rotulo: 'Glossário' }] }
  ];
  const TITULOS = { financeiro: ['Plataforma', 'Financeiro: clientes e mensalidades'], haras: ['Plataforma', 'Haras e gestores'], marca: ['Administração', 'Marca e imagens da plataforma'], administradores: ['Administração', 'Administradores da plataforma'], parametros: ['Administração', 'Parametrizações globais'], auditoria: ['Administração', 'Auditoria'], atualizacao: ['Administração', 'Atualização e backup'], sobre: ['Ajuda', 'Sobre o Haras360'], glossario: ['Ajuda', 'Glossário'] };
  async function go(v) {
    view = v;
    if (v === 'financeiro' && perfil === 'admin') { $('#view').innerHTML = '<div class="empty">Carregando o financeiro...</div>'; try { F = await API.get('/api/financeiro/painel'); } catch (e) { UI.toast(e.message); return; } }
    render(); window.scrollTo(0, 0);
  }
  function render() {
    $('#topbar').innerHTML = UI.topbar({ menu: menu(), atual: view, home: '/admin', sub: 'Administração da plataforma', marca: S.marca.logo, cabecalho: S.marca.cabecalho, usuario: S.usuario, perfilTxt: perfil === 'financeiro' ? 'Financeiro' : 'Administrador',
      usuarioItens: [{ act: 'minha-senha', rotulo: 'Alterar minha senha' }, { act: 'novos-codigos', rotulo: 'Novos códigos de recuperação do 2FA' }] });
    const [eb, ti] = TITULOS[view];
    $('#v-eyebrow').textContent = eb; $('#v-title').textContent = ti; document.title = 'Haras360 · ' + ti;
    $('#v-acts').innerHTML = view === 'haras' ? '<button class="btn pri" data-act="novo-haras">' + IC.plus + 'Novo haras</button>' : view === 'administradores' ? '<button class="btn pri" data-act="novo-admin">' + IC.plus + 'Novo usuário da plataforma</button>' : '';
    const v = $('#view'); v.classList.remove('view-in'); void v.offsetWidth; v.classList.add('view-in');
    v.innerHTML = VIEWS[view]();
    if (AFTER[view]) AFTER[view]();
    clearInterval(poll); poll = null;
    if (view === 'atualizacao' && (S.atualizacao.pendente || S.atualizacao.estado === 'executando')) poll = setInterval(acompanhar, 4000);
  }
  const valor = v => v === null || v === undefined ? 'A definir' : (Number(v) === 0 ? 'Grátis' : H.moeda(Number(v)));

  /* ================= HARAS ================= */
  function vHaras() {
    const ativos = S.haras.filter(h => h.ativo), animais = S.haras.reduce((t, h) => t + h.animais, 0);
    const receita = ativos.reduce((t, h) => t + (h.mensalidade || 0), 0), semPreco = ativos.some(h => h.mensalidade === null);
    const planos = Object.keys(S.parametros.planos);
    return '<div class="sec"><div class="kpis"><div class="kpi"><span>Haras ativos</span><b>' + ativos.length + '</b><span>de ' + S.haras.length + ' cadastrados</span></div><div class="kpi"><span>Animais ativos</span><b>' + animais + '</b><span>em todos os haras</span></div><div class="kpi"><span>Receita mensal</span><b>' + (semPreco ? 'A definir' : H.moeda(receita)) + '</b><span>pelas faixas de preço</span></div><div class="kpi"><span>Versão</span><b class="mono" style="font-size:1.4rem">' + esc(S.versao) + '</b><span>banco na migração ' + S.versaoBanco + '</span></div></div>' +
      (S.haras.length ? S.haras.map(h => '<div class="card hcard"><div class="spread"><div class="row" style="gap:14px">' + (h.logo ? '<span class="logo-h" style="border:1px solid var(--line)"><img src="' + esc(h.logo) + '" alt=""></span>' : '') + '<div><h2>' + esc(h.nome) + '</h2><p class="small muted">' + esc(h.municipio || 'Município não informado') + ' · criado em ' + H.br(h.criado) + '</p></div></div><div class="row">' + (h.ativo ? '<span class="chip c-ok">Ativo</span>' : '<span class="chip c-muted">Desativado</span>') +
        '<label class="small muted" for="pl-' + h.id + '">Plano</label><select id="pl-' + h.id + '" class="inp" style="width:auto" data-chg="plano" data-id="' + h.id + '">' + planos.map(p => '<option' + (p === h.plano ? ' selected' : '') + '>' + esc(p) + '</option>').join('') + '</select>' +
        '<label class="btn ghost sm" for="lg-' + h.id + '">' + (h.logo ? 'Trocar logotipo' : 'Enviar logotipo') + '</label><input type="file" id="lg-' + h.id + '" data-chg="logo" data-id="' + h.id + '" accept="image/png,image/jpeg,image/webp" hidden>' + (h.logo ? '<button class="btn ghost sm" data-act="remover-logo" data-id="' + h.id + '">Remover logotipo</button>' : '') +
        '<button class="btn ghost sm' + (h.ativo ? ' danger' : '') + '" data-act="toggle-haras" data-id="' + h.id + '">' + (h.ativo ? 'Desativar' : 'Reativar') + '</button></div></div>' +
        '<dl class="facts"><div><dt>Animais ativos</dt><dd>' + h.animais + ' de ' + h.limite + '</dd></div><div><dt>Mensalidade</dt><dd>' + (h.mensalidade === null ? 'A definir' : H.moeda(h.mensalidade)) + '</dd></div><div><dt>Usuários</dt><dd>' + h.usuarios.length + '</dd></div></dl>' +
        '<div class="users">' + h.usuarios.map(u => '<div><div><b>' + esc(u.nome) + '</b> <span class="chip nodot ' + (u.perfil === 'gestor' ? 'c-accent' : 'c-info') + '">' + (u.perfil === 'gestor' ? 'Gestor' : 'Caseiro') + '</span>' + (u.perfil === 'gestor' ? (u.doisFatores ? ' <span class="chip c-ok">2FA</span>' : ' <span class="chip c-soon">2FA pendente</span>') : '') + (u.ativo ? '' : ' <span class="chip c-muted">Desativado</span>') + '<br><span class="small muted">' + esc(u.email) + '</span></div><div class="row" style="gap:4px"><button class="btn ghost sm" data-act="senha-user" data-id="' + u.id + '" data-n="' + esc(u.nome) + '">Redefinir senha</button>' + (u.doisFatores ? '<button class="btn ghost sm" data-act="dois-fatores" data-id="' + u.id + '">Redefinir 2FA</button>' : '') + '</div></div>').join('') + '</div></div>').join('')
        : '<div class="card empty">Nenhum haras cadastrado. Use "Novo haras" para criar o primeiro.</div>') + '</div>';
  }

  /* ================= PARAMETRIZAÇÕES ================= */
  let planosEd = null, faixasEd = null;
  function vAdministradores() {
    const ativos = S.administradores.filter(a => a.ativo && a.perfil === 'admin').length;
    return '<div class="stack"><p class="small muted">Administradores têm acesso total: haras, planos, parametrizações, financeiro, atualização e backup. O perfil Financeiro vê só o Financeiro (clientes e mensalidades). Toda ação aqui pede a sua senha e fica na auditoria. A plataforma nunca fica sem administrador ativo.</p>' +
      '<div class="card flush"><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Nome</th><th>Perfil</th><th>E-mail</th><th>2FA</th><th>Situação</th><th></th></tr></thead><tbody>' +
      S.administradores.map(a => '<tr><td><b>' + esc(a.nome) + '</b>' + (a.eu ? ' <span class="chip nodot c-info">Você</span>' : '') + '</td><td>' + (a.perfil === 'financeiro' ? '<span class="chip nodot c-soon">Financeiro</span>' : '<span class="chip nodot c-accent">Administrador</span>') + '</td><td class="small">' + esc(a.email) + '</td>' +
        '<td>' + (a.doisFatores ? '<span class="chip c-ok">Ativo</span>' : '<span class="chip c-soon">Pendente</span>') + '</td>' +
        '<td>' + (a.ativo ? '<span class="chip c-ok">Ativo</span>' : '<span class="chip c-muted">Desativado</span>') + '</td>' +
        '<td class="num">' + (a.eu ? '<span class="small muted">Use o menu com o seu nome</span>' : '<div class="row" style="gap:4px;justify-content:flex-end">' +
          '<button class="btn ghost sm" data-act="adm-senha" data-id="' + a.id + '">Redefinir senha</button>' +
          (a.doisFatores ? '<button class="btn ghost sm" data-act="adm-2fa" data-id="' + a.id + '">Redefinir 2FA</button>' : '') +
          (a.ativo && a.perfil === 'admin' && ativos < 2 ? '' : '<button class="btn ghost sm' + (a.ativo ? ' danger' : '') + '" data-act="adm-ativo" data-id="' + a.id + '">' + (a.ativo ? 'Desativar' : 'Reativar') + '</button>') +
          '</div>') + '</td></tr>').join('') + '</tbody></table></div></div></div>';
  }

  function vParametros() {
    const p = S.parametros;
    planosEd = JSON.parse(JSON.stringify(p.planos)); faixasEd = JSON.parse(JSON.stringify(p.faixas));
    const num = (id, l, v, min, max, aj) => '<div class="field"><label for="' + id + '">' + l + '</label><input id="' + id + '" class="inp mono" type="number" min="' + min + '" max="' + max + '" value="' + v + '">' + (aj ? '<span class="small muted">' + aj + '</span>' : '') + '</div>';
    return '<div class="sec" style="max-width:980px">' +
      '<div class="card flush"><div class="card-h" style="padding:16px 18px 0"><div><h2>Planos e módulos</h2><p class="small muted">Defina o que cada plano inclui. Módulo fora do plano aparece esmaecido para o haras, e a API recusa o uso.</p></div><button class="btn sm" data-act="add-plano">' + IC.plus + 'Novo plano</button></div><div class="tbl-wrap" id="planos-t"></div></div>' +
      '<div class="card flush"><div class="card-h" style="padding:16px 18px 0"><div><h2>Faixas de preço</h2><p class="small muted">Valor por animal ativo ao mês, progressivo por faixa. Deixe em branco o que ainda não foi definido.</p></div><button class="btn sm" data-act="add-faixa">' + IC.plus + 'Nova faixa</button></div><div class="tbl-wrap" id="faixas-t"></div></div>' +
      '<div class="card stack"><h2>Login e sessões</h2><div class="fgrid">' + num('g-tent', 'Tentativas de login antes do bloqueio', p.login_tentativas, 3, 50) + num('g-jan', 'Janela de bloqueio (minutos)', p.login_janela_min, 1, 1440) + num('g-sess', 'Duração da sessão no navegador (dias)', p.sessao_dias, 1, 90) + num('g-app', 'Duração da sessão no app do caseiro (dias)', p.sessao_app_dias, 7, 365, 'O caseiro fica conectado no campo sem precisar de internet para entrar.') +
        num('g-appg', 'Sessão do app do gestor sem uso (dias)', p.sessao_app_gestor_dias, 7, 90, 'Depois desse prazo sem abrir o app, o gestor entra de novo com senha e 2FA.') + '</div>' +
        '<div class="kv"><div><b>App do gestor sem HTTPS (somente teste)</b><p class="small muted">' + (location.protocol === 'https:' ? 'Este servidor já está em HTTPS: o app do gestor funciona normalmente.' : 'Este servidor está em HTTP. O app do gestor exige HTTPS, porque a senha, o código do 2FA e os dados do haras passariam sem criptografia pelo 4G.') + '</p></div>' +
        '<div class="seg" role="group" aria-label="App do gestor sem HTTPS"><button data-act="g-semhttps" data-v="0" aria-pressed="' + !p.app_gestor_sem_https + '">Bloqueado</button><button data-act="g-semhttps" data-v="1" aria-pressed="' + !!p.app_gestor_sem_https + '">Liberado para teste</button></div></div>' +
        (p.app_gestor_sem_https && location.protocol !== 'https:' ? '<p class="note bad">Atenção: o app do gestor está liberado sem HTTPS. Use só para teste e volte para Bloqueado antes de entrar com dados reais.</p>' : '') + '</div>' +
      '<div class="card stack"><h2>App do caseiro</h2><div class="fgrid">' + num('g-audio', 'Duração máxima do áudio nos registros (segundos)', p.audio_max_seg, 15, 300, 'Cerca de 250 KB por minuto. O módulo de áudio é ligado por plano na grade acima.') + '</div></div>' +
      '<div class="card stack"><h2>E-mail</h2><p class="small muted">Gravado para o envio de alertas por e-mail, que entra em uma próxima versão.</p><div class="fgrid">' +
      '<div class="field"><label for="s-host">Servidor SMTP</label><input id="s-host" class="inp" value="' + esc(p.smtp.host) + '" placeholder="smtp.zoho.com"></div>' + num('s-porta', 'Porta', p.smtp.porta, 1, 65535) +
      '<div class="field"><label for="s-user">Usuário</label><input id="s-user" class="inp" value="' + esc(p.smtp.usuario) + '" autocomplete="off"></div><div class="field"><label for="s-senha">Senha</label><input id="s-senha" type="password" class="inp" autocomplete="new-password" placeholder="' + (p.smtp.senhaDefinida ? 'definida; deixe em branco para manter' : '') + '"></div>' +
      '<div class="field"><label for="s-rem">Remetente</label><input id="s-rem" class="inp" value="' + esc(p.smtp.remetente) + '" placeholder="Haras360 <alertas@seudominio>"></div><div class="field"><label for="s-tls">Segurança</label><select id="s-tls" class="inp"><option value="1"' + (p.smtp.tls ? ' selected' : '') + '>STARTTLS</option><option value="0"' + (!p.smtp.tls ? ' selected' : '') + '>Nenhuma</option></select></div>' +
      '<div class="field full"><label for="g-contato">E-mail de contato do administrador</label><input id="g-contato" class="inp" value="' + esc(p.email_contato) + '"></div></div></div>' +
      '<div class="card stack"><h2>Normas da ABCCMM</h2><p class="small muted">Links que o gestor vê no Assistente, em Ajuda, em Importar ABCCMM e no app. Um por linha, no formato <b>Título | endereço</b>. Atualize quando a ABCCMM publicar versões novas.</p>' +
      '<div class="field"><label for="g-normas">Links (até 8)</label><textarea id="g-normas" class="inp mono" rows="4">' + esc((p.normas_abccmm || []).map(n => n.titulo + ' | ' + n.url).join('\n')) + '</textarea></div></div>' +
      '<div class="row" style="justify-content:flex-end"><button class="btn pri" data-act="salvar-globais">' + IC.check + 'Salvar parametrizações</button></div></div>';
  }
  function desenharPlanos() {
    const mods = Object.entries(S.modulos);
    $('#planos-t').innerHTML = '<table class="tbl matrix"><thead><tr><th>Plano</th><th>Limite de animais</th>' + mods.map(([, l]) => '<th>' + esc(l) + '</th>').join('') + '<th></th></tr></thead><tbody>' +
      Object.entries(planosEd).map(([nome, p], i) => '<tr><td><input class="inp" data-pl="' + i + '" data-k="nome" value="' + esc(nome) + '" aria-label="Nome do plano"></td><td><input class="inp w-num mono" type="number" min="1" max="500" data-pl="' + i + '" data-k="limite" value="' + p.limite + '" aria-label="Limite de animais"></td>' +
        mods.map(([k, l]) => '<td><input type="checkbox" data-pl="' + i + '" data-k="m:' + k + '"' + (p.modulos[k] ? ' checked' : '') + ' aria-label="' + esc(l) + ' no plano ' + esc(nome) + '"></td>').join('') +
        '<td>' + (Object.keys(planosEd).length > 1 ? '<button class="btn ghost sm danger" data-act="rem-plano" data-i="' + i + '">Remover</button>' : '') + '</td></tr>').join('') + '</tbody></table>';
  }
  function desenharFaixas() {
    $('#faixas-t').innerHTML = '<table class="tbl"><thead><tr><th>De</th><th>Até</th><th>Valor por animal (R$)</th><th></th></tr></thead><tbody>' +
      faixasEd.map((f, i) => '<tr><td><input class="inp w-num mono" type="number" min="1" data-fx="' + i + '" data-k="de" value="' + f.de + '" aria-label="De"></td><td><input class="inp w-num mono" type="number" min="1" data-fx="' + i + '" data-k="ate" value="' + f.ate + '" aria-label="Até"></td><td><input class="inp mono" style="width:140px" type="number" step="0.01" min="0" data-fx="' + i + '" data-k="valor" value="' + (f.valor === null ? '' : f.valor) + '" placeholder="a definir" aria-label="Valor"></td><td>' + (faixasEd.length > 1 ? '<button class="btn ghost sm danger" data-act="rem-faixa" data-i="' + i + '">Remover</button>' : '') + '</td></tr>').join('') + '</tbody></table>';
  }
  function lerPlanosDaTela() {
    const linhas = Object.entries(planosEd).map(([nome, p]) => ({ nome, limite: p.limite, modulos: Object.assign({}, p.modulos) }));
    document.querySelectorAll('[data-pl]').forEach(el => {
      const l = linhas[+el.dataset.pl], k = el.dataset.k;
      if (k === 'nome') l.nome = el.value.trim(); else if (k === 'limite') l.limite = Number(el.value); else l.modulos[k.slice(2)] = el.checked;

    atualizacao() {
      const f = $('#up-f'); if (!f) return;
      f.addEventListener('submit', async e => {
        e.preventDefault();
        const pac = $('#up-pac').files[0], sig = $('#up-sig').files[0], btn = $('#up-btn');
        if (!pac || !sig) { UI.toast('Selecione o pacote e a assinatura.'); return; }
        if (!/^haras360-\d+\.\d+\.\d+\.tar\.gz$/.test(pac.name)) { UI.toast('O pacote deve se chamar haras360-X.Y.Z.tar.gz.'); return; }
        if (pac.size > S.limitePacoteMB * 1048576) { UI.toast('O pacote passa de ' + S.limitePacoteMB + ' MB.'); return; }
        btn.disabled = true; btn.textContent = 'Conferindo...';
        try {
          const sha = $('#up-sha').value.trim().toLowerCase();
          // No navegador, a conta só existe em HTTPS; em HTTP a conferência fica com o servidor, que também compara o SHA-256 informado.
          if (sha && window.crypto && crypto.subtle && sha !== await sha256Arquivo(pac)) throw new Error('O SHA-256 do arquivo não confere com o publicado na Release. Baixe o pacote de novo.');
          btn.textContent = 'Enviando...';
          const fd = new FormData(); fd.append('pacote', pac); fd.append('assinatura', sig); if (sha) fd.append('sha256', sha);
          const r = await API.upload('/api/admin/atualizacao', fd);
          UI.toast(r.resumo); await recarregar(); render();
        } catch (err) { UI.toast(err.message); btn.disabled = false; btn.innerHTML = IC.upload + 'Enviar e atualizar'; }
      });
    }
  };

    rollback: el => UI.confirmar(el, 'Confirmar volta', async () => { if (await executar(el, () => API.post('/api/admin/rollback', { versao: el.dataset.v }))) render(); }),
    'backup-agora': async el => { if (await executar(el, () => API.post('/api/admin/backup'))) render(); },
    'novo-admin': () => UI.abrir({ titulo: 'Novo usuário da plataforma', corpo: '<form class="stack" novalidate><div class="field"><label for="na-perfil">Perfil</label><select id="na-perfil" class="inp"><option value="admin">Administrador (acesso total)</option><option value="financeiro">Financeiro (só clientes e mensalidades)</option></select></div><div class="field"><label for="na-nome">Nome</label><input id="na-nome" class="inp"></div><div class="field"><label for="na-email">E-mail (login)</label><input id="na-email" type="email" class="inp"></div>' + senhaForm('na-senha', 'Senha inicial (mín. 8)') + minhaSenhaForm() + '</form><p class="small muted">No primeiro acesso ele cadastra o 2FA.</p>', rodape: '<button class="btn" data-act="fechar">Cancelar</button><button class="btn pri" data-act="criar-admin">Criar usuário</button>' }),
    'criar-admin': async el => { if (await executar(el, () => API.post('/api/admin/administradores', { perfil: $('#na-perfil').value, nome: $('#na-nome').value, email: $('#na-email').value, senha: $('#na-senha').value, minhaSenha: $('#ms').value }))) { UI.fechar(); render(); } },
    'adm-senha': el => { const a = admPor(el); UI.abrir({ titulo: 'Redefinir a senha de ' + esc(a.nome), corpo: '<form class="stack" novalidate>' + senhaForm('as-senha', 'Nova senha (mín. 8)') + minhaSenhaForm() + '</form><p class="small muted">As sessões dele são encerradas.</p>', rodape: '<button class="btn" data-act="fechar">Cancelar</button><button class="btn pri" data-act="adm-senha-ok" data-id="' + a.id + '">Redefinir</button>' }); },
    'adm-senha-ok': async el => { if (await executar(el, () => API.post('/api/admin/administradores/' + el.dataset.id + '/senha', { senha: $('#as-senha').value, minhaSenha: $('#ms').value }))) { UI.fechar(); render(); } },
    'adm-2fa': el => { const a = admPor(el); UI.abrir({ titulo: 'Redefinir o 2FA de ' + esc(a.nome), corpo: '<form class="stack" novalidate><p>Ele perde o autenticador atual e os códigos de recuperação, e cadastra o 2FA de novo no próximo acesso.</p>' + minhaSenhaForm() + '</form>', rodape: '<button class="btn" data-act="fechar">Cancelar</button><button class="btn pri danger" data-act="adm-2fa-ok" data-id="' + a.id + '">Redefinir 2FA</button>' }); },
    'adm-2fa-ok': async el => { if (await executar(el, () => API.post('/api/admin/administradores/' + el.dataset.id + '/2fa/redefinir', { minhaSenha: $('#ms').value }))) { UI.fechar(); render(); } },
    'adm-ativo': el => { const a = admPor(el); UI.abrir({ titulo: (a.ativo ? 'Desativar ' : 'Reativar ') + esc(a.nome), corpo: '<form class="stack" novalidate><p>' + (a.ativo ? 'Ele deixa de entrar na plataforma e as sessões dele são encerradas.' : 'Ele volta a entrar com a senha e o 2FA que já tinha.') + '</p>' + minhaSenhaForm() + '</form>', rodape: '<button class="btn" data-act="fechar">Cancelar</button><button class="btn pri' + (a.ativo ? ' danger' : '') + '" data-act="adm-ativo-ok" data-id="' + a.id + '" data-ativo="' + (a.ativo ? '0' : '1') + '">' + (a.ativo ? 'Desativar' : 'Reativar') + '</button>' }); },
    'adm-ativo-ok': async el => { if (await executar(el, () => API.patch('/api/admin/administradores/' + el.dataset.id, { ativo: el.dataset.ativo === '1', minhaSenha: $('#ms').value }))) { UI.fechar(); render(); } },
    'minha-senha': () => UI.abrir({ titulo: 'Alterar minha senha', corpo: '<form class="stack" novalidate><div class="field"><label for="m-atual">Senha atual</label><input id="m-atual" type="password" class="inp" autocomplete="current-password"></div>' + senhaForm('m-nova', 'Nova senha (mín. 8)') + '</form>', rodape: '<button class="btn" data-act="fechar">Cancelar</button><button class="btn pri" data-act="salvar-minha-senha">Alterar</button>' }),
    'salvar-minha-senha': async el => { if (await executar(el, () => API.post('/api/me/senha', { atual: $('#m-atual').value, nova: $('#m-nova').value }))) UI.fechar(); },
    'novos-codigos': () => UI.abrir({ titulo: 'Novos códigos de recuperação', corpo: '<form class="stack" novalidate><p>Os códigos atuais deixam de valer. Confirme sua senha.</p><div class="field"><label for="nc-senha">Senha</label><input id="nc-senha" type="password" class="inp" autocomplete="current-password"></div></form>', rodape: '<button class="btn" data-act="fechar">Cancelar</button><button class="btn pri" data-act="gerar-codigos">Gerar</button>' }),
    'gerar-codigos': async el => { try { el.disabled = true; const r = await API.post('/api/me/codigos-recuperacao', { senha: $('#nc-senha').value }); UI.fechar(); UI.mostrarCodigos(r.codigos); } catch (e) { el.disabled = false; UI.toast(e.message); } }
  };
  document.addEventListener('click', e => {
    const el = e.target.closest('[data-act]'); if (!el) return;
    const f = ACT[el.dataset.act]; if (!f) return;
    if (el.tagName === 'A' || el.closest('form')) e.preventDefault();
    f(el, e);
  });
  document.addEventListener('change', async e => {
    const lg = e.target.closest('[data-chg="logo"]');
    if (lg) {
      const f = lg.files[0]; lg.value = ''; if (!f) return;
      try { const img = await UI.prepararLogo(f); if (await executar(null, () => API.patch('/api/admin/haras/' + lg.dataset.id, { logo: img }), 'Logotipo atualizado.')) render(); }
      catch (err) { UI.toast(err.message); }
      return;
    }
    const el = e.target.closest('[data-chg="plano"]'); if (!el) return;
    const h = S.haras.find(x => String(x.id) === el.dataset.id);
    if (!(await executar(null, () => API.patch('/api/admin/haras/' + h.id, { plano: el.value })))) el.value = h.plano;
    render();
  });
  (async () => {
    $('#view').innerHTML = '<div class="empty">Carregando...</div>';
    try {
      const me = await API.get('/api/me');
      if (me.perfil !== 'admin' && me.perfil !== 'financeiro') { location.href = me.destino || '/entrar'; return; }
      perfil = me.perfil; if (perfil === 'financeiro') view = 'financeiro';
      await recarregar(); render();
    }
    catch (e) { if (/administrador/.test(e.message)) { location.href = '/entrar'; return; } $('#view').innerHTML = '<div class="note bad">' + esc(e.message) + '</div>'; }
  })();
})();
</script>
