name: haras360
description: App Android do Haras360 para o caseiro (offline, envio no Wi-Fi) e o gestor (v1.5.0).
publish_to: none
# A versão vem do arquivo VERSION do repositório (o build usa --build-name e --build-number).
version: 1.1.0+10100

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  sqflite: 2.4.1
  path: ^1.9.0
  path_provider: 2.1.5
  http: 1.2.2
  flutter_secure_storage: 9.2.2
  workmanager: 0.5.2
  connectivity_plus: 6.1.1
  mobile_scanner: 6.0.2
  image_picker: 1.1.2
  uuid: 4.5.1
  url_launcher: 6.3.1
  record: 6.0.0
  audioplayers: 6.1.0
  flutter_local_notifications: 18.0.1
  local_auth: 2.3.0
  share_plus: 10.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: 5.0.0
  crypto: 3.0.6

flutter:
  uses-material-design: true
  assets:
    - recursos/icone/mipmap-xxxhdpi/ic_launcher.png
    - recursos/logo-claro.png
    - recursos/ilustracao-app.png
    - recursos/ilustracao-cabecalho.png
  # Identidade v1.3.0: Inter (textos) e Manrope (títulos), dentro do APK para funcionar offline (licença OFL em recursos/fontes)
  fonts:
    - family: Inter
      fonts:
        - asset: recursos/fontes/Inter_400Regular.ttf
        - asset: recursos/fontes/Inter_500Medium.ttf
          weight: 500
        - asset: recursos/fontes/Inter_600SemiBold.ttf
          weight: 600
        - asset: recursos/fontes/Inter_700Bold.ttf
          weight: 700
    - family: Manrope
      fonts:
        - asset: recursos/fontes/Manrope_700Bold.ttf
          weight: 700
        - asset: recursos/fontes/Manrope_800ExtraBold.ttf
          weight: 800
