        '<h3 style="margin:22px 0 6px">Programados</h3><div class="tasks">' + (fu.length ? fu.map(t => UI.linhaTarefa(t, { semAnimal: true })).join('') : '<div class="empty">Sem etapas futuras.</div>') + '</div>';
    } else {
      const ge = a.genealogia || {};
      const f = (id, lab, val, extra) => '<div class="field' + (extra || '') + '"><label for="d-' + id + '">' + lab + '</label><input id="d-' + id + '" class="inp" value="' + esc(val || '') + '"></div>';
      corpo = '<form id="fd" class="stack" novalidate><h3>Dados cadastrais</h3><div class="fgrid">' +
        f('nome', 'Nome', a.nome) + f('pelagem', 'Pelagem', a.pelagem) +
        f('registro', 'Registro ABCCMM', a.registro) + f('livro', 'Livro', a.livro) +
        '<div class="field"><label for="d-sexo">Sexo</label><select id="d-sexo" class="inp"><option value="F"' + (a.sexo === 'F' ? ' selected' : '') + '>Fêmea</option><option value="M"' + (a.sexo === 'M' ? ' selected' : '') + '>Macho</option></select></div>' +
        '<div class="field"><label for="d-nasc">Nascimento</label><input id="d-nasc" type="date" class="inp" value="' + esc(a.nascimento) + '"></div>' +
        f('chip', 'Microchip', a.chip) +
        '<div class="field"><label for="d-dna">DNA</label><select id="d-dna" class="inp">' + ['DNA - VP', 'Sem exame'].concat(['DNA - VP', 'Sem exame'].includes(a.dna) ? [] : [a.dna]).map(o => '<option' + (o === a.dna ? ' selected' : '') + '>' + esc(o) + '</option>').join('') + '</select></div>' +
        (a.baixa ? '<div class="field"><span class="lbl">Situação</span><p class="small" style="margin:8px 0 0">Baixado: ' + esc(a.baixa.motivo.toLowerCase()) + ' em ' + br(a.baixa.data) + '</p><input id="d-vivo" type="hidden" value="0"></div>' :
          '<div class="field"><label for="d-vivo">Situação</label><select id="d-vivo" class="inp"><option value="1"' + (a.vivo ? ' selected' : '') + '>Vivo, ativo no plantel</option><option value="0"' + (!a.vivo ? ' selected' : '') + '>Inativo (sem baixa registrada)</option></select></div>') +
        '<div class="field"><label for="d-bloq">Bloqueio ABCCMM</label><select id="d-bloq" class="inp"><option value="0"' + (!a.bloqueado ? ' selected' : '') + '>Não bloqueado</option><option value="1"' + (a.bloqueado ? ' selected' : '') + '>Bloqueado</option></select></div>' +
        '</div><div class="spread" style="margin-top:8px"><h3>Genealogia</h3><div class="row"><label class="btn sm" for="cert">' + IC.file + 'Importar certificado (PDF)</label><input id="cert" type="file" accept="application/pdf,.pdf" hidden></div></div>' +
        '<p class="small muted">O Relatório de Plantel não traz genealogia. Preencha à mão ou importe o certificado de registro, se houver. Os campos encontrados no PDF aparecem destacados para conferência.</p><p id="cert-st" class="note" hidden></p>' +
        '<div class="fgrid">' + f('pai', 'Pai', ge.pai) + f('mae', 'Mãe', ge.mae) + f('avoPaterno', 'Avô paterno', ge.avoPaterno) + f('avoPaterna', 'Avó paterna', ge.avoPaterna) + f('avoMaterno', 'Avô materno', ge.avoMaterno) + f('avoMaterna', 'Avó materna', ge.avoMaterna) + '</div>' +
        '<div class="row" style="justify-content:flex-end"><button type="button" class="btn pri" data-act="salvar-dados" data-id="' + a.id + '">' + IC.check + 'Salvar dados</button></div></form>';
    }
    const chips = [(a.sexo === 'F' ? 'Fêmea' : 'Macho'), H.idadeTxt(a.nascimento)].map(x => '<span class="chip nodot c-muted">' + x + '</span>').join(' ') +
      (g ? ' <span class="chip c-accent">Gestante · ' + g.mes + 'º mês</span>' : '') + (!a.registro ? ' <span class="chip c-late">Sem registro</span>' : '') + (/sem/i.test(a.dna) ? ' <span class="chip c-late">DNA pendente</span>' : '') + (a.baixa ? ' <span class="chip c-muted">Baixado</span>' : !a.vivo ? ' <span class="chip c-muted">Inativo</span>' : '');
    const baixa = a.baixa ? '<div class="note warn spread" style="align-items:center"><span><b>Fora do plantel ativo.</b> ' + esc(a.baixa.motivo) + ' em ' + br(a.baixa.data) + (a.baixa.destino ? ' · destino: ' + esc(a.baixa.destino) : '') + (a.baixa.obs ? ' · ' + esc(a.baixa.obs) : '') + '. O prontuário continua guardado.</span><button class="btn sm" data-act="desfazer-baixa" data-id="' + a.id + '">Desfazer baixa</button></div>' : '';
    return '<div class="sec"><div class="spread"><button class="btn ghost" data-act="nav" data-v="animais">' + IC.back + 'Voltar ao plantel</button><div class="row">' + chips + (a.baixa ? '' : ' <button class="btn ghost sm danger" data-act="dar-baixa" data-id="' + a.id + '">Dar baixa</button>') + '</div></div>' +
      baixa + '<div class="card"><dl class="facts"><div><dt>Registro</dt><dd class="mono">' + esc(a.registro || '-') + '</dd></div><div><dt>Livro</dt><dd>' + esc(a.livro || '-') + '</dd></div><div><dt>Nascimento</dt><dd>' + br(a.nascimento) + '</dd></div><div><dt>Microchip</dt><dd class="mono">' + esc(a.chip || '-') + '</dd></div><div><dt>DNA</dt><dd>' + esc(a.dna || '-') + '</dd></div><div><dt>Origem do cadastro</dt><dd>' + esc(a.origem || 'Manual') + (a.importadoEm ? ' · ' + br(a.importadoEm) : '') + '</dd></div></dl>' +
      (g ? '<div style="margin-top:16px;padding-top:16px;border-top:1px solid var(--line-2)">' + gestBloco(a, g) + '</div>' : '') + '</div>' +
      '<div class="card"><div class="tabs" role="tablist">' + tabs.map(([k, l]) => '<button role="tab" aria-selected="' + (fichaTab === k) + '" data-act="tab" data-t="' + k + '">' + l + '</button>').join('') + '</div><div style="padding-top:14px">' + corpo + '</div></div></div>';
  }

  /* ================= IMPORTAR ================= */
  function vImportar() {
    if (!importacao) {
      return '<div class="sec"><div class="steps"><span class="on">1. Enviar PDF</span><span>2. Conferir</span><span>3. Importar</span></div>' +
        '<div class="grid2"><div class="card stack"><h2>Relatório de Plantel da ABCCMM</h2><p class="muted">Envie o PDF gerado no Sistema de Gestão ABCCMM. O Haras360 lê nome, livro, registro, sexo, bloqueio, situação, DNA, nascimento e microchip de cada animal e confere com o resumo do relatório antes de gravar.</p>' +
        '<label class="drop" id="drop" for="pdf">' + IC.upload + '<b>Arraste o PDF aqui ou clique para escolher</b><span class="small muted">Arquivo .pdf · o conteúdo é lido no seu navegador</span></label><input id="pdf" type="file" accept="application/pdf,.pdf" hidden>' +
        '<p id="imp-st" class="note" hidden></p></div>' +
        '<div class="card stack"><h3>Como funciona</h3><ol class="small" style="margin:0;padding-left:18px;display:flex;flex-direction:column;gap:8px"><li>Animais já cadastrados são reconhecidos pelo registro, chip ou nome, e não são duplicados.</li><li>Animais sem registro ou sem exame de DNA geram pendências documentais.</li><li>A data de nascimento alimenta o motor de regras, que calcula a agenda de vacinas e manejos.</li><li>A genealogia é completada depois, na ficha, à mão ou pelo certificado.</li></ol>' +
        '<p class="note">O PDF é lido no seu navegador; só os dados dos animais selecionados são enviados ao servidor. O CPF do associado não é gravado.</p></div></div></div>';
    }
    const { res, comp } = importacao;
    const sel = importacao.sel;
    const novos = comp.filter((c, i) => sel.has(i) && c.situacao === 'novo').length;
    const atual = comp.filter((c, i) => sel.has(i) && c.situacao === 'atualizar').length;
    const ativos = S.animais.filter(a => a.vivo).length;
    const depois = ativos + comp.filter((c, i) => sel.has(i) && c.situacao === 'novo' && c.novo.vivo).length;
    const confere = res.totalInformado === null ? '<p class="note warn">O resumo do relatório não foi encontrado. Confira a lista manualmente.</p>' : res.totalInformado === res.animais.length ? '<p class="note good">Conferência ok: ' + res.animais.length + ' animais lidos, igual ao total informado no relatório (' + res.machos + ' machos e ' + res.femeas + ' fêmeas).</p>' : '<p class="note bad">Atenção: ' + res.animais.length + ' animais lidos, mas o relatório informa ' + res.totalInformado + '. Confira as linhas não reconhecidas abaixo.</p>';
    const lim = depois > H.LIMITE_ANIMAIS ? '<p class="note bad">O plano atende até ' + H.LIMITE_ANIMAIS + ' animais por haras. Desmarque ' + (depois - H.LIMITE_ANIMAIS) + ' animal(is) para continuar.</p>' : (depois !== ativos && mensal(depois) !== null && mensal(depois) !== mensal(ativos)) ? '<p class="note">Com ' + depois + ' animais ativos, a mensalidade passa de ' + H.moeda(mensal(ativos) || 0) + ' para ' + H.moeda(mensal(depois)) + '.</p>' : '';
    const sit = { novo: '<span class="chip c-ok">Novo</span>', atualizar: '<span class="chip c-soon">Atualizar</span>', igual: '<span class="chip c-muted">Já cadastrado</span>' };
    const rot = { nome: 'nome', livro: 'livro', registro: 'registro', sexo: 'sexo', bloqueado: 'bloqueio', vivo: 'situação', dna: 'DNA', nascimento: 'nascimento', chip: 'chip' };
    return '<div class="sec"><div class="steps"><span>1. Enviar PDF</span><span class="on">2. Conferir</span><span>3. Importar</span></div>' +
      '<div class="card"><dl class="facts"><div><dt>Arquivo</dt><dd>' + esc(importacao.arquivo) + '</dd></div><div><dt>Associado(a)</dt><dd>' + esc(res.associado || 'Não identificado') + '</dd></div><div><dt>CPF</dt><dd class="mono">' + esc(H.mascaraCPF(res.cpf)) + '</dd></div><div><dt>Impresso em</dt><dd>' + (res.impresso ? br(res.impresso) : '-') + '</dd></div></dl></div>' +
      confere + lim +
      '<div class="card flush"><div class="tbl-wrap"><table class="tbl"><thead><tr><th><span class="sr">Incluir</span></th><th>Situação</th><th>Animal</th><th>Livro</th><th>Registro</th><th>Sexo</th><th>Nascimento</th><th>DNA</th><th>Chip</th><th>Alertas</th></tr></thead><tbody>' +
      comp.map((c, i) => {
        const n = c.novo;
        const al = [!n.registro ? 'Sem registro' : '', /sem/i.test(n.dna) ? 'Sem DNA' : '', n.bloqueado ? 'Bloqueado' : '', !n.vivo ? 'Morto' : ''].filter(Boolean).map(x => '<span class="chip c-late">' + x + '</span>').join(' ');
        const dif = c.situacao === 'atualizar' ? '<br><span class="small muted">Muda: ' + c.diffs.map(d => rot[d]).join(', ') + '</span>' : '';
        return '<tr><td><input type="checkbox" data-chg="imp-sel" data-i="' + i + '"' + (sel.has(i) ? ' checked' : '') + (c.situacao === 'igual' ? ' disabled' : '') + ' aria-label="Incluir ' + esc(n.nome) + '"></td><td>' + sit[c.situacao] + '</td><td><b>' + esc(n.nome) + '</b>' + dif + '</td><td class="small">' + esc(n.livro || '-') + '</td><td class="mono">' + esc(n.registro || '-') + '</td><td>' + n.sexo + '</td><td class="mono">' + br(n.nascimento) + '</td><td class="small">' + esc(n.dna) + '</td><td class="mono small">' + esc(n.chip || '-') + '</td><td><div class="row" style="gap:4px">' + (al || '<span class="muted small">-</span>') + '</div></td></tr>';
      }).join('') + '</tbody></table></div></div>' +
      (res.ignoradas.length ? '<div class="note warn"><b>Linhas não reconhecidas:</b><br>' + res.ignoradas.map(esc).join('<br>') + '</div>' : '') +
      '<div class="row" style="justify-content:flex-end"><button class="btn" data-act="imp-cancelar">Cancelar</button><button class="btn pri" data-act="imp-confirmar"' + ((novos + atual === 0 || depois > H.LIMITE_ANIMAIS) ? ' disabled' : '') + '>' + IC.check + 'Importar ' + novos + ' novo(s) e atualizar ' + atual + '</button></div></div>';
  }
  async function lerPDF(file) {
    const st = $('#imp-st');
    const msg = (t, c) => { st.textContent = t; st.className = 'note ' + (c || ''); st.hidden = false; };
    if (!file) return;
    if (!/pdf$/i.test(file.type) && !/\.pdf$/i.test(file.name)) return msg('Envie um arquivo em PDF.', 'bad');
    msg('Lendo o PDF...');
    try {
      const linhas = await H.linhasPDF(file);
      const res = H.lerPlantel(linhas);
      if (!linhas.length) return msg('Não encontramos texto neste PDF. Ele pode ser uma imagem digitalizada; gere o relatório novamente no Sistema de Gestão ABCCMM.', 'bad');
      if (!res.animais.length) return msg(res.valido ? 'O PDF é da ABCCMM, mas não encontramos linhas de animais. Confira se é o Relatório de Plantel.' : 'Este PDF não parece ser um Relatório de Plantel da ABCCMM.', 'bad');
      const comp = H.compararImportacao(S, res.animais);
      importacao = { arquivo: file.name, res, comp, sel: new Set(comp.map((c, i) => c.situacao !== 'igual' ? i : -1).filter(i => i >= 0)) };
      render();
    } catch (e) { msg('Não foi possível ler o PDF: ' + e.message, 'bad'); }
  }
  async function confirmarImportacao(el) {
    const { res, comp, sel } = importacao;
    const animais = comp.filter((c, i) => sel.has(i) && c.situacao !== 'igual').map(c => c.novo);
    const r = await executar(el, () => API.post('/api/importacao', { arquivo: importacao.arquivo, associado: res.associado, impresso: res.impresso, animais }));
    if (r) { importacao = null; go('animais'); }
  }

  /* ================= AGENDA ================= */
  function vAgenda(modulo) {
    let ts = H.tarefas(S);
    if (modulo === 'sanidade') ts = ts.filter(t => SANITARIOS.includes(t.cat));
    if (agendaCat !== 'todos') ts = ts.filter(t => t.cat === agendaCat);
    const lim90 = H.iso(H.addDias(H.hoje(), 90));
    if (agendaFiltro === 'aberto') ts = ts.filter(t => t.status !== 'futuro');
    if (agendaFiltro === '90') ts = ts.filter(t => t.doc || t.due <= lim90);
    const grupos = [['atrasado', 'Atrasados'], ['pendente', 'Pendências documentais'], ['hoje', 'Hoje'], ['semana', 'Próximos 7 dias'], ['mes', 'Próximos 30 dias'], ['futuro', 'Programados']];
    const seg = [['aberto', 'Em aberto'], ['90', 'Próximos 90 dias'], ['tudo', 'Tudo']];
    const cats = [...new Set(H.tarefas(S).map(t => t.cat))].filter(c => modulo !== 'sanidade' || SANITARIOS.includes(c));
    return '<div class="sec"><div class="spread"><div class="seg" role="group" aria-label="Período">' + seg.map(([k, l]) => '<button data-act="agenda-f" data-f="' + k + '" aria-pressed="' + (agendaFiltro === k) + '">' + l + '</button>').join('') + '</div>' +
      '<select id="agendaCat" class="inp" style="width:auto"><option value="todos">Todas as categorias</option>' + cats.map(c => '<option value="' + c + '"' + (agendaCat === c ? ' selected' : '') + '>' + H.CATS[c].nome + '</option>').join('') + '</select></div>' +
      (ts.length ? grupos.map(([k, l]) => { const g = ts.filter(t => t.status === k); return g.length ? '<div class="card flush"><div class="card-h" style="padding:14px 18px 0"><h3>' + l + '</h3><span class="small muted">' + g.length + '</span></div><div class="tasks" style="padding:2px 18px 6px 0">' + g.map(t => UI.linhaTarefa(t)).join('') + '</div></div>' : ''; }).join('') : '<div class="card empty">Nada para mostrar com esses filtros.</div>') +
      '<p class="small muted">Datas calculadas pelo motor de regras a partir do nascimento, do último registro e dos protocolos configurados. Ajuste intervalos em Protocolos.</p></div>';
  }

  /* ================= PROTOCOLOS ================= */
  function vProtocolos() {
    const vac = S.protocolos.filter(p => p.cat === 'vacina'), outros = S.protocolos.filter(p => p.cat !== 'vacina');
    const inp = (p, k, val, extra) => '<input class="inp w-num mono" id="p-' + p.id + '-' + k + '" value="' + esc(val) + '" inputmode="numeric"' + (extra || '') + '>';
    return '<div class="sec"><p class="note">Vacinas seguem o protocolo publicado pela VetJr. UFMG; os demais manejos usam padrões de mercado. Os intervalos são editáveis e devem ser validados pelo médico veterinário responsável pelo plantel.</p>' +

  function salvarProtocolos(el) {
    const lista = [];
    for (const p of S.protocolos) {
      const g = k => document.getElementById('p-' + p.id + '-' + k);
      const item = { id: p.id };
      const at = g('ativo'); if (at) item.ativo = at.checked;
      const id = g('idade'); if (id) { const v = parseInt(id.value, 10); if (isNaN(v) || v < 0 || v > 120) { UI.toast('Idade inválida em ' + p.nome + '. Use meses entre 0 e 120.'); id.focus(); return; } item.idadeMeses = v; }
      const se = g('serie'); if (se) { const arr = se.value.split(/[,;\s]+/).filter(Boolean).map(Number); if (arr.some(x => isNaN(x) || x < 1 || x > 400)) { UI.toast('Série inválida em ' + p.nome + '. Informe dias separados por vírgula, ex.: 30, 30.'); se.focus(); return; } item.serie = arr; }
      const rf = g('ref'); if (rf) { const v = parseInt(rf.value, 10); if (isNaN(v) || v < 1 || v > 1500) { UI.toast('Intervalo inválido em ' + p.nome + '.'); rf.focus(); return; } item.reforcoDias = v; }
      lista.push(item);
    }
    executar(el, () => API.put('/api/protocolos', lista)).then(r => { if (r) render(); });
  }

  function mensal(n) {
    let t = 0;
    for (const f of S.plano.faixas) { const q = Math.max(0, Math.min(n, f.ate) - f.de + 1); if (q) { if (f.valor === null || f.valor === undefined) return null; t += q * f.valor; } }
    return Math.round(t * 100) / 100;
  }
  function vPlano() {
    const n = S.animais.filter(a => a.vivo).length, P = S.plano, m = P.mensalidade;
    if (simN === null) simN = Math.min(Math.max(n, 4), P.limite);
    return '<div class="sec"><div class="grid2"><div class="card stack"><div class="eyebrow">Plano do haras</div><div class="spread"><h2>' + esc(P.nome) + '</h2><b style="font-family:var(--f-display);font-size:1.8rem">' + (m === null ? 'A definir' : H.moeda(m) + '<span class="small muted" style="font-family:var(--f-body)"> /mês</span>') + '</b></div>' +
      '<div class="meter" role="img" aria-label="' + n + ' de ' + P.limite + ' animais"><i style="width:' + Math.min(100, n / P.limite * 100) + '%"></i></div><p class="small muted">' + n + ' de ' + P.limite + ' animais ativos. Animais mortos ou baixados deixam de contar.</p>' +
      '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Módulo</th><th>Incluído</th></tr></thead><tbody>' + Object.entries(P.modulosNomes).map(([k, l]) => '<tr><td>' + esc(l) + '</td><td>' + (P.modulos[k] ? '<span class="yes">Sim</span>' : '<span class="no">Não</span>') + '</td></tr>').join('') + '</tbody></table></div>' +
      '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Animais</th><th class="num">Por animal / mês</th></tr></thead><tbody>' + P.faixas.map(f => '<tr><td>' + f.de + ' a ' + f.ate + '</td><td class="num mono">' + valorFaixa(f.valor) + '</td></tr>').join('') + '</tbody></table></div>' +
      '<p class="note">Planos, módulos e valores são definidos pelo administrador da plataforma. A cobrança é progressiva: cada animal paga o valor da faixa em que entra.</p></div>' +
      '<div class="card stack"><h3>Simular mensalidade</h3><label for="sim" class="lbl">Quantidade de animais: <b id="sim-n" style="color:var(--ink)">' + simN + '</b></label><input id="sim" type="range" min="1" max="' + P.limite + '" value="' + simN + '"><div id="sim-out"></div></div></div></div>';
  }
  function simOut() {
    const n = simN, parts = [];
    for (const f of S.plano.faixas) { const q = Math.max(0, Math.min(n, f.ate) - f.de + 1); if (q) parts.push(q + ' × ' + valorFaixa(f.valor).toLowerCase()); }
    const m = mensal(n);
    $('#sim-n').textContent = n;
    $('#sim-out').innerHTML = '<b style="font-family:var(--f-display);font-size:2rem">' + (m === null ? 'A definir' : H.moeda(m)) + '</b>' + (m === null ? '' : '<span class="muted"> por mês</span>') + '<p class="small muted mono">' + parts.join(' + ') + '</p>';
  }

  const VIEWS = { relatorios: vRelatorios, painel: vPainel, sanidade: vSanidade, reproducao: vReproducao, animais: vAnimais, ficha: vFicha, importar: vImportar, agenda: vAgenda, protocolos: vProtocolos, notificacoes: vNotificacoes, equipe: vEquipe, assistente: vAssistente, plano: vPlano, parametros: vParametros, auditoria: vAuditoria, sobre: vSobre, glossario: vGlossario };
  const AFTER = {

    animais() {

      $('#sexoF').addEventListener('change', e => { sexoF = e.target.value; $('#tb-animais').innerHTML = linhasAnimais(); });

    },
    ficha(id) {
      const fc = $('#filtroCat'); if (fc) fc.addEventListener('change', e => { filtroCat = e.target.value; render(); });
      const ce = $('#cert'); if (ce) ce.addEventListener('change', async e => {
        const f = e.target.files[0]; e.target.value = ''; if (!f) return;
        const st = $('#cert-st'); st.hidden = false; st.className = 'note'; st.textContent = 'Lendo o certificado...';
        try {
          const g = H.lerGenealogia(await H.linhasPDF(f));
          const ks = Object.keys(g);
          if (!ks.length) { st.className = 'note warn'; st.textContent = 'Não encontramos campos de genealogia (Pai, Mãe, Avós) neste PDF. Preencha manualmente.'; return; }
          ks.forEach(k => { const el = document.getElementById('d-' + k); if (el) { el.value = g[k]; el.style.borderColor = 'var(--accent)'; el.style.background = 'var(--accent-soft)'; } });
          st.className = 'note good'; st.textContent = ks.length + ' campo(s) preenchido(s) a partir do PDF. Confira e clique em Salvar dados.';
        } catch (err) { st.className = 'note bad'; st.textContent = 'Não foi possível ler o PDF: ' + err.message; }
      });

      dr.addEventListener('drop', e => lerPDF(e.dataTransfer.files[0]));
    },

    assistente() {

      if (!(g >= 300 && g <= 380)) { UI.toast('Dias de gestação devem ficar entre 300 e 380.'); return; }
      if (!(t >= 0 && t <= 90)) { UI.toast('A tolerância deve ficar entre 0 e 90 dias.'); return; }
      const ci = Number($('#pa-ciclo').value), pd = Number($('#pa-pde').value), pa = Number($('#pa-pate').value);
      if (!(ci >= 18 && ci <= 25)) { UI.toast('O ciclo deve ficar entre 18 e 25 dias.'); return; }
      if (!(pd >= 5 && pd <= 15 && pa >= 6 && pa <= 20 && pd <= pa)) { UI.toast('Confira a janela do cio do potro: início entre 5 e 15, fim entre 6 e 20, e o início antes do fim.'); return; }
      const sem = document.querySelector('[data-act="pa-raiva"][aria-pressed="true"]').dataset.v === '1';
      const cio = document.querySelector('[data-act="pa-cio"][aria-pressed="true"]').dataset.v === '1';
      if (await executar(el, () => API.put('/api/haras', { nome: $('#pa-nome').value, municipio: $('#pa-mun').value, proprietario: $('#pa-prop').value, raivaSemestral: sem, gestacaoDias: g, toleranciaReinicio: t,
        previsaoCio: cio, cicloDias: ci, cioPotroDe: pd, cioPotroAte: pa }))) render();
    }
  };
  document.addEventListener('click', e => {
    const el = e.target.closest('[data-act]'); if (!el) return;
    const f = ACT[el.dataset.act]; if (!f) return;
    if (el.tagName === 'A' || el.tagName === 'TR' || el.closest('form')) e.preventDefault();
    f(el, e);
  });
  document.addEventListener('change', async e => {
    const el = e.target.closest('[data-chg]'); if (!el) return;
    if (el.dataset.chg === 'imp-sel') { const i = Number(el.dataset.i); el.checked ? importacao.sel.add(i) : importacao.sel.delete(i); render(); }
    if (el.dataset.chg === 'pref') {
      const p = JSON.parse(JSON.stringify(S.notifPrefs)); p[el.dataset.t][el.dataset.k] = el.checked;
      if (await executar(null, () => API.put('/api/notif-prefs', p), 'Preferência salva.')) render();
    }
  });
  (async () => {
    $('#view').innerHTML = '<div class="empty">Carregando o haras...</div>';
    try {
      await recarregar();
      if (S.usuario.perfil !== 'gestor') { location.href = '/campo'; return; }
      const alvo = new URLSearchParams(location.search).get('animal');
      if (alvo && H.animal(S, alvo)) { history.replaceState(null, '', '/gestor'); view = 'ficha'; param = alvo; }
      render();
    } catch (e) {
      if (/usuários de um haras/.test(e.message)) { location.href = '/admin'; return; }
      $('#view').innerHTML = '<div class="note bad">' + esc(e.message) + '</div>';
    }
  })();
})();
</script>
