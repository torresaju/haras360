<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Haras360 Gestor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
[hidden]{display:none!important}
body{margin:0}
img{max-width:100%}
:root{
  /* Identidade v1.3.0 · elegância equestre + tecnologia: verde haras, dourado, areia, grafite e verde sálvia */
  --bg:#F3F1E9; --surface:#FFFFFF; --surface-2:#F7F5EE; --ink:#292F2B; --muted:#5C6A61; --line:#E2DED1; --line-2:#ECE9DF;
  --forest:#193D30; --forest-2:#22503F; --forest-ink:#F3F1E9; --forest-muted:#A9BBAF;
  --accent:#193D30; --accent-soft:#E2ECE5; --accent-ink:#FFFFFF;
  --gold:#D5A064; --gold-ink:#292F2B; --gold-text:#8A5E26; --gold-soft:#F6EBDC; --salvia:#82978A;
  --late:#B3261E; --late-soft:#F9E3DF; --soon:#8F5A0B; --soon-soft:#FBEED7; --ok:#2E6B45; --ok-soft:#DDEFE3; --info:#2C5B84; --info-soft:#E0EAF3; --repro:#6B4E8C; --repro-soft:#EEE8F5;
  --shadow:0 1px 2px rgba(25,61,48,.05),0 8px 24px rgba(25,61,48,.06);
  --f-display:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-body:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:14px; --lat:252px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1713; --surface:#16211B; --surface-2:#1C2922; --ink:#E8ECE6; --muted:#A3B2A8; --line:#2A3830; --line-2:#223029;
  --forest:#0C1A14; --forest-2:#17302A; --forest-ink:#EDEBE2; --forest-muted:#93A99B;
  --accent:#8CC5A2; --accent-soft:#1D3328; --accent-ink:#0C1A14;
  --gold:#D5A064; --gold-ink:#1B1A16; --gold-text:#E2B57E; --gold-soft:#33291B; --salvia:#82978A;
  --late:#F0897A; --late-soft:#3A1D18; --soon:#E6B25C; --soon-soft:#352810; --ok:#7CCB97; --ok-soft:#163022; --info:#8DB8E0; --info-soft:#172838; --repro:#C3A6E6; --repro-soft:#2A2238;
  --shadow:0 1px 2px rgba(0,0,0,.35); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0F1713; --surface:#16211B; --surface-2:#1C2922; --ink:#E8ECE6; --muted:#A3B2A8; --line:#2A3830; --line-2:#223029;
  --forest:#0C1A14; --forest-2:#17302A; --forest-ink:#EDEBE2; --forest-muted:#93A99B;
  --accent:#8CC5A2; --accent-soft:#1D3328; --accent-ink:#0C1A14;
  --gold:#D5A064; --gold-ink:#1B1A16; --gold-text:#E2B57E; --gold-soft:#33291B; --salvia:#82978A;
  --late:#F0897A; --late-soft:#3A1D18; --soon:#E6B25C; --soon-soft:#352810; --ok:#7CCB97; --ok-soft:#163022; --info:#8DB8E0; --info-soft:#172838; --repro:#C3A6E6; --repro-soft:#2A2238;
  --shadow:0 1px 2px rgba(0,0,0,.35); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--f-display);font-weight:800;line-height:1.15;margin:0;text-wrap:balance;letter-spacing:-.015em}
h1{font-size:clamp(1.6rem,1.2rem + 1.4vw,2.2rem)}
h2{font-size:1.3rem}
h3{font-size:1.06rem}
p{margin:0}
a{color:var(--accent);text-underline-offset:2px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-size:.86em;letter-spacing:.01em;font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.eyebrow{font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:1000px){.grid2{grid-template-columns:minmax(0,1fr)}}

/* botões */
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);padding:9px 16px;border-radius:10px;cursor:pointer;font-weight:600;font-size:.9rem;line-height:1.2;text-decoration:none;color:var(--ink);white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--accent);padding-inline:8px}
.btn.gold{background:var(--gold);border-color:var(--gold);color:var(--gold-ink)}
.btn.ghost:hover{background:var(--accent-soft)}
.btn.sm{padding:5px 10px;font-size:.82rem}
.btn.danger{color:var(--late)}
.btn.pri.danger{background:var(--late);border-color:var(--late);color:#fff}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn svg{width:16px;height:16px;flex:none}

/* superfícies */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.card.flush{padding:0;overflow:hidden}
.card-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.sec{display:flex;flex-direction:column;gap:18px}

/* chips de estado */
.chip{display:inline-flex;align-items:center;gap:6px;font-size:.76rem;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap;border:1px solid transparent}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.85}
.chip.nodot::before{display:none}
.c-late{background:var(--late-soft);color:var(--late)}
.c-soon{background:var(--soon-soft);color:var(--soon)}
.c-ok{background:var(--ok-soft);color:var(--ok)}
.c-info{background:var(--info-soft);color:var(--info)}
.c-accent{background:var(--accent-soft);color:var(--accent)}
.c-muted{background:var(--surface-2);color:var(--muted)}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:900px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:2px;text-align:left;cursor:pointer}
.kpi:hover{border-color:var(--muted)}
.kpi b{font-family:var(--f-display);font-size:2rem;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi span{font-size:.84rem;color:var(--muted)}
.kpi.late b{color:var(--late)} .kpi.soon b{color:var(--soon)} .kpi.info b{color:var(--info)}

/* tarefas */
.tasks{display:flex;flex-direction:column}
.task{display:grid;grid-template-columns:4px 64px minmax(0,1fr) auto;gap:12px;align-items:center;padding:11px 16px 11px 0;border-top:1px solid var(--line-2)}
.task:first-child{border-top:0}
.task .bar{align-self:stretch;border-radius:0 3px 3px 0;background:var(--line)}
.task.atrasado .bar{background:var(--late)} .task.hoje .bar,.task.semana .bar{background:var(--soon)} .task.pendente .bar{background:var(--info)} .task.mes .bar{background:var(--ok)}
.task .when{font-family:var(--f-mono);font-size:.78rem;color:var(--muted);line-height:1.25}
.task .when b{display:block;font-size:.95rem;color:var(--ink);font-weight:500}
.task .what{min-width:0}
.task .what strong{font-weight:600}
.task .what .sub{font-size:.84rem;color:var(--muted)}
@media (max-width:560px){.task{grid-template-columns:4px 54px minmax(0,1fr)}.task .act{grid-column:3}}

/* tabelas */
.tbl-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:.9rem}
.tbl th{text-align:left;font-size:.72rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:11px 12px;border-bottom:1px solid var(--line-2);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr.click{cursor:pointer}
.tbl tbody tr.click:hover td{background:var(--surface-2)}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums}

/* formulários */
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>label,.lbl{font-size:.8rem;font-weight:600;color:var(--muted)}
.inp{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 11px;min-width:0}
.inp:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
textarea.inp{min-height:84px;resize:vertical}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.fgrid .full{grid-column:1/-1}
@media (max-width:560px){.fgrid{grid-template-columns:minmax(0,1fr)}}
.checks{display:flex;flex-wrap:wrap;gap:8px}
.check{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer;font-size:.88rem;background:var(--surface)}
.check:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.check input{accent-color:var(--accent)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:7px 14px;cursor:pointer;font-weight:600;font-size:.86rem}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.drop{border:1.5px dashed var(--line);border-radius:var(--r);padding:28px 18px;text-align:center;background:var(--surface-2);display:flex;flex-direction:column;gap:10px;align-items:center}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}

/* abas */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{border:0;background:none;padding:10px 14px;cursor:pointer;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}

/* prontuário */
.timeline{display:flex;flex-direction:column}
.ev{display:grid;grid-template-columns:96px minmax(0,1fr);gap:16px;padding:14px 0;border-top:1px solid var(--line-2)}
.ev:first-child{border-top:0}
.ev .d{font-family:var(--f-mono);font-size:.8rem;color:var(--muted);padding-top:2px}
.ev .body{display:flex;flex-direction:column;gap:6px;min-width:0}
.ev .meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.84rem;color:var(--muted)}
.ev .obs{font-size:.92rem;overflow-wrap:anywhere}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumbs button{padding:0;border:1px solid var(--line);border-radius:6px;overflow:hidden;cursor:zoom-in;width:72px;height:72px;background:var(--surface-2)}
.thumbs img{width:100%;height:100%;object-fit:cover;display:block}
@media (max-width:560px){.ev{grid-template-columns:minmax(0,1fr);gap:4px}}

/* gestação */
.gest{display:flex;flex-direction:column;gap:8px}
.gbar{height:8px;border-radius:99px;background:var(--surface-2);position:relative;overflow:hidden;border:1px solid var(--line-2)}
.gbar i{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:99px}
.gmarks{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:.7rem;color:var(--muted)}

/* modal e toast */
.modal{position:fixed;inset:0;background:rgba(10,16,12,.5);display:flex;align-items:flex-start;justify-content:center;z-index:50;padding:max(24px,env(safe-area-inset-top,0px)) 16px 24px;overflow-y:auto}
.sheet{background:var(--surface);color:var(--ink);border-radius:14px;width:min(640px,100%);box-shadow:0 20px 60px rgba(0,0,0,.25);display:flex;flex-direction:column;max-height:none}
.sheet header{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:18px 20px;border-bottom:1px solid var(--line)}
.sheet .sbody{padding:18px 20px;display:flex;flex-direction:column;gap:14px}
.sheet footer{display:flex;justify-content:flex-end;gap:10px;padding:14px 20px;border-top:1px solid var(--line);flex-wrap:wrap}
.sheet.wide{width:min(900px,100%)}
.x{border:0;background:none;cursor:pointer;font-size:1.4rem;line-height:1;color:var(--muted);padding:4px 8px;border-radius:6px}
.x:hover{background:var(--surface-2)}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:10px;font-size:.9rem;max-width:min(560px,calc(100% - 32px));z-index:60;box-shadow:var(--shadow)}
.note{border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:10px 12px;font-size:.86rem;color:var(--muted)}
.note.warn{background:var(--soon-soft);border-color:transparent;color:var(--soon)}
.note.bad{background:var(--late-soft);border-color:transparent;color:var(--late)}
.note.good{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}

/* chat */
.chat{display:flex;flex-direction:column;height:min(68vh,640px)}
.msgs{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:12px;padding:18px}
.msg{max-width:78%;padding:10px 14px;border-radius:12px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:.93rem}
.msg.me{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:4px}
.msg.bot{align-self:flex-start;background:var(--surface-2);border:1px solid var(--line-2);border-bottom-left-radius:4px}
.msg .src{display:block;margin-top:6px;font-size:.74rem;color:var(--muted);font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.chat form{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line)}
.sugs{display:flex;gap:6px;flex-wrap:wrap;padding:0 18px 12px}
.sugs button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 11px;font-size:.82rem;cursor:pointer}
.sugs button:hover{border-color:var(--accent);color:var(--accent)}
@media (max-width:560px){.msg{max-width:92%}}

@media (prefers-reduced-motion:no-preference){
  .view-in{animation:vin .22s ease-out}
  @keyframes vin{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}
}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- v1.3.0: menu lateral permanente + cabeçalho do haras (gestor e administrador) ---------- */
:root{--forest-accent:var(--gold)}
.side{position:fixed;inset:0 auto 0 0;width:var(--lat);z-index:45;background:var(--forest);color:var(--forest-ink);display:flex;flex-direction:column;overflow:hidden}
.side-marca{display:flex;align-items:center;gap:10px;padding:22px 20px 18px;color:inherit;text-decoration:none}
.logo-sim{width:46px;height:46px;flex:none}
.marca-txt b{display:block;font-family:var(--f-display);font-weight:800;font-size:1.45rem;line-height:1;letter-spacing:-.02em}
.marca-txt b i{font-style:normal;color:var(--gold)}
.marca-txt small{display:block;font-size:.62rem;letter-spacing:.26em;text-transform:uppercase;color:var(--forest-muted);margin-top:5px}
.marca-img img{max-height:52px;max-width:200px;display:block;object-fit:contain}
.side-nav{flex:1;overflow-y:auto;padding:6px 12px 12px;display:flex;flex-direction:column;gap:2px}
.si{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;color:var(--forest-ink);opacity:.86;padding:10px 12px;border-radius:10px;cursor:pointer;font:600 .93rem var(--f-body);text-align:left;text-decoration:none}
.si svg{width:20px;height:20px;flex:none}
.si .caret{width:11px;height:11px;margin-left:auto;transition:transform .15s}
.si[aria-expanded="true"] .caret{transform:rotate(180deg)}
.si:hover{background:var(--forest-2);opacity:1}
.si[aria-current="page"]{background:var(--gold);color:var(--gold-ink);opacity:1}
.si[data-sel]{opacity:1}
.si.off{opacity:.5}
.si .tag{margin-left:auto;font-size:.62rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;border:1px solid currentColor;border-radius:99px;padding:1px 7px;opacity:.8}
.sub{display:flex;flex-direction:column;gap:1px;margin:2px 0 6px 31px;padding-left:10px;border-left:1px solid rgba(243,241,233,.16)}
.sub .si{padding:8px 10px;font-weight:500;font-size:.88rem}
.side-pe{height:150px;flex:none;position:relative;opacity:.9;mask-image:linear-gradient(to bottom,transparent,#000 45%)}
.side-ilu{position:absolute;inset:0;width:100%;height:100%}
.cab{position:relative;margin-left:var(--lat);min-height:92px;background:var(--forest);color:#fff;overflow:hidden}
.cab-fundo{position:absolute;inset:0}
.cab-img{width:100%;height:100%;object-fit:cover;display:block}
.cab::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(16,36,28,.92) 0%,rgba(16,36,28,.6) 42%,rgba(16,36,28,.15) 75%,rgba(16,36,28,.45) 100%);pointer-events:none}
.cab-in{position:relative;z-index:1;display:flex;align-items:center;gap:16px;min-height:92px;padding-inline:clamp(16px,3vw,36px);max-width:1440px}
.cab-id{display:flex;align-items:center;gap:14px;min-width:0;flex:1}
.cab-nome b{display:block;font:800 clamp(1.15rem,1rem + .8vw,1.6rem)/1.1 var(--f-display);letter-spacing:-.015em;text-shadow:0 1px 8px rgba(0,0,0,.35);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cab-nome small{display:block;font-size:.85rem;opacity:.9;margin-top:3px}
.tb-acts{display:flex;align-items:center;gap:8px;flex:none}
.tb-ic{position:relative;border:0;background:rgba(0,0,0,.18);color:#fff;width:40px;height:40px;border-radius:10px;display:grid;place-items:center;cursor:pointer}
.tb-ic:hover{background:rgba(0,0,0,.32)}
.tb-ic svg{width:21px;height:21px}
.tb-ic .badge{position:absolute;top:2px;right:0;margin:0}
.badge{background:var(--late);color:#fff;font-size:.68rem;font-weight:700;padding:1px 6px;border-radius:99px;font-variant-numeric:tabular-nums}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--gold);color:var(--gold-ink);display:grid;place-items:center;font-weight:800;font-size:.8rem;flex:none}
.userbtn{display:flex;align-items:center;gap:9px;border:0;background:rgba(0,0,0,.18);color:#fff;padding:4px 10px 4px 4px;border-radius:99px;cursor:pointer;text-align:left}
.userbtn:hover,.userbtn[aria-expanded="true"]{background:rgba(0,0,0,.32)}
.userbtn .caret{width:10px;height:10px}
.userbtn span.n{font-size:.86rem;font-weight:600;line-height:1.15}
.userbtn span.n small{display:block;font-weight:500;opacity:.85;font-size:.74rem}
.drop-m{position:absolute;right:0;top:calc(100% + 6px);min-width:240px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 32px rgba(0,0,0,.18);padding:6px;display:flex;flex-direction:column;gap:2px;z-index:60}
.di{display:flex;align-items:center;gap:10px;border:0;background:none;color:var(--ink);padding:9px 10px;border-radius:8px;cursor:pointer;font-size:.9rem;text-align:left;text-decoration:none;width:100%}
.di:hover{background:var(--surface-2)}
.dsep{height:1px;background:var(--line-2);margin:4px 2px}
.hamb{display:none}
.side-veu{position:fixed;inset:0;background:rgba(10,20,15,.45);z-index:44}
.pagehead{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.pagehead h1{color:var(--forest)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .pagehead h1{color:var(--ink)}}
.pagehead .acts{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
main.wrapm{padding-inline:clamp(16px,3vw,36px);padding-block:26px 72px;max-width:1440px;min-width:0;margin-left:var(--lat)}
.off-note{display:flex;gap:10px;align-items:flex-start}
@media (max-width:1000px){
  .side{transform:translateX(-100%);transition:transform .2s ease;box-shadow:0 0 40px rgba(0,0,0,.35)}

<script>
/* Haras360 · cliente da API */
const API = (function () {
  async function req(metodo, url, corpo, bruto) {
    let r;
    const headers = { 'X-Haras360': '1', 'X-Portal': window.H360_PORTAL || '' };
    if (!bruto) headers['Content-Type'] = 'application/json';
    try {
      r = await fetch(url, { method: metodo, credentials: 'same-origin', headers, body: corpo === undefined ? undefined : (bruto ? corpo : JSON.stringify(corpo)) });
    } catch (e) { throw new Error('Sem conexão com o servidor. Verifique a internet e tente de novo.'); }
    let dados = null;
    try { dados = await r.json(); } catch (e) { }
    if (r.status === 401 && !/\/api\/(login|me\/senha|me\/codigos)/.test(url)) {
      location.href = '/entrar?volta=' + encodeURIComponent(location.pathname);
      throw new Error('Sessão expirada. Faça login novamente.');
    }
    if (!r.ok) {
      const d = dados && dados.detail;
      throw new Error(typeof d === 'string' ? d : r.status === 413 ? 'Arquivo grande demais.' : 'Não foi possível concluir (erro ' + r.status + '). Confira os dados e tente de novo.');
    }
    return dados;
  }
  return {
    get: u => req('GET', u), post: (u, b) => req('POST', u, b || {}), put: (u, b) => req('PUT', u, b), patch: (u, b) => req('PATCH', u, b), del: u => req('DELETE', u),
    upload: (u, formData) => req('POST', u, formData, true)
  };
})();

</script>
<script>
/* Haras360 · núcleo do navegador: utilidades, catálogos, leitura de PDF ABCCMM e assistente. O motor de regras roda na API. */
const H = (function () {
  const DAY = 86400000;
  const pad = n => String(n).padStart(2, '0');

  /* ---------- datas ---------- */
  function hoje() { const d = new Date(); d.setHours(0, 0, 0, 0); return d; }
  function dt(s) {
    if (s instanceof Date) { const x = new Date(s); x.setHours(0, 0, 0, 0); return x; }
    const [y, m, d] = String(s).slice(0, 10).split('-').map(Number);
    return new Date(y, m - 1, d);
  }
  function iso(d) { d = dt(d); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function addDias(d, n) { const x = dt(d); x.setDate(x.getDate() + n); return x; }
  function addMeses(d, n) {
    const x = dt(d); const day = x.getDate(); x.setDate(1); x.setMonth(x.getMonth() + n);
    const last = new Date(x.getFullYear(), x.getMonth() + 1, 0).getDate(); x.setDate(Math.min(day, last)); return x;
  }
  function dias(a, b) { return Math.round((dt(b) - dt(a)) / DAY); }
  function br(s) { if (!s) return '-'; const d = dt(s); return pad(d.getDate()) + '/' + pad(d.getMonth() + 1) + '/' + d.getFullYear(); }
  function brCurta(s) { const d = dt(s); const m = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez']; return pad(d.getDate()) + ' ' + m[d.getMonth()]; }
  function brParaIso(s) { const [d, m, y] = s.split('/'); return y + '-' + m + '-' + d; }
  function idadeMeses(nasc) {
    const n = dt(nasc), t = hoje();
    let m = (t.getFullYear() - n.getFullYear()) * 12 + (t.getMonth() - n.getMonth());
    if (t.getDate() < n.getDate()) m--; return Math.max(0, m);
  }
  function idadeTxt(nasc) {
    if (!nasc) return '-';
    const m = idadeMeses(nasc);
    if (m < 24) return m + (m === 1 ? ' mês' : ' meses');
    const a = Math.floor(m / 12), r = m % 12;
    return a + ' anos' + (r ? ' e ' + r + (r === 1 ? ' mês' : ' meses') : '');
  }
  function relativo(due) {
    const d = dias(hoje(), due);
    if (d === 0) return 'hoje';
    if (d === 1) return 'amanhã';
    if (d === -1) return 'ontem';
    if (d < 0) return 'há ' + (-d) + ' dias';
    return 'em ' + d + ' dias';
  }
  function uid() { return Math.random().toString(36).slice(2, 10); }
  function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
  function norm(s) { return String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase(); }
  function moeda(v) { return v.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' }); }
  function mascaraCPF(c) { const d = String(c || '').replace(/\D/g, ''); if (d.length !== 11) return c || '-'; return d.slice(0, 3) + '.***.***-' + d.slice(9); }

  /* ---------- catálogos ---------- */
  const CATS = {
    vacina: { nome: 'Vacinação', tom: 'info' },
    vermifugacao: { nome: 'Vermifugação', tom: 'ok' },
    odontologia: { nome: 'Odontologia', tom: 'accent' },
    ferrageamento: { nome: 'Ferrageamento', tom: 'muted' },
    exame: { nome: 'Exame clínico', tom: 'info' },
    reprodutivo: { nome: 'Reprodução', tom: 'accent' },
    ocorrencia: { nome: 'Ocorrência', tom: 'soon' },
    documental: { nome: 'Documentação', tom: 'late' }
  };
  const EVENTOS_REPRO = ['Cio', 'Cobertura', 'Inseminação', 'Diagnóstico positivo', 'Diagnóstico negativo', 'Parto', 'Aborto'];
  const GESTACAO_DIAS = 340;

  const FAIXAS = [
    { de: 1, ate: 3, valor: 0, nome: 'Gratuito' },
    { de: 4, ate: 10, valor: 12.9, nome: 'Faixa 1' },
    { de: 11, ate: 20, valor: 10.9, nome: 'Faixa 2' },
    { de: 21, ate: 30, valor: 8.9, nome: 'Faixa 3' }
  ];
  let LIMITE_ANIMAIS = 30;
  function mensalidade(n) {
    let t = 0;
    for (const f of FAIXAS) { const q = Math.max(0, Math.min(n, f.ate) - f.de + 1); t += q * f.valor; }
    return Math.round(t * 100) / 100;
  }

  /* ---------- leitura do estado calculado pela API (motor de regras no servidor) ---------- */
  function protocolo(st, id) { return st.protocolos.find(p => p.id === id); }
  function animal(st, id) { return st.animais.find(a => a.id === id); }
  function gestacao(st, a) { return a && st.gestacoes ? (st.gestacoes[a.id] || null) : null; }
  function tarefas(st, opts) { opts = opts || {}; return (st.tarefas || []).filter(t => !opts.animalId || t.animalId === opts.animalId); }
  function notificacoes(st) { return st.notificacoes || []; }
  const STATUS_TXT = { atrasado: 'Atrasado', hoje: 'Hoje', semana: 'Próximos 7 dias', mes: 'Próximos 30 dias', futuro: 'Programado', pendente: 'Pendência' };
  const TIPOS_NOTIF = {
    atrasado: 'Procedimento atrasado',
    semana: 'Procedimento nos próximos 7 dias',
    parto: 'Previsão de parto',
    ocorrencia: 'Ocorrência grave do caseiro',
    documental: 'Pendência documental ABCCMM',
    campo: 'Registro feito pelo operador de campo'
  };

  function tituloRegistro(st, r) {
    if (r.tipo === 'vacina') return 'Vacina ' + (r.protocolos || []).map(id => (protocolo(st, id) || { nome: id }).nome).join(' + ');
    if (r.tipo === 'reprodutivo') return r.evento || 'Evento reprodutivo';
    if (r.tipo === 'ocorrencia') return r.titulo || 'Ocorrência';
    if (r.tipo === 'exame') return 'Exame: ' + (r.exame || 'clínico');
    if (r.tipo === 'odontologia') return r.procedimento || 'Odontologia';
    if (r.tipo === 'ferrageamento') return 'Ferrageamento';
    if (r.tipo === 'vermifugacao') return 'Vermifugação';
    return CATS[r.tipo] ? CATS[r.tipo].nome : 'Registro';
  }
  function doseTxt(d) { if (d === 'reforco') return 'Reforço'; if (d === 'unica' || !d) return ''; return d + 'ª dose'; }

  /* ---------- auditoria e glossário ---------- */
  const ACOES_AUDIT = {
    login: 'Login', login_falha: 'Login recusado', logout: 'Saída', '2fa_cadastro': '2FA cadastrado', '2fa_falha': 'Código 2FA recusado',
    '2fa_redefinido': '2FA redefinido', '2fa_codigos_novos': 'Novos códigos de recuperação', senha_troca: 'Troca de senha', senha_redefinida: 'Senha redefinida',

  const GLOSSARIO = [
    ['ABCCMM', 'Associação Brasileira dos Criadores do Cavalo Mangalarga Marchador, responsável pelo registro genealógico da raça.'],
    ['Relatório de Plantel', 'PDF emitido pelo Sistema de Gestão ABCCMM com os animais de um associado. É a fonte da importação no Haras360.'],

    ['Taxa de prenhez', 'Diagnósticos positivos divididos pelo total de diagnósticos do período.'],
    ['Baixa', 'Saída do animal do plantel por venda, morte, doação ou transferência. O prontuário continua guardado.'],
    ['Vacina multivalente', 'Vacina que protege contra várias doenças em uma aplicação. No registro, marque todas as doenças cobertas.'],
    ['2FA', 'Verificação em duas etapas: além da senha, um código de 6 dígitos do aplicativo autenticador do celular.']
  ];

  /* ---------- leitura de PDF (Relatório de Plantel ABCCMM) ---------- */
  async function linhasPDF(file) {
    if (!window.pdfjsLib) throw new Error('O leitor de PDF não carregou. Verifique a conexão e recarregue a página.');
    try { pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'; } catch (e) { }
    const data = new Uint8Array(await file.arrayBuffer());
    const pdf = await pdfjsLib.getDocument({ data, isEvalSupported: false }).promise;
    const linhas = [];
    for (let i = 1; i <= pdf.numPages; i++) {
      const pg = await pdf.getPage(i);
      const tc = await pg.getTextContent();
      const its = tc.items.filter(it => it.str && it.str.trim()).map(it => ({ s: it.str, x: it.transform[4], y: it.transform[5], w: it.width || 0, h: Math.abs(it.transform[3]) || 8 }));
      its.sort((p, q) => q.y - p.y || p.x - q.x);
      const rows = [];
      for (const it of its) {
        const row = rows.find(r => Math.abs(r.y - it.y) <= Math.max(2, it.h * 0.4));
        if (row) row.items.push(it); else rows.push({ y: it.y, items: [it] });
      }
      rows.sort((p, q) => q.y - p.y);
      for (const row of rows) {
        row.items.sort((p, q) => p.x - q.x);
        let s = '', fim = null;
        for (const it of row.items) { if (fim !== null && it.x - fim > 0.8) s += ' '; s += it.s; fim = it.x + it.w; }
        s = s.replace(/\s+/g, ' ').trim();
        if (s) linhas.push(s);
      }
    }
    return linhas;
  }

  const RE_ANIMAL = /^(.+?)\s+(?:(MM\s?\d+\s*-\s*.+?)\s+)?(?:(\d{4,8})\s+)?([MF])\s+(\S+)\s+(Viv[oa]|Mort[oa])\s+(.+?)\s+(\d{2}\/\d{2}\/\d{4})(?:\s+(\d{6,20}))?$/i;
  function lerPlantel(linhas) {
    const texto = linhas.join('\n');
    const plano = linhas.join(' ');
    const res = { valido: /RELAT[ÓO]RIO DE PLANTEL/i.test(texto) || /ABCCMM|Mangalarga/i.test(texto), associado: '', cpf: '', impresso: '', totalInformado: null, machos: null, femeas: null, animais: [], ignoradas: [] };
    let m = plano.match(/Associado\(a\):\s*(.+?)\s*-\s*CPF:\s*([\d.\-]+)/i);
    if (m) { res.associado = m[1].trim(); res.cpf = m[2].replace(/\D/g, ''); }
    m = plano.match(/Impresso em\s*(\d{2}\/\d{2}\/\d{4})/i); if (m) res.impresso = brParaIso(m[1]);
    m = plano.match(/Total de animais:\s*(\d+)/i); if (m) res.totalInformado = Number(m[1]);
    for (const l of linhas) {
      if (!/\d{2}\/\d{2}\/\d{4}/.test(l) || /Impresso em|Associado\(a\)/i.test(l)) continue;
      const x = l.match(RE_ANIMAL);
      if (!x) { res.ignoradas.push(l); continue; }
      res.animais.push({
        nome: x[1].trim().toUpperCase(),
        livro: (x[2] || '').trim(),
        registro: x[3] || '',
        sexo: x[4].toUpperCase(),
        bloqueado: !/^(-|n[aã]o|n)$/i.test(x[5]),
        vivo: /viv/i.test(x[6]),
        dna: x[7].trim(),
        nascimento: brParaIso(x[8]),
        chip: x[9] || ''
      });
    }
    res.machos = res.animais.filter(a => a.sexo === 'M').length;
    res.femeas = res.animais.filter(a => a.sexo === 'F').length;
    return res;
  }

  function compararImportacao(st, lidos) {
    return lidos.map(n => {
      const ex = st.animais.find(a => (n.registro && a.registro === n.registro) || (n.chip && a.chip === n.chip) || norm(a.nome) === norm(n.nome));
      if (!ex) return { novo: n, situacao: 'novo', diffs: [] };
      const campos = ['nome', 'livro', 'registro', 'sexo', 'bloqueado', 'vivo', 'dna', 'nascimento', 'chip'];
      const diffs = campos.filter(c => String(ex[c] ?? '') !== String(n[c] ?? ''));
      return { novo: n, existente: ex, situacao: diffs.length ? 'atualizar' : 'igual', diffs };
    });
  }

  /* certificado ou outro PDF com genealogia: busca rótulos usuais */
  function lerGenealogia(linhas) {
    const g = {};
    const regras = [
      ['avoPaterno', /av[ôo]\s*paterno\s*[:\-]?\s*(.+)/i],
      ['avoPaterna', /av[óo]\s*paterna\s*[:\-]?\s*(.+)/i],
      ['avoMaterno', /av[ôo]\s*materno\s*[:\-]?\s*(.+)/i],
      ['avoMaterna', /av[óo]\s*materna\s*[:\-]?\s*(.+)/i],
      ['pai', /^(?:.*\s)?pai\s*[:\-]\s*(.+)/i],
      ['mae', /^(?:.*\s)?m[ãa]e\s*[:\-]\s*(.+)/i]
    ];
    for (const l of linhas) {
      for (const [k, re] of regras) {
        if (g[k]) continue;
        const m = l.match(re);
        if (m) { const v = m[1].replace(/\s+(registro|reg\.?|n[ºo])\s*.*$/i, '').trim(); if (v && v.length < 80) { g[k] = v.toUpperCase(); break; } }
      }
    }
    return g;
  }

  /* ---------- assistente (base de demonstração) ---------- */
  function responder(st, pergunta) {
    const q = norm(pergunta);
    const has = (...k) => k.some(w => q.includes(w));
    const alvo = st.animais.find(a => q.includes(norm(a.nome).split(' ')[0]));
    const ts = tarefas(st);
    const vac = id => protocolo(st, id);
    const lista = arr => arr.map(t => '• ' + t.animal + ': ' + t.titulo + ' (' + t.etapa + ', ' + br(t.due) + ')').join('\n');

    if (alvo && has('parto', 'gestac', 'prenhe', 'parir')) {
      const g = gestacao(st, alvo);
      if (!g) return { t: alvo.nome + ' não tem gestação ativa registrada no prontuário.' };
      return { t: alvo.nome + ' está com ' + g.dias + ' dias de gestação (' + g.mes + 'º mês). A cobertura foi em ' + br(g.cobertura) + (g.garanhao ? ' com ' + g.garanhao : '') + ', e o parto está previsto para ' + br(g.parto) + ', ' + relativo(g.parto) + '. A estimativa usa ' + GESTACAO_DIAS + ' dias; o veterinário deve confirmar por ultrassonografia.', f: 'Dados do prontuário' };
    }
    if (alvo && has('vacina', 'pendente', 'atras', 'proxim', 'agenda')) {
      const t = ts.filter(x => x.animalId === alvo.id && x.status !== 'futuro');
      if (!t.length) return { t: alvo.nome + ' não tem procedimentos atrasados nem previstos para os próximos 30 dias.', f: 'Motor de regras' };
      return { t: 'Pendências e próximos 30 dias de ' + alvo.nome + ':\n' + lista(t), f: 'Motor de regras' };
    }
    if (has('atrasad', 'pendenc', 'vencid')) {
      const t = ts.filter(x => x.status === 'atrasado');
      if (!t.length) return { t: 'Nenhum procedimento atrasado no plantel.', f: 'Motor de regras' };
      return { t: 'Há ' + t.length + ' procedimento(s) atrasado(s):\n' + lista(t), f: 'Motor de regras' };
    }
    if (has('raiva')) {
      const r = vac('raiva');
      return { t: 'Raiva é obrigatória. 1ª dose aos 4 meses, 2ª dose 30 dias depois e reforço anual. Em estados endêmicos o reforço passa a ser semestral. Neste haras o reforço está configurado como ' + (st.haras.raivaSemestral ? 'semestral' : 'anual') + '. Via ' + (r ? r.via : 'SC ou IM') + ', conforme a bula.', f: 'Protocolo VetJr. UFMG' };
    }
    if (has('gestante', 'prenha', 'gestacao', 'rinopneu', 'herpes')) return { t: 'Para rinopneumonite: 1ª dose na desmama, 2ª dose 3 a 4 semanas depois e 3ª dose 6 meses após a segunda. Éguas gestantes recebem doses no 5º, 7º e 9º mês de gestação. O Haras360 agenda essas doses automaticamente quando um diagnóstico positivo é registrado.', f: 'Protocolo VetJr. UFMG' };
    if (has('reinici', 'perdeu', 'perdi', 'esqueci', 'nunca vacin')) return { t: 'Animais que nunca foram vacinados ou que perderam o prazo do reforço devem refazer a primovacinação daquela vacina, ou seja, reiniciar o esquema desde a 1ª dose. O sistema sinaliza "Reiniciar primovacinação" quando o reforço passa de 15 dias do vencimento.', f: 'Protocolo VetJr. UFMG' };
    if (has('potro', 'potra', 'filhote', '12 meses')) return { t: 'Potros iniciam a vacinação entre 3 e 4 meses (tétano, encefalomielite e influenza a partir de 3; raiva e leptospirose a partir de 4; rinopneumonite na desmama). Concluído o esquema inicial, o primeiro reforço é feito a partir dos 12 meses de idade, e o sistema já programa nessa data.', f: 'Protocolo VetJr. UFMG' };
    if (has('multival', 'trivalen', 'bivalen', 'combinad')) return { t: 'Vacinas multivalentes protegem contra mais de uma doença na mesma aplicação, geralmente com custo menor. No Haras360 basta marcar todas as doenças cobertas em um único registro, e cada protocolo é atualizado.', f: 'Protocolo VetJr. UFMG' };
    if (has('transport', 'gta', 'viagem', 'evento', 'exposic', 'leilao')) return { t: 'Para transporte, a vacina de encefalomielite é obrigatória, e o trânsito de equídeos costuma exigir exames negativos de Anemia Infecciosa (AIE) e Mormo dentro da validade. O sistema usa 60 dias como validade padrão, editável em Protocolos. Confirme a exigência do órgão de defesa agropecuária do seu estado e do evento.', f: 'Protocolo VetJr. UFMG e padrão de mercado' };
    if (has('obrigator')) return { t: 'Pelo protocolo de referência: raiva é obrigatória; encefalomielite é obrigatória para transporte e em alguns estabelecimentos; rinopneumonite é exigida por alguns estabelecimentos. Tétano, influenza e leptospirose são fortemente recomendadas, e garrotilho depende do risco do plantel.', f: 'Protocolo VetJr. UFMG' };
    if (has('dna')) return { t: 'O Relatório de Plantel informa a situação do exame de DNA de cada animal. Quando aparece "Sem exame", o Haras360 abre uma pendência documental, porque o exame é necessário para o registro genealógico.', f: 'Relatório de Plantel ABCCMM' };
    if (has('livro', 'mm5', 'mm6', 'definitivo', 'registro')) return { t: 'O campo "Livro" do relatório indica a categoria em que o animal está inscrito no registro genealógico, por exemplo "MM6 - Definitivo Fechado Fêmea". Animais sem livro e sem número de registro geram a pendência "Registro ABCCMM pendente". Na versão final, o assistente explicará cada categoria citando o artigo do Regulamento do Registro Genealógico.', f: 'Relatório de Plantel ABCCMM' };
    if (has('plano', 'preco', 'mensal', 'cobran', 'pagar', 'gratis', 'gratuito')) { const n = st.animais.filter(a => a.vivo).length; return { t: 'O plano é gratuito até 3 animais. A partir do 4º, cobra-se por animal em faixas decrescentes. Com ' + n + ' animais ativos, a mensalidade simulada é ' + moeda(mensalidade(n)) + '. Os valores atuais são ilustrativos.', f: 'Plano Haras360' }; }
    if (has('vermif', 'verme')) return { t: 'O padrão configurado é vermifugação a cada 90 dias a partir dos 2 meses de idade. Esse intervalo é um padrão de mercado e deve ser ajustado pelo veterinário, de preferência com base em exame de OPG (contagem de ovos nas fezes).', f: 'Padrão de mercado' };
    if (has('dente', 'odonto', 'aparelho')) return { t: 'A avaliação odontológica está programada a cada 12 meses a partir dos 2 anos. Quando um aparelho dentário é registrado, o sistema agenda o retorno em 24 meses.', f: 'Padrão de mercado' };
    if (has('ferra', 'casco')) return { t: 'O ferrageamento é agendado a cada 45 dias a partir do primeiro registro de ferrageamento do animal. Ajuste o intervalo em Protocolos conforme o ferrador.', f: 'Padrão de mercado' };
    return { t: 'Ainda não tenho essa resposta na base atual. Na próxima versão, o assistente será treinado com o Estatuto e o Regulamento do Registro Genealógico da ABCCMM e responderá citando o artigo correspondente. Experimente perguntar sobre vacinas, gestação, transporte, DNA ou plano.', f: 'Demonstração' };
  }

  return {
    hoje, dt, iso, addDias, addMeses, dias, br, brCurta, brParaIso, idadeMeses, idadeTxt, relativo, uid, esc, norm, moeda, mascaraCPF,
    CATS, EVENTOS_REPRO, GESTACAO_DIAS, FAIXAS, LIMITE_ANIMAIS, STATUS_TXT, TIPOS_NOTIF,
    mensalidade,
    protocolo, animal, gestacao, tarefas, notificacoes, tituloRegistro, doseTxt,
    ACOES_AUDIT, GLOSSARIO,
    linhasPDF, lerPlantel, compararImportacao, lerGenealogia, responder
  };
})();

    m.innerHTML = '<div class="sheet' + (largo ? ' wide' : '') + '" role="dialog" aria-modal="true" aria-labelledby="mt"><header><h2 id="mt">' + titulo + '</h2><button class="x" data-act="fechar" aria-label="Fechar">×</button></header><div class="sbody">' + corpo + '</div>' + (rodape ? '<footer>' + rodape + '</footer>' : '') + '</div>';

    document.body.style.overflow = 'hidden';
    const f = m.querySelector('input:not([type=hidden]):not([type=checkbox]),select,textarea');
    if (f) setTimeout(() => f.focus(), 30);
    return m;
  }
  function fechar() { const m = $('#modal'); m.hidden = true; m.innerHTML = ''; document.body.style.overflow = ''; if (onClose) { const f = onClose; onClose = null; f(); } }
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#modal').hidden) fechar(); });
  document.addEventListener('click', e => { if (e.target.id === 'modal') fechar(); });

  /* ---------- tons ---------- */
  const TOM = { atrasado: 'c-late', hoje: 'c-soon', semana: 'c-soon', mes: 'c-ok', futuro: 'c-muted', pendente: 'c-info' };
  const TOMCAT = t => 'c-' + ((H.CATS[t] || {}).tom || 'muted');
  function chipStatus(s) { return '<span class="chip ' + TOM[s] + '">' + H.STATUS_TXT[s] + '</span>'; }
  function chipCat(c) { return '<span class="chip nodot ' + TOMCAT(c) + '">' + esc((H.CATS[c] || { nome: c }).nome) + '</span>'; }

  /* ---------- linha de tarefa ---------- */
  function linhaTarefa(t, o) {
    o = o || {};
    const quando = t.doc ? '<b>Pend.</b>doc.' : '<b>' + brCurta(t.due) + '</b>' + relativo(t.due);
    const animal = o.semAnimal ? '' : '<a href="#" data-act="ver-animal" data-id="' + t.animalId + '">' + esc(t.animal) + '</a> · ';
    const acao = t.doc ? '' : t.parto ? '<button class="btn sm" data-act="registrar-tarefa" data-id="' + esc(t.id) + '">Registrar parto</button>' : t.cio ? '<button class="btn sm" data-act="registrar-tarefa" data-id="' + esc(t.id) + '">Registrar cio</button>' : '<button class="btn sm" data-act="registrar-tarefa" data-id="' + esc(t.id) + '">' + ICON.check + 'Registrar</button>';
    return '<div class="task ' + t.status + '"><span class="bar"></span><div class="when">' + quando + '</div><div class="what"><div class="row" style="gap:8px"><strong>' + esc(t.titulo) + '</strong><span class="chip nodot c-muted">' + esc(t.etapa) + '</span>' + (t.status === 'atrasado' ? '<span class="chip c-late">Atrasado</span>' : '') + '</div><div class="sub">' + animal + esc(t.nota || '') + '</div></div><div class="act">' + acao + '</div></div>';
  }

  /* ---------- prontuário ---------- */
  function linhaTempo(st, regs, o) {
    o = o || {};
    if (!regs.length) return '<div class="empty">Nenhum registro nesta categoria.</div>';
    return '<div class="timeline">' + regs.map(r => {
      const meta = [];
      const dose = H.doseTxt(r.dose); if (r.tipo === 'vacina' && dose) meta.push(dose);
      if (r.produto) meta.push('Produto: ' + esc(r.produto));
      if (r.lote) meta.push('Lote <span class="mono">' + esc(r.lote) + '</span>');
      if (r.ferrador) meta.push('Ferrador: ' + esc(r.ferrador));
      if (r.resultado) meta.push('Resultado: ' + esc(r.resultado));
      if (r.garanhao) meta.push('Garanhão: ' + esc(r.garanhao));
      if (r.dataCobertura && r.evento === 'Diagnóstico positivo') meta.push('Cobertura em ' + br(r.dataCobertura));
      if (r.gravidade) meta.push('Gravidade: ' + esc(r.gravidade));
      if (r.sinais) meta.push('Sinais: ' + esc(r.sinais));
      if (r.ovario) meta.push('Ovário ' + esc(r.ovario.toLowerCase()));
      if (r.foliculo) meta.push('Folículo ' + esc(r.foliculo) + ' mm');
      if (r.edema) meta.push('Edema ' + esc(r.edema));
      const fotos = (r.fotos || []).length ? '<div class="thumbs">' + r.fotos.map((f, i) => '<button data-act="ver-foto" data-r="' + r.id + '" data-i="' + i + '" aria-label="Ampliar foto ' + (i + 1) + '"><img src="' + f + '" alt=""></button>').join('') + '</div>' : '';
      const dur = r.audio ? Math.floor(r.audio.duracao / 60) + ':' + String(r.audio.duracao % 60).padStart(2, '0') : '';
      const audio = r.audio ? '<div class="audio-reg"><span class="small muted">' + ICON.mic + 'Áudio do campo · ' + dur + '</span><audio controls preload="none" src="' + esc(r.audio.url) + '"></audio></div>' : '';
      const nome = o.comAnimal ? (() => { const a = H.animal(st, r.animalId); return a ? '<a href="#" data-act="ver-animal" data-id="' + a.id + '">' + esc(a.nome) + '</a> · ' : ''; })() : '';
      const del = o.excluir ? '<button class="btn ghost sm danger" data-act="excluir-reg" data-id="' + r.id + '">Excluir</button>' : '';
      return '<div class="ev"><div class="d">' + br(r.data) + '</div><div class="body"><div class="spread"><div class="row" style="gap:8px">' + chipCat(r.tipo) + '<strong>' + esc(H.tituloRegistro(st, r)) + '</strong></div>' + del + '</div>' + (meta.length ? '<div class="meta">' + meta.map(m => '<span>' + m + '</span>').join('') + '</div>' : '') + (r.obs ? '<p class="obs">' + esc(r.obs) + '</p>' : '') + fotos + audio + '<div class="meta">' + nome + '<span>' + esc(r.autor) + ' · ' + esc(r.origem) + '</span></div></div></div>';
    }).join('') + '</div>';
  }

  function verFoto(st, rid, i) {
    const r = st.registros.find(x => x.id === rid); if (!r) return;
    abrir({ titulo: esc(H.tituloRegistro(st, r)), corpo: '<img src="' + r.fotos[i] + '" alt="Foto do registro" style="border-radius:8px;width:100%"><p class="muted small">' + br(r.data) + ' · ' + esc(r.autor) + '</p>', largo: true });
  }

  /* ---------- fotos ---------- */
  function comprimir(file, max, q) {
    max = max || 1600; q = q || 0.8;
    return new Promise((res, rej) => {
      const fr = new FileReader();
      fr.onload = () => {
        const img = new Image();
        img.onload = () => {
          const k = Math.min(1, max / Math.max(img.width, img.height));
          const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
          c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
          res(c.toDataURL('image/jpeg', q));
        };
        img.onerror = () => rej(new Error('Arquivo de imagem inválido'));
        img.src = fr.result;
      };
      fr.onerror = () => rej(new Error('Não foi possível ler o arquivo'));
      fr.readAsDataURL(file);
    });
  }

  /* ---------- logotipo do haras: reduz para 512 px mantendo a transparência ---------- */
  function prepararLogo(file) {
    return new Promise((res, rej) => {
      if (!/^image\/(png|jpeg|webp)$/.test(file.type)) { rej(new Error('Use uma imagem PNG, JPG ou WebP.')); return; }
      const fr = new FileReader();
      fr.onload = () => {
        const img = new Image();
        img.onload = () => {
          // recorta as margens vazias (brancas ou transparentes) para o logotipo ocupar bem o espaço
          const o = document.createElement('canvas'); o.width = img.width; o.height = img.height;
          const ox = o.getContext('2d'); ox.drawImage(img, 0, 0);
          const px = ox.getImageData(0, 0, o.width, o.height).data;
          let x0 = o.width, y0 = o.height, x1 = -1, y1 = -1;
          for (let y = 0; y < o.height; y += 2) for (let x = 0; x < o.width; x += 2) {
            const i = (y * o.width + x) * 4;
            if (px[i + 3] > 24 && (px[i] < 235 || px[i + 1] < 235 || px[i + 2] < 235)) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
          }
          let sx = 0, sy = 0, sw = o.width, sh = o.height;
          if (x1 > x0 && y1 > y0) { const m = Math.round(Math.max(x1 - x0, y1 - y0) * 0.04); sx = Math.max(0, x0 - m); sy = Math.max(0, y0 - m); sw = Math.min(o.width, x1 + m + 2) - sx; sh = Math.min(o.height, y1 + m + 2) - sy; }
          const k = Math.min(1, 512 / Math.max(sw, sh));
          const c = document.createElement('canvas'); c.width = Math.round(sw * k); c.height = Math.round(sh * k);
          c.getContext('2d').drawImage(o, sx, sy, sw, sh, 0, 0, c.width, c.height);
          let url = c.toDataURL('image/png');
          if (url.length > 1300000) url = c.toDataURL('image/webp', 0.9);
          if (url.length > 1300000) { rej(new Error('O logotipo ficou grande demais. Use uma imagem mais simples.')); return; }
          res(url);
        };
        img.onerror = () => rej(new Error('Não foi possível abrir a imagem.'));
        img.src = fr.result;
      };
      fr.onerror = () => rej(new Error('Não foi possível ler o arquivo.'));
      fr.readAsDataURL(file);
    });
  }

  /* ---------- formulário de registro ---------- */
  let fotosPend = [];
  const OPC = (arr, sel) => arr.map(v => { const [val, lab] = Array.isArray(v) ? v : [v, v]; return '<option value="' + esc(val) + '"' + (String(val) === String(sel) ? ' selected' : '') + '>' + esc(lab) + '</option>'; }).join('');

  function extras(st, tipo, p) {
    p = p || {};
    if (tipo === 'vacina') {
      const vs = st.protocolos.filter(x => x.cat === 'vacina');
      return '<div class="field full"><span class="lbl">Doenças cobertas (marque todas em vacinas multivalentes)</span><div class="checks">' + vs.map(v => '<label class="check"><input type="checkbox" name="prot" value="' + v.id + '"' + ((p.protocolos || []).includes(v.id) ? ' checked' : '') + '>' + esc(v.nome) + '</label>').join('') + '</div></div>' +
        '<div class="field"><label for="f-dose">Dose</label><select id="f-dose" class="inp">' + OPC([[1, '1ª dose'], [2, '2ª dose'], [3, '3ª dose'], ['reforco', 'Reforço']], p.dose || 'reforco') + '</select></div>' +
        '<div class="field"><label for="f-lote">Lote</label><input id="f-lote" class="inp" value="' + esc(p.lote || '') + '" placeholder="Ex.: RB2291"></div>' +
        '<div class="field full"><label for="f-produto">Produto / marca</label><input id="f-produto" class="inp" value="' + esc(p.produto || '') + '" placeholder="Ex.: Trivalente tétano + encefalomielite + influenza"></div>';
    }
    if (tipo === 'vermifugacao') return '<div class="field full"><label for="f-produto">Vermífugo (princípio ativo)</label><input id="f-produto" class="inp" value="' + esc(p.produto || '') + '" placeholder="Ex.: Ivermectina + praziquantel"></div>';
    if (tipo === 'odontologia') return '<div class="field full"><label for="f-proc">Procedimento</label><select id="f-proc" class="inp">' + OPC(['Avaliação', 'Avaliação e correção', 'Aparelho dentário instalado', 'Retorno de aparelho', 'Extração', 'Outro'], p.procedimento || ((p.protocolos || []).includes('aparelho') ? 'Retorno de aparelho' : 'Avaliação')) + '</select></div>';
    if (tipo === 'ferrageamento') return '<div class="field full"><label for="f-ferrador">Ferrador</label><input id="f-ferrador" class="inp" value="' + esc(p.ferrador || '') + '"></div>';
    if (tipo === 'exame') {
      const sel = (p.protocolos || []).includes('aie') ? 'Anemia Infecciosa (AIE)' : (p.protocolos || []).includes('mormo') ? 'Mormo' : (p.exame || 'Anemia Infecciosa (AIE)');
      return '<div class="field"><label for="f-exame">Exame</label><select id="f-exame" class="inp">' + OPC(['Anemia Infecciosa (AIE)', 'Mormo', 'Hemograma', 'Ultrassonografia', 'Raio-X', 'Outro'], sel) + '</select></div><div class="field"><label for="f-res">Resultado</label><input id="f-res" class="inp" value="' + esc(p.resultado || '') + '" placeholder="Ex.: Negativo"></div>';
    }
    if (tipo === 'reprodutivo') {
      const machos = st.animais.filter(a => a.sexo === 'M').map(a => '<option value="' + esc(a.nome) + '">');
      const ev = p.evento || 'Cobertura', cio = ev === 'Cio';
      // v1.4.0: o evento Cio mostra sinais e dados do exame; os demais, garanhão e cobertura
      return '<div class="field"><label for="f-evento">Evento</label><select id="f-evento" class="inp">' + OPC(H.EVENTOS_REPRO, ev) + '</select></div>' +
        '<div class="field" data-ev="outro"' + (cio ? ' hidden' : '') + '><label for="f-garanhao">Garanhão</label><input id="f-garanhao" class="inp" list="dl-machos" value="' + esc(p.garanhao || '') + '"><datalist id="dl-machos">' + machos.join('') + '</datalist></div>' +
        '<div class="field" data-ev="outro"' + (cio ? ' hidden' : '') + '><label for="f-cob">Data da cobertura (diagnóstico positivo)</label><input id="f-cob" type="date" class="inp" value="' + esc(p.dataCobertura || '') + '"></div>' +
        '<div class="field" data-ev="cio"' + (cio ? '' : ' hidden') + '><label for="f-sinais">Sinais observados</label><input id="f-sinais" class="inp" value="' + esc(p.sinais || '') + '" placeholder="Ex.: aceita o rufião, urina com frequência"></div>' +
        '<div class="field" data-ev="cio"' + (cio ? '' : ' hidden') + '><label for="f-ovario">Ovário (exame)</label><select id="f-ovario" class="inp">' + OPC([['', 'Não examinado'], 'Esquerdo', 'Direito'], p.ovario || '') + '</select></div>' +
        '<div class="field" data-ev="cio"' + (cio ? '' : ' hidden') + '><label for="f-foliculo">Folículo (mm)</label><input id="f-foliculo" type="number" min="5" max="80" class="inp" value="' + esc(p.foliculo || '') + '" placeholder="Ex.: 35"></div>' +
        '<div class="field" data-ev="cio"' + (cio ? '' : ' hidden') + '><label for="f-edema">Edema uterino</label><select id="f-edema" class="inp">' + OPC([['', 'Não avaliado'], ['0', '0 (ausente)'], ['1', '1 (leve)'], ['2', '2 (moderado)'], ['3', '3 (intenso)']], p.edema || '') + '</select></div>';
    }
    if (tipo === 'ocorrencia') return '<div class="field"><label for="f-titulo">O que aconteceu</label><input id="f-titulo" class="inp" value="' + esc(p.titulo || '') + '" placeholder="Ex.: Mancando da pata traseira"></div><div class="field"><label for="f-grav">Gravidade</label><select id="f-grav" class="inp">' + OPC(['Leve', 'Moderada', 'Grave'], p.gravidade || 'Leve') + '</select></div>';
    return '';
  }

  function formRegistro(st, pre, ctx) {
    pre = pre || {}; fotosPend = [];
    const tipos = Object.keys(H.CATS).filter(k => k !== 'documental');
    const animais = st.animais.filter(a => a.vivo && !a.baixa);
    const tipo = pre.tipo || 'vacina';
    const corpo = '<form id="fr" class="stack" novalidate><div class="fgrid">' +
      '<div class="field"><label for="f-animal">Animal</label><select id="f-animal" class="inp">' + OPC(animais.map(a => [a.id, a.nome]), pre.animalId) + '</select></div>' +
      '<div class="field"><label for="f-data">Data</label><input id="f-data" type="date" class="inp" value="' + (pre.data || H.iso(H.hoje())) + '" max="' + H.iso(H.hoje()) + '"></div>' +
      '<div class="field full"><label for="f-tipo">Tipo de registro</label><select id="f-tipo" class="inp">' + OPC(tipos.map(k => [k, H.CATS[k].nome]), tipo) + '</select></div>' +
      '</div><div id="f-extra" class="fgrid">' + extras(st, tipo, pre) + '</div>' +
      '<div class="field"><label for="f-obs">Observações</label><textarea id="f-obs" class="inp" placeholder="Descreva o que foi feito ou observado">' + esc(pre.obs || '') + '</textarea></div>' +
      '<div class="field"><span class="lbl">Fotos (até 4)</span><div class="row"><label class="btn" for="f-fotos">' + ICON.cam + 'Adicionar fotos</label><input id="f-fotos" type="file" accept="image/*" multiple hidden><span class="small muted" id="f-fstat">Nenhuma foto</span></div><div class="thumbs" id="f-thumbs"></div></div>' +
      '<p class="note" id="f-erro" hidden></p></form>';
    abrir({ titulo: pre.tituloModal || 'Novo registro no prontuário', corpo, rodape: '<button class="btn" data-act="fechar">Cancelar</button><button class="btn pri" data-act="salvar-registro">' + ICON.check + 'Salvar registro</button>' });
    $('#f-tipo').addEventListener('change', e => { $('#f-extra').innerHTML = extras(st, e.target.value, {}); });
    $('#f-extra').addEventListener('change', e => {
      if (e.target.id !== 'f-evento') return;
      const cio = e.target.value === 'Cio';
      document.querySelectorAll('#f-extra [data-ev]').forEach(el => { el.hidden = (el.dataset.ev === 'cio') !== cio; });
    });
    $('#f-fotos').addEventListener('change', async e => {
      const files = [...e.target.files].slice(0, 4 - fotosPend.length);
      for (const f of files) { try { fotosPend.push(await comprimir(f)); } catch (err) { toast(err.message); } }
      e.target.value = '';
      desenharFotos();
    });
    formRegistro.ctx = ctx;
  }
  function desenharFotos() {
    $('#f-thumbs').innerHTML = fotosPend.map((f, i) => '<button type="button" data-act="rem-foto" data-i="' + i + '" title="Remover foto" style="cursor:pointer"><img src="' + f + '" alt="Foto ' + (i + 1) + '"></button>').join('');
    $('#f-fstat').textContent = fotosPend.length ? fotosPend.length + ' de 4 · toque para remover' : 'Nenhuma foto';
  }
  function remFoto(i) { fotosPend.splice(i, 1); desenharFotos(); }

  function lerRegistro(st) {
    const v = id => { const el = document.getElementById(id); return el ? el.value.trim() : ''; };
    const tipo = v('f-tipo');
    const r = { id: H.uid(), animalId: v('f-animal'), data: v('f-data'), tipo, protocolos: [], dose: 'unica', obs: v('f-obs'), fotos: fotosPend.slice() };
    const erro = m => { const e = $('#f-erro'); e.textContent = m; e.className = 'note bad'; e.hidden = false; return null; };
    if (!r.animalId) return erro('Escolha o animal.');
    if (!r.data) return erro('Informe a data do registro.');
    if (r.data > H.iso(H.hoje())) return erro('A data não pode ser futura. Para agendar, o sistema calcula a próxima etapa automaticamente.');
    if (tipo === 'vacina') {
      r.protocolos = [...document.querySelectorAll('input[name=prot]:checked')].map(i => i.value);
      if (!r.protocolos.length) return erro('Marque ao menos uma doença coberta pela vacina.');
      const d = v('f-dose'); r.dose = d === 'reforco' ? 'reforco' : Number(d);
      r.produto = v('f-produto'); r.lote = v('f-lote');
    } else if (tipo === 'vermifugacao') { r.protocolos = ['vermi']; r.produto = v('f-produto'); }
    else if (tipo === 'odontologia') { r.procedimento = v('f-proc'); r.protocolos = /aparelho/i.test(r.procedimento) ? ['aparelho'] : ['odonto']; }
    else if (tipo === 'ferrageamento') { r.protocolos = ['ferrag']; r.ferrador = v('f-ferrador'); }
    else if (tipo === 'exame') { r.exame = v('f-exame'); r.resultado = v('f-res'); if (/AIE/.test(r.exame)) r.protocolos = ['aie']; if (/Mormo/.test(r.exame)) r.protocolos = ['mormo']; }
    else if (tipo === 'reprodutivo') {
      r.evento = v('f-evento');
      if (r.evento === 'Cio') {
        r.sinais = v('f-sinais'); r.ovario = v('f-ovario'); r.foliculo = v('f-foliculo'); r.edema = v('f-edema');
        if (r.foliculo && !(+r.foliculo >= 5 && +r.foliculo <= 80)) return erro('O folículo deve ficar entre 5 e 80 mm.');
      } else { r.garanhao = v('f-garanhao').toUpperCase(); r.dataCobertura = v('f-cob'); }
      const a = H.animal(st, r.animalId);
      if (a && a.sexo !== 'F' && r.evento !== 'Cobertura') return erro(r.evento === 'Cio' ? 'O cio só se aplica a fêmeas.' : 'Eventos de gestação só se aplicam a fêmeas.');
      if (r.evento === 'Diagnóstico positivo' && !r.dataCobertura) return erro('Informe a data da cobertura para calcular a previsão de parto.');
    } else if (tipo === 'ocorrencia') { r.titulo = v('f-titulo'); r.gravidade = v('f-grav'); if (!r.titulo) return erro('Descreva a ocorrência em poucas palavras.'); }
    return r;
  }

  /* pré-preenche o formulário a partir de uma tarefa do motor de regras */
  function preDeTarefa(t) {
    if (t.parto) return { animalId: t.animalId, tipo: 'reprodutivo', evento: 'Parto', tituloModal: 'Registrar parto' };
    if (t.cio) return { animalId: t.animalId, tipo: 'reprodutivo', evento: 'Cio', tituloModal: 'Registrar cio' };
    return { animalId: t.animalId, tipo: t.cat, protocolos: t.protocoloId ? [t.protocoloId] : [], dose: t.dose, tituloModal: 'Registrar ' + t.titulo.toLowerCase() };
  }

  /* ---------- assistente ---------- */
  const SUGS = ['Quais procedimentos estão atrasados?', 'Quando é o parto da Diva?', 'O que muda na vacina de raiva em região endêmica?', 'Quais exames preciso para transportar um cavalo?', 'Como vacinar uma égua gestante?', 'Perdi o prazo do reforço, o que fazer?'];
  function chatHTML(hist, titulo, sub) {
    return '<div class="card flush chat"><div style="padding:16px 18px;border-bottom:1px solid var(--line)"><h2>' + titulo + '</h2><p class="small muted">' + sub + '</p></div><div class="msgs" id="msgs">' +
      hist.map(m => '<div class="msg ' + m.de + '">' + esc(m.t) + (m.f ? '<span class="src">Base: ' + esc(m.f) + '</span>' : '') + '</div>').join('') +
      '</div>' + (hist.length <= 1 ? '<div class="sugs">' + SUGS.map(s => '<button type="button" data-act="sug" data-q="' + esc(s) + '">' + esc(s) + '</button>').join('') + '</div>' : '') +
      '<form id="chat-f"><input id="chat-q" class="inp" placeholder="Pergunte sobre vacinas, normas, gestação ou o plantel" autocomplete="off"><button class="btn pri" aria-label="Enviar">' + ICON.send + '</button></form></div>';
  }

  /* ---------- barra superior com menus agrupados ---------- */
  /* ---------- marca (v1.3.0): perfil de cavalo em traço contínuo com o arco dourado do "360" ---------- */

  /* Reduz e converte para WebP no navegador antes de enviar (v1.3.0). */

  async function carregarRel() {

  const CORES_G = ['#193D30', '#D5A064', '#4E8A66', '#82978A', '#8A5E26', '#6B4E8C', '#2C5B84'];
  function grafico(g) {
    const total = g.serie.reduce((s, x) => s + (+x.valor || 0), 0);
    const aria = g.titulo + ': ' + g.serie.map(x => x.rotulo + ' ' + x.valor).join(', ');
    let corpo;
    if (!total) corpo = '<p class="muted small">Sem dados no período.</p>';
    else if (g.tipo === 'rosca') {
      const R0 = 52, C = 2 * Math.PI * R0; let acc = 0;
      const arcos = g.serie.map((p, i) => { if (!p.valor) return ''; const l = C * p.valor / total; const a = '<circle cx="70" cy="70" r="' + R0 + '" fill="none" stroke="' + CORES_G[i % CORES_G.length] + '" stroke-width="18" stroke-dasharray="' + l.toFixed(2) + ' ' + (C - l).toFixed(2) + '" stroke-dashoffset="' + (-acc).toFixed(2) + '" transform="rotate(-90 70 70)"/>'; acc += l; return a; }).join('');
      corpo = '<div class="rosca-w"><svg class="rosca" viewBox="0 0 140 140" role="img" aria-label="' + esc(aria) + '"><circle cx="70" cy="70" r="' + R0 + '" fill="none" stroke="var(--line-2)" stroke-width="18"/>' + arcos + '<text x="70" y="78" text-anchor="middle" class="rosca-n">' + total + '</text></svg>' +
        '<ul class="leg">' + g.serie.map((p, i) => '<li><i style="background:' + CORES_G[i % CORES_G.length] + '"></i>' + esc(p.rotulo) + '<b>' + p.valor + ' <small>(' + Math.round(p.valor / total * 100) + '%)</small></b></li>').join('') + '</ul></div>';
    } else if (g.tipo === 'linha') {
      const n = g.serie.length, max = Math.max(...g.serie.map(x => x.valor), 1), W = 520, Hh = 160;
      const px = i => 24 + (n > 1 ? i * (W - 48) / (n - 1) : (W - 48) / 2), py = v => Hh - 26 - v / max * (Hh - 56);
      const pts = g.serie.map((x, i) => px(i).toFixed(1) + ',' + py(x.valor).toFixed(1)).join(' ');
      const passo = Math.ceil(n / 7);
      corpo = '<svg class="g-linha" viewBox="0 0 ' + W + ' ' + Hh + '" role="img" aria-label="' + esc(aria) + '"><line x1="24" y1="' + (Hh - 26) + '" x2="' + (W - 24) + '" y2="' + (Hh - 26) + '" class="g-eixo"/>' +

          (x.valor ? '<text x="' + px(i).toFixed(1) + '" y="' + (py(x.valor) - 9).toFixed(1) + '" text-anchor="middle" class="g-v">' + x.valor + '</text>' : '') +
          (i % passo === 0 || i === n - 1 ? '<text x="' + px(i).toFixed(1) + '" y="' + (Hh - 6) + '" text-anchor="middle" class="g-x">' + esc(x.rotulo) + '</text>' : '')).join('') + '</svg>';
    } else {

      corpo = '<div class="g-barras" role="img" aria-label="' + esc(aria) + '">' + g.serie.map(x => '<div class="g-b"><span>' + esc(x.rotulo) + '</span><div class="g-trilho"><i style="width:' + (x.valor / max * 100).toFixed(1) + '%"></i></div><b>' + x.valor + '</b></div>').join('') + '</div>';
    }
    return '<div class="card"><div class="card-h"><h3>' + esc(g.titulo) + '</h3></div>' + corpo + '</div>';
  }

    return '<div class="sec"><div class="spread"><div class="row"><input id="busca" class="inp" style="width:min(320px,100%)" placeholder="Buscar por nome, registro ou chip" value="' + esc(busca) + '">' +
      '<select id="sexoF" class="inp" style="width:auto"><option value="">Todos os sexos</option><option value="F"' + (sexoF === 'F' ? ' selected' : '') + '>Fêmeas</option><option value="M"' + (sexoF === 'M' ? ' selected' : '') + '>Machos</option></select>' +
      '<select id="sitF" class="inp" style="width:auto" aria-label="Situação">' + [['ativos', 'Plantel ativo'], ['baixados', 'Baixados'], ['todos', 'Todos']].map(([k, l]) => '<option value="' + k + '"' + (sitF === k ? ' selected' : '') + '>' + l + '</option>').join('') + '</select></div>' +
      '<div class="row"><button class="btn" data-act="nav" data-v="importar">' + IC.upload + 'Importar PDF ABCCMM</button><button class="btn pri" data-act="novo-animal">' + IC.plus + 'Novo animal</button></div></div>' +
      '<div class="card flush"><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Animal</th><th>Sexo</th><th>Idade</th><th>Livro</th><th>DNA</th><th>Situação</th><th>Próxima etapa</th></tr></thead><tbody id="tb-animais"></tbody></table></div></div></div>';
  }
  function linhasAnimais() {
    const q = H.norm(busca);
    const ts = H.tarefas(S);
    const sit = a => sitF === 'todos' || (sitF === 'baixados' ? !!a.baixa : (a.vivo && !a.baixa));
    const lst = S.animais.filter(a => sit(a) && (!sexoF || a.sexo === sexoF) && (!q || H.norm(a.nome + ' ' + a.registro + ' ' + a.chip).includes(q)));
    if (!lst.length) return '<tr><td colspan="7"><div class="empty">Nenhum animal encontrado.</div></td></tr>';
    return lst.map(a => {
      const t = ts.filter(x => x.animalId === a.id);
      const at = t.filter(x => x.status === 'atrasado').length, pd = t.filter(x => x.doc).length;
      const prox = t.find(x => !x.doc && x.status !== 'atrasado');
      const g = H.gestacao(S, a);
      const sit = [a.baixa ? '<span class="chip c-muted">' + esc(a.baixa.motivo) + ' em ' + H.br(a.baixa.data) + '</span>' : !a.vivo ? '<span class="chip c-muted">Inativo</span>' : '', at ? '<span class="chip c-late">' + at + ' atrasado' + (at > 1 ? 's' : '') + '</span>' : '', pd ? '<span class="chip c-info">' + pd + ' pendência' + (pd > 1 ? 's' : '') + '</span>' : '', g ? '<span class="chip c-accent">Gestante ' + g.mes + 'º mês</span>' : '', (a.vivo && !at && !pd) ? '<span class="chip c-ok">Em dia</span>' : ''].join(' ');
      return '<tr class="click" data-act="ver-animal" data-id="' + a.id + '"><td><b>' + esc(a.nome) + '</b><br><span class="mono muted">' + (a.registro ? 'Reg. ' + esc(a.registro) : 'Sem registro') + '</span></td><td>' + (a.sexo === 'F' ? 'Fêmea' : 'Macho') + '</td><td style="white-space:nowrap">' + H.idadeTxt(a.nascimento) + '</td><td class="small">' + esc(a.livro || '-') + '</td><td><span class="chip ' + (/sem/i.test(a.dna) ? 'c-late' : 'c-ok') + '">' + esc(a.dna || '-') + '</span></td><td><div class="row" style="gap:4px">' + sit + '</div></td><td class="small">' + (prox ? esc(prox.titulo) + '<br><span class="muted">' + H.br(prox.due) + '</span>' : '-') + '</td></tr>';
    }).join('');
  }

  /* ================= FICHA ================= */
  function vFicha(id) {
    const a = H.animal(S, id); if (!a) return '<div class="empty">Animal não encontrado.</div>';
    const g = H.gestacao(S, a);
    const tabs = [['prontuario', 'Prontuário'], ['agenda', 'Agenda'], ['dados', 'Dados e genealogia']];
    let corpo = '';
    if (fichaTab === 'prontuario') {
      const regs = S.registros.filter(r => r.animalId === a.id && (filtroCat === 'todos' || r.tipo === filtroCat)).sort((x, y) => x.data < y.data ? 1 : -1);
      corpo = '<div class="spread" style="margin-bottom:6px"><select id="filtroCat" class="inp" style="width:auto"><option value="todos">Todas as categorias</option>' + Object.keys(H.CATS).filter(k => k !== 'documental').map(k => '<option value="' + k + '"' + (filtroCat === k ? ' selected' : '') + '>' + H.CATS[k].nome + '</option>').join('') + '</select><button class="btn pri" data-act="registrar" data-id="' + a.id + '">' + IC.plus + 'Novo registro</button></div>' + UI.linhaTempo(S, regs, { excluir: true });
    } else if (fichaTab === 'agenda') {
