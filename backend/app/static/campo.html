<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Haras360 Campo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Zilla+Slab:wght@500;600;700&display=swap">
<style>
[hidden]{display:none!important}
body{margin:0}
img{max-width:100%}
:root{
  /* Layout: barra lateral verde-floresta fixa + área de trabalho em grade; no celular a barra vira faixa superior rolável */
  --bg:#eceee8; --surface:#fafbf7; --surface-2:#f1f3ed; --ink:#1b231e; --muted:#58645c; --line:#d4d9cf; --line-2:#e3e7df;
  --forest:#1e3a2b; --forest-2:#27493a; --forest-ink:#e8f0e9; --forest-muted:#a3baa9;
  --accent:#96541d; --accent-soft:#f2e4d4; --accent-ink:#ffffff;
  --late:#ad3327; --late-soft:#f6e0db; --soon:#9b640c; --soon-soft:#f5e9cf; --ok:#2a6f46; --ok-soft:#dbeee1; --info:#2c5b84; --info-soft:#dee8f2;
  --shadow:0 1px 2px rgba(20,32,24,.06),0 8px 24px rgba(20,32,24,.07);
  --f-display:"Zilla Slab",Rockwell,"Roboto Slab",Georgia,serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#101511; --surface:#171f19; --surface-2:#1d261f; --ink:#e3eae3; --muted:#97a59b; --line:#2b362e; --line-2:#232d26;
  --forest:#0b150f; --forest-2:#16251b; --forest-ink:#dde8df; --forest-muted:#85a08d;
  --accent:#d38b4c; --accent-soft:#38261a; --accent-ink:#1b120a;
  --late:#ec7c6a; --late-soft:#3a1d18; --soon:#e1aa52; --soon-soft:#352810; --ok:#6cbf88; --ok-soft:#163022; --info:#7eaedb; --info-soft:#172838;
  --shadow:0 1px 2px rgba(0,0,0,.35); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#101511; --surface:#171f19; --surface-2:#1d261f; --ink:#e3eae3; --muted:#97a59b; --line:#2b362e; --line-2:#232d26;
  --forest:#0b150f; --forest-2:#16251b; --forest-ink:#dde8df; --forest-muted:#85a08d;
  --accent:#d38b4c; --accent-soft:#38261a; --accent-ink:#1b120a;
  --late:#ec7c6a; --late-soft:#3a1d18; --soon:#e1aa52; --soon-soft:#352810; --ok:#6cbf88; --ok-soft:#163022; --info:#7eaedb; --info-soft:#172838;
  --shadow:0 1px 2px rgba(0,0,0,.35); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--f-display);font-weight:600;line-height:1.15;margin:0;text-wrap:balance;letter-spacing:-.005em}
h1{font-size:clamp(1.6rem,1.2rem + 1.4vw,2.2rem)}
h2{font-size:1.3rem}
h3{font-size:1.06rem}
p{margin:0}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-size:.86em;letter-spacing:.01em;font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.eyebrow{font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:1000px){.grid2{grid-template-columns:minmax(0,1fr)}}

/* botões */
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:600;font-size:.9rem;line-height:1.2;text-decoration:none;color:var(--ink);white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--accent);padding-inline:8px}
.btn.ghost:hover{background:var(--accent-soft)}
.btn.sm{padding:5px 10px;font-size:.82rem}
.btn.danger{color:var(--late)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn svg{width:16px;height:16px;flex:none}

/* superfícies */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.card.flush{padding:0;overflow:hidden}
.card-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.sec{display:flex;flex-direction:column;gap:18px}

/* chips de estado */
.chip{display:inline-flex;align-items:center;gap:6px;font-size:.76rem;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap;border:1px solid transparent}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.85}
.chip.nodot::before{display:none}
.c-late{background:var(--late-soft);color:var(--late)}
.c-soon{background:var(--soon-soft);color:var(--soon)}
.c-ok{background:var(--ok-soft);color:var(--ok)}
.c-info{background:var(--info-soft);color:var(--info)}
.c-accent{background:var(--accent-soft);color:var(--accent)}
.c-muted{background:var(--surface-2);color:var(--muted)}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:900px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:2px;text-align:left;cursor:pointer}
.kpi:hover{border-color:var(--muted)}
.kpi b{font-family:var(--f-display);font-size:2rem;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi span{font-size:.84rem;color:var(--muted)}
.kpi.late b{color:var(--late)} .kpi.soon b{color:var(--soon)} .kpi.info b{color:var(--info)}

/* tarefas */
.tasks{display:flex;flex-direction:column}
.task{display:grid;grid-template-columns:4px 64px minmax(0,1fr) auto;gap:12px;align-items:center;padding:11px 16px 11px 0;border-top:1px solid var(--line-2)}
.task:first-child{border-top:0}
.task .bar{align-self:stretch;border-radius:0 3px 3px 0;background:var(--line)}
.task.atrasado .bar{background:var(--late)} .task.hoje .bar,.task.semana .bar{background:var(--soon)} .task.pendente .bar{background:var(--info)} .task.mes .bar{background:var(--ok)}
.task .when{font-family:var(--f-mono);font-size:.78rem;color:var(--muted);line-height:1.25}
.task .when b{display:block;font-size:.95rem;color:var(--ink);font-weight:500}
.task .what{min-width:0}
.task .what strong{font-weight:600}
.task .what .sub{font-size:.84rem;color:var(--muted)}
@media (max-width:560px){.task{grid-template-columns:4px 54px minmax(0,1fr)}.task .act{grid-column:3}}

/* tabelas */
.tbl-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:.9rem}
.tbl th{text-align:left;font-size:.72rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:11px 12px;border-bottom:1px solid var(--line-2);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr.click{cursor:pointer}
.tbl tbody tr.click:hover td{background:var(--surface-2)}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums}

/* formulários */
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>label,.lbl{font-size:.8rem;font-weight:600;color:var(--muted)}
.inp{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 11px;min-width:0}
.inp:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
textarea.inp{min-height:84px;resize:vertical}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.fgrid .full{grid-column:1/-1}
@media (max-width:560px){.fgrid{grid-template-columns:minmax(0,1fr)}}
.checks{display:flex;flex-wrap:wrap;gap:8px}
.check{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer;font-size:.88rem;background:var(--surface)}
.check:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.check input{accent-color:var(--accent)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:7px 14px;cursor:pointer;font-weight:600;font-size:.86rem}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.drop{border:1.5px dashed var(--line);border-radius:var(--r);padding:28px 18px;text-align:center;background:var(--surface-2);display:flex;flex-direction:column;gap:10px;align-items:center}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}

/* abas */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{border:0;background:none;padding:10px 14px;cursor:pointer;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}

/* prontuário */
.timeline{display:flex;flex-direction:column}
.ev{display:grid;grid-template-columns:96px minmax(0,1fr);gap:16px;padding:14px 0;border-top:1px solid var(--line-2)}
.ev:first-child{border-top:0}
.ev .d{font-family:var(--f-mono);font-size:.8rem;color:var(--muted);padding-top:2px}
.ev .body{display:flex;flex-direction:column;gap:6px;min-width:0}
.ev .meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.84rem;color:var(--muted)}
.ev .obs{font-size:.92rem;overflow-wrap:anywhere}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumbs button{padding:0;border:1px solid var(--line);border-radius:6px;overflow:hidden;cursor:zoom-in;width:72px;height:72px;background:var(--surface-2)}
.thumbs img{width:100%;height:100%;object-fit:cover;display:block}
@media (max-width:560px){.ev{grid-template-columns:minmax(0,1fr);gap:4px}}

/* gestação */
.gest{display:flex;flex-direction:column;gap:8px}
.gbar{height:8px;border-radius:99px;background:var(--surface-2);position:relative;overflow:hidden;border:1px solid var(--line-2)}
.gbar i{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:99px}
.gmarks{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:.7rem;color:var(--muted)}

/* modal e toast */
.modal{position:fixed;inset:0;background:rgba(10,16,12,.5);display:flex;align-items:flex-start;justify-content:center;z-index:50;padding:max(24px,env(safe-area-inset-top,0px)) 16px 24px;overflow-y:auto}
.sheet{background:var(--surface);color:var(--ink);border-radius:14px;width:min(640px,100%);box-shadow:0 20px 60px rgba(0,0,0,.25);display:flex;flex-direction:column;max-height:none}
.sheet header{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:18px 20px;border-bottom:1px solid var(--line)}
.sheet .sbody{padding:18px 20px;display:flex;flex-direction:column;gap:14px}
.sheet footer{display:flex;justify-content:flex-end;gap:10px;padding:14px 20px;border-top:1px solid var(--line);flex-wrap:wrap}
.sheet.wide{width:min(900px,100%)}
.x{border:0;background:none;cursor:pointer;font-size:1.4rem;line-height:1;color:var(--muted);padding:4px 8px;border-radius:6px}
.x:hover{background:var(--surface-2)}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:10px;font-size:.9rem;max-width:min(560px,calc(100% - 32px));z-index:60;box-shadow:var(--shadow)}
.note{border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:10px 12px;font-size:.86rem;color:var(--muted)}
.note.warn{background:var(--soon-soft);border-color:transparent;color:var(--soon)}
.note.bad{background:var(--late-soft);border-color:transparent;color:var(--late)}
.note.good{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}

/* chat */
.chat{display:flex;flex-direction:column;height:min(68vh,640px)}
.msgs{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:12px;padding:18px}
.msg{max-width:78%;padding:10px 14px;border-radius:12px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:.93rem}
.msg.me{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:4px}
.msg.bot{align-self:flex-start;background:var(--surface-2);border:1px solid var(--line-2);border-bottom-left-radius:4px}
.msg .src{display:block;margin-top:6px;font-size:.74rem;color:var(--muted);font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.chat form{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line)}
.sugs{display:flex;gap:6px;flex-wrap:wrap;padding:0 18px 12px}
.sugs button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 11px;font-size:.82rem;cursor:pointer}
.sugs button:hover{border-color:var(--accent);color:var(--accent)}
@media (max-width:560px){.msg{max-width:92%}}

@media (prefers-reduced-motion:no-preference){
  .view-in{animation:vin .22s ease-out}
  @keyframes vin{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}
}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- barra superior com menus agrupados (gestor e administrador) ---------- */
:root{--forest-accent:#e3ab6c}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--forest);color:var(--forest-ink);padding-inline:clamp(16px,3vw,32px)}
.topbar-in{display:flex;align-items:center;gap:18px;min-height:60px;max-width:1400px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;color:inherit;text-decoration:none;flex:none}
.brand svg{width:30px;height:30px;flex:none;color:var(--forest-accent)}
.brand b{font-family:var(--f-display);font-size:1.3rem;font-weight:700;display:block;line-height:1}
.brand small{display:block;font-size:.68rem;letter-spacing:.09em;text-transform:uppercase;color:var(--forest-muted);margin-top:2px;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.menu{display:flex;align-items:center;gap:2px;margin-left:auto}
.menu>li,.menu>div{list-style:none;position:relative}
.mi{display:flex;align-items:center;gap:6px;border:0;background:none;color:var(--forest-muted);padding:8px 11px;border-radius:7px;cursor:pointer;font-weight:600;font-size:.9rem;white-space:nowrap;text-decoration:none}
.mi:hover,.mi[aria-expanded="true"]{color:var(--forest-ink);background:var(--forest-2)}
.mi[aria-current="page"]{color:var(--forest-ink);box-shadow:inset 0 -2px 0 var(--forest-accent);border-radius:7px 7px 0 0}
.mi .caret{width:10px;height:10px;opacity:.7}
.mi.off{opacity:.45}
.drop-m{position:absolute;right:0;top:calc(100% + 6px);min-width:230px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 32px rgba(0,0,0,.18);padding:6px;display:flex;flex-direction:column;gap:2px;z-index:50}
.menu>div:not(:last-child) .drop-m{right:auto;left:0}
.di{display:flex;align-items:center;gap:10px;border:0;background:none;color:var(--ink);padding:9px 10px;border-radius:7px;cursor:pointer;font-size:.9rem;text-align:left;text-decoration:none;width:100%}
.di:hover{background:var(--surface-2)}
.di[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.di.off{color:var(--muted)}
.di .tag{margin-left:auto;font-size:.68rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:1px 7px}
.di small{display:block;color:var(--muted);font-size:.78rem}
.dsep{height:1px;background:var(--line-2);margin:4px 2px}
.tb-acts{display:flex;align-items:center;gap:6px;flex:none}
.tb-ic{position:relative;border:0;background:none;color:var(--forest-ink);width:38px;height:38px;border-radius:8px;display:grid;place-items:center;cursor:pointer}
.tb-ic:hover{background:var(--forest-2)}
.tb-ic svg{width:20px;height:20px}
.tb-ic .badge{position:absolute;top:2px;right:0;margin:0}
.badge{background:var(--late);color:#fff;font-size:.68rem;font-weight:700;padding:1px 6px;border-radius:99px;font-variant-numeric:tabular-nums}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--forest-accent);color:var(--forest);display:grid;place-items:center;font-weight:700;font-size:.78rem;flex:none}
.userbtn{display:flex;align-items:center;gap:9px;border:0;background:none;color:var(--forest-ink);padding:4px 8px 4px 4px;border-radius:99px;cursor:pointer;text-align:left}
.userbtn:hover,.userbtn[aria-expanded="true"]{background:var(--forest-2)}
.userbtn span.n{font-size:.86rem;font-weight:600;line-height:1.15}
.userbtn span.n small{display:block;font-weight:500;color:var(--forest-muted);font-size:.74rem}
.hamb{display:none}
.pagehead{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.pagehead .acts{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
main.wrapm{padding-inline:clamp(16px,3vw,32px);padding-block:24px 72px;max-width:1400px;margin:0 auto;min-width:0}
.off-note{display:flex;gap:10px;align-items:flex-start}
@media (max-width:980px){
  .hamb{display:grid}
  .menu{display:none;position:absolute;left:0;right:0;top:100%;background:var(--forest);flex-direction:column;align-items:stretch;padding:8px 16px 16px;gap:2px;max-height:calc(100dvh - 60px);overflow-y:auto;box-shadow:0 12px 24px rgba(0,0,0,.25)}
  .menu.aberto{display:flex}
  .menu>div{width:100%}
  .mi{width:100%;justify-content:space-between;padding:11px 10px}
  .mi[aria-current="page"]{box-shadow:inset 3px 0 0 var(--forest-accent);border-radius:7px}
  .drop-m{position:static;box-shadow:none;border:0;background:var(--forest-2);margin:2px 0 6px;min-width:0}
  .drop-m .di{color:var(--forest-ink)}
  .drop-m .di:hover{background:var(--forest)}
  .drop-m .di[aria-current="page"]{background:var(--forest);color:var(--forest-accent)}
  .drop-m .di small,.drop-m .di .tag{color:var(--forest-muted);border-color:var(--forest-muted)}
  .userbtn span.n{display:none}
  .topbar-in{gap:10px}
}

/* logotipo do haras na barra superior */
.logo-h{display:grid;place-items:center;background:#fff;border-radius:8px;height:42px;min-width:42px;max-width:110px;padding:3px 6px;flex:none}
.logo-h img{max-height:36px;max-width:98px;object-fit:contain;display:block}
.brand .nome-h{font-size:1.05rem;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.logo-prev{display:grid;place-items:center;background:#fff;border:1px solid var(--line);border-radius:10px;width:160px;height:160px;padding:10px;flex:none}
.logo-prev img{max-width:100%;max-height:100%;object-fit:contain}
.logo-prev.vazio{color:var(--muted);font-size:.84rem;text-align:center;background:var(--surface-2)}
@media (max-width:980px){.brand .nome-h{max-width:150px}}

:root{--forest-accent:#e3ab6c}
.hdr{background:var(--forest);color:var(--forest-ink);padding-inline:16px;padding-block:14px 0}
.hdr-in{max-width:900px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px}
.brand svg{width:30px;height:30px;color:var(--forest-accent);flex:none}
.brand b{font-family:var(--f-display);font-size:1.3rem;font-weight:700;line-height:1;display:block}
.brand small{display:block;font-size:.72rem;color:var(--forest-muted);letter-spacing:.08em;text-transform:uppercase;margin-top:3px}
