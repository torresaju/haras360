<script>
/* Haras360 · cliente da API */
const API = (function () {
  async function req(metodo, url, corpo, bruto) {
    let r;
    const headers = { 'X-Haras360': '1', 'X-Portal': window.H360_PORTAL || '' };
    if (!bruto) headers['Content-Type'] = 'application/json';
    try {
      r = await fetch(url, { method: metodo, credentials: 'same-origin', headers, body: corpo === undefined ? undefined : (bruto ? corpo : JSON.stringify(corpo)) });
    } catch (e) { throw new Error('Sem conexão com o servidor. Verifique a internet e tente de novo.'); }
    let dados = null;
    try { dados = await r.json(); } catch (e) { }
    if (r.status === 401 && !/\/api\/(login|me\/senha|me\/codigos)/.test(url)) {
      location.href = '/entrar?volta=' + encodeURIComponent(location.pathname);
      throw new Error('Sessão expirada. Faça login novamente.');
    }
    if (!r.ok) {
      const d = dados && dados.detail;
      throw new Error(typeof d === 'string' ? d : r.status === 413 ? 'Arquivo grande demais.' : 'Não foi possível concluir (erro ' + r.status + '). Confira os dados e tente de novo.');
    }
    return dados;
  }
  return {
    get: u => req('GET', u), post: (u, b) => req('POST', u, b || {}), put: (u, b) => req('PUT', u, b), patch: (u, b) => req('PATCH', u, b), del: u => req('DELETE', u),
    upload: (u, formData) => req('POST', u, formData, true)
  };
})();

</script>
<script>
/* Haras360 · núcleo do navegador: utilidades, catálogos, leitura de PDF ABCCMM e assistente. O motor de regras roda na API. */
const H = (function () {
  const DAY = 86400000;
  const pad = n => String(n).padStart(2, '0');

  /* ---------- datas ---------- */
  function hoje() { const d = new Date(); d.setHours(0, 0, 0, 0); return d; }
  function dt(s) {
    if (s instanceof Date) { const x = new Date(s); x.setHours(0, 0, 0, 0); return x; }
    const [y, m, d] = String(s).slice(0, 10).split('-').map(Number);
    return new Date(y, m - 1, d);
  }
  function iso(d) { d = dt(d); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function addDias(d, n) { const x = dt(d); x.setDate(x.getDate() + n); return x; }
  function addMeses(d, n) {
    const x = dt(d); const day = x.getDate(); x.setDate(1); x.setMonth(x.getMonth() + n);
    const last = new Date(x.getFullYear(), x.getMonth() + 1, 0).getDate(); x.setDate(Math.min(day, last)); return x;
  }
  function dias(a, b) { return Math.round((dt(b) - dt(a)) / DAY); }
  function br(s) { if (!s) return '-'; const d = dt(s); return pad(d.getDate()) + '/' + pad(d.getMonth() + 1) + '/' + d.getFullYear(); }
  function brCurta(s) { const d = dt(s); const m = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez']; return pad(d.getDate()) + ' ' + m[d.getMonth()]; }
  function brParaIso(s) { const [d, m, y] = s.split('/'); return y + '-' + m + '-' + d; }
  function idadeMeses(nasc) {
    const n = dt(nasc), t = hoje();
    let m = (t.getFullYear() - n.getFullYear()) * 12 + (t.getMonth() - n.getMonth());
    if (t.getDate() < n.getDate()) m--; return Math.max(0, m);
  }
  function idadeTxt(nasc) {
    if (!nasc) return '-';
    const m = idadeMeses(nasc);
    if (m < 24) return m + (m === 1 ? ' mês' : ' meses');
    const a = Math.floor(m / 12), r = m % 12;
    return a + ' anos' + (r ? ' e ' + r + (r === 1 ? ' mês' : ' meses') : '');
  }
  function relativo(due) {
    const d = dias(hoje(), due);
    if (d === 0) return 'hoje';
    if (d === 1) return 'amanhã';
    if (d === -1) return 'ontem';
    if (d < 0) return 'há ' + (-d) + ' dias';
    return 'em ' + d + ' dias';
  }
  function uid() { return Math.random().toString(36).slice(2, 10); }
  function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
  function norm(s) { return String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase(); }
  function moeda(v) { return v.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' }); }
  function mascaraCPF(c) { const d = String(c || '').replace(/\D/g, ''); if (d.length !== 11) return c || '-'; return d.slice(0, 3) + '.***.***-' + d.slice(9); }

  /* ---------- catálogos ---------- */
  const CATS = {
    vacina: { nome: 'Vacinação', tom: 'info' },
    vermifugacao: { nome: 'Vermifugação', tom: 'ok' },
    odontologia: { nome: 'Odontologia', tom: 'accent' },
    ferrageamento: { nome: 'Ferrageamento', tom: 'muted' },
    exame: { nome: 'Exame clínico', tom: 'info' },
    reprodutivo: { nome: 'Reprodução', tom: 'accent' },
    ocorrencia: { nome: 'Ocorrência', tom: 'soon' },
    documental: { nome: 'Documentação', tom: 'late' }
  };
  const EVENTOS_REPRO = ['Cobertura', 'Inseminação', 'Diagnóstico positivo', 'Diagnóstico negativo', 'Parto', 'Aborto'];
  const GESTACAO_DIAS = 340;

  const FAIXAS = [
    { de: 1, ate: 3, valor: 0, nome: 'Gratuito' },
    { de: 4, ate: 10, valor: 12.9, nome: 'Faixa 1' },
    { de: 11, ate: 20, valor: 10.9, nome: 'Faixa 2' },
    { de: 21, ate: 30, valor: 8.9, nome: 'Faixa 3' }
  ];
  let LIMITE_ANIMAIS = 30;
  function mensalidade(n) {
    let t = 0;
    for (const f of FAIXAS) { const q = Math.max(0, Math.min(n, f.ate) - f.de + 1); t += q * f.valor; }
    return Math.round(t * 100) / 100;
  }

  /* ---------- leitura do estado calculado pela API (motor de regras no servidor) ---------- */
  function protocolo(st, id) { return st.protocolos.find(p => p.id === id); }
  function animal(st, id) { return st.animais.find(a => a.id === id); }
  function gestacao(st, a) { return a && st.gestacoes ? (st.gestacoes[a.id] || null) : null; }
  function tarefas(st, opts) { opts = opts || {}; return (st.tarefas || []).filter(t => !opts.animalId || t.animalId === opts.animalId); }
  function notificacoes(st) { return st.notificacoes || []; }
  const STATUS_TXT = { atrasado: 'Atrasado', hoje: 'Hoje', semana: 'Próximos 7 dias', mes: 'Próximos 30 dias', futuro: 'Programado', pendente: 'Pendência' };
  const TIPOS_NOTIF = {
    atrasado: 'Procedimento atrasado',
    semana: 'Procedimento nos próximos 7 dias',
    parto: 'Previsão de parto',
    documental: 'Pendência documental ABCCMM',
    campo: 'Registro feito pelo operador de campo'
  };

  function tituloRegistro(st, r) {
    if (r.tipo === 'vacina') return 'Vacina ' + (r.protocolos || []).map(id => (protocolo(st, id) || { nome: id }).nome).join(' + ');
    if (r.tipo === 'reprodutivo') return r.evento || 'Evento reprodutivo';
    if (r.tipo === 'ocorrencia') return r.titulo || 'Ocorrência';
    if (r.tipo === 'exame') return 'Exame: ' + (r.exame || 'clínico');
    if (r.tipo === 'odontologia') return r.procedimento || 'Odontologia';
    if (r.tipo === 'ferrageamento') return 'Ferrageamento';
    if (r.tipo === 'vermifugacao') return 'Vermifugação';
    return CATS[r.tipo] ? CATS[r.tipo].nome : 'Registro';
  }
  function doseTxt(d) { if (d === 'reforco') return 'Reforço'; if (d === 'unica' || !d) return ''; return d + 'ª dose'; }

  /* ---------- auditoria e glossário ---------- */
  const ACOES_AUDIT = {
    login: 'Login', login_falha: 'Login recusado', logout: 'Saída', '2fa_cadastro': '2FA cadastrado', '2fa_falha': 'Código 2FA recusado',
    '2fa_redefinido': '2FA redefinido', '2fa_codigos_novos': 'Novos códigos de recuperação', senha_troca: 'Troca de senha', senha_redefinida: 'Senha redefinida',
    sessao_encerrada: 'Sessão encerrada', usuario_criado: 'Usuário criado', usuario_ativado: 'Usuário reativado', usuario_desativado: 'Usuário desativado',
    animal_criado: 'Animal cadastrado', animal_editado: 'Animal editado', importacao: 'Importação ABCCMM', registro_excluido: 'Registro excluído',
    protocolos_alterados: 'Protocolos alterados', protocolos_restaurados: 'Protocolos restaurados', parametro_alterado: 'Parametrização alterada',
    haras_criado: 'Haras criado', logo_alterado: 'Logotipo alterado', haras_alterado: 'Haras alterado', atualizacao_solicitada: 'Atualização solicitada', atualizacao_concluida: 'Atualização concluída',
    atualizacao_falhou: 'Atualização falhou', rollback_solicitado: 'Volta de versão solicitada', rollback_concluido: 'Volta de versão concluída',
    backup_solicitado: 'Backup solicitado', backup_concluido: 'Backup concluído', backup_falhou: 'Backup falhou'
  };
  const GLOSSARIO = [
    ['ABCCMM', 'Associação Brasileira dos Criadores do Cavalo Mangalarga Marchador, responsável pelo registro genealógico da raça.'],
    ['Relatório de Plantel', 'PDF emitido pelo Sistema de Gestão ABCCMM com os animais de um associado. É a fonte da importação no Haras360.'],
    ['Livro', 'Categoria em que o animal está inscrito no registro genealógico, por exemplo "MM6 - Definitivo Fechado Fêmea".'],
    ['DNA VP', 'Exame de DNA com verificação de parentesco realizado. "Sem exame" gera pendência documental.'],
    ['Bloqueado', 'Situação do animal na ABCCMM que impede alguns serviços até ser regularizada.'],
    ['AIE', 'Anemia Infecciosa Equina. Exame com resultado negativo e dentro da validade é exigido para o trânsito (GTA).'],
    ['Mormo', 'Doença bacteriana dos equídeos. O exame negativo é exigido para trânsito e eventos.'],
    ['GTA', 'Guia de Trânsito Animal, documento obrigatório para transportar equídeos.'],
    ['Primovacinação', 'Série inicial de doses de uma vacina. Se o reforço vencer além da tolerância, a série recomeça.'],
    ['Reforço', 'Dose aplicada depois da série inicial, em geral anual ou semestral.'],
    ['Desmama', 'Separação do potro da mãe, por volta dos 6 meses. Marca a 1ª dose de rinopneumonite.'],
    ['Cobertura', 'Monta ou inseminação. Com o diagnóstico positivo, o sistema calcula a previsão de parto.'],
    ['Vacina multivalente', 'Vacina que protege contra várias doenças em uma aplicação. No registro, marque todas as doenças cobertas.'],
    ['2FA', 'Verificação em duas etapas: além da senha, um código de 6 dígitos do aplicativo autenticador do celular.']
  ];

  /* ---------- leitura de PDF (Relatório de Plantel ABCCMM) ---------- */
  async function linhasPDF(file) {
    if (!window.pdfjsLib) throw new Error('O leitor de PDF não carregou. Verifique a conexão e recarregue a página.');
    try { pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'; } catch (e) { }
    const data = new Uint8Array(await file.arrayBuffer());
    const pdf = await pdfjsLib.getDocument({ data, isEvalSupported: false }).promise;
    const linhas = [];
    for (let i = 1; i <= pdf.numPages; i++) {
      const pg = await pdf.getPage(i);
      const tc = await pg.getTextContent();
      const its = tc.items.filter(it => it.str && it.str.trim()).map(it => ({ s: it.str, x: it.transform[4], y: it.transform[5], w: it.width || 0, h: Math.abs(it.transform[3]) || 8 }));
      its.sort((p, q) => q.y - p.y || p.x - q.x);
      const rows = [];
      for (const it of its) {
        const row = rows.find(r => Math.abs(r.y - it.y) <= Math.max(2, it.h * 0.4));
        if (row) row.items.push(it); else rows.push({ y: it.y, items: [it] });
      }
      rows.sort((p, q) => q.y - p.y);
      for (const row of rows) {
        row.items.sort((p, q) => p.x - q.x);
        let s = '', fim = null;
        for (const it of row.items) { if (fim !== null && it.x - fim > 0.8) s += ' '; s += it.s; fim = it.x + it.w; }
        s = s.replace(/\s+/g, ' ').trim();
        if (s) linhas.push(s);
      }
    }
    return linhas;
  }

  const RE_ANIMAL = /^(.+?)\s+(?:(MM\s?\d+\s*-\s*.+?)\s+)?(?:(\d{4,8})\s+)?([MF])\s+(\S+)\s+(Viv[oa]|Mort[oa])\s+(.+?)\s+(\d{2}\/\d{2}\/\d{4})(?:\s+(\d{6,20}))?$/i;
  function lerPlantel(linhas) {
    const texto = linhas.join('\n');
    const plano = linhas.join(' ');
    const res = { valido: /RELAT[ÓO]RIO DE PLANTEL/i.test(texto) || /ABCCMM|Mangalarga/i.test(texto), associado: '', cpf: '', impresso: '', totalInformado: null, machos: null, femeas: null, animais: [], ignoradas: [] };
    let m = plano.match(/Associado\(a\):\s*(.+?)\s*-\s*CPF:\s*([\d.\-]+)/i);
    if (m) { res.associado = m[1].trim(); res.cpf = m[2].replace(/\D/g, ''); }
    m = plano.match(/Impresso em\s*(\d{2}\/\d{2}\/\d{4})/i); if (m) res.impresso = brParaIso(m[1]);
    m = plano.match(/Total de animais:\s*(\d+)/i); if (m) res.totalInformado = Number(m[1]);
    for (const l of linhas) {
      if (!/\d{2}\/\d{2}\/\d{4}/.test(l) || /Impresso em|Associado\(a\)/i.test(l)) continue;
      const x = l.match(RE_ANIMAL);
      if (!x) { res.ignoradas.push(l); continue; }
      res.animais.push({
        nome: x[1].trim().toUpperCase(),
        livro: (x[2] || '').trim(),
        registro: x[3] || '',
        sexo: x[4].toUpperCase(),
        bloqueado: !/^(-|n[aã]o|n)$/i.test(x[5]),
        vivo: /viv/i.test(x[6]),
        dna: x[7].trim(),
        nascimento: brParaIso(x[8]),
        chip: x[9] || ''
      });
    }
    res.machos = res.animais.filter(a => a.sexo === 'M').length;
    res.femeas = res.animais.filter(a => a.sexo === 'F').length;
    return res;
  }

  function compararImportacao(st, lidos) {
    return lidos.map(n => {
      const ex = st.animais.find(a => (n.registro && a.registro === n.registro) || (n.chip && a.chip === n.chip) || norm(a.nome) === norm(n.nome));
      if (!ex) return { novo: n, situacao: 'novo', diffs: [] };
      const campos = ['nome', 'livro', 'registro', 'sexo', 'bloqueado', 'vivo', 'dna', 'nascimento', 'chip'];
      const diffs = campos.filter(c => String(ex[c] ?? '') !== String(n[c] ?? ''));
      return { novo: n, existente: ex, situacao: diffs.length ? 'atualizar' : 'igual', diffs };
    });
  }

  /* certificado ou outro PDF com genealogia: busca rótulos usuais */
  function lerGenealogia(linhas) {
    const g = {};
    const regras = [
      ['avoPaterno', /av[ôo]\s*paterno\s*[:\-]?\s*(.+)/i],
      ['avoPaterna', /av[óo]\s*paterna\s*[:\-]?\s*(.+)/i],
      ['avoMaterno', /av[ôo]\s*materno\s*[:\-]?\s*(.+)/i],
      ['avoMaterna', /av[óo]\s*materna\s*[:\-]?\s*(.+)/i],
      ['pai', /^(?:.*\s)?pai\s*[:\-]\s*(.+)/i],
      ['mae', /^(?:.*\s)?m[ãa]e\s*[:\-]\s*(.+)/i]
    ];
    for (const l of linhas) {
      for (const [k, re] of regras) {
        if (g[k]) continue;
        const m = l.match(re);
        if (m) { const v = m[1].replace(/\s+(registro|reg\.?|n[ºo])\s*.*$/i, '').trim(); if (v && v.length < 80) { g[k] = v.toUpperCase(); break; } }
      }
    }
    return g;
  }

  /* ---------- assistente (base de demonstração) ---------- */
  function responder(st, pergunta) {
    const q = norm(pergunta);
    const has = (...k) => k.some(w => q.includes(w));
    const alvo = st.animais.find(a => q.includes(norm(a.nome).split(' ')[0]));
    const ts = tarefas(st);
    const vac = id => protocolo(st, id);
    const lista = arr => arr.map(t => '• ' + t.animal + ': ' + t.titulo + ' (' + t.etapa + ', ' + br(t.due) + ')').join('\n');

    if (alvo && has('parto', 'gestac', 'prenhe', 'parir')) {
      const g = gestacao(st, alvo);
      if (!g) return { t: alvo.nome + ' não tem gestação ativa registrada no prontuário.' };
      return { t: alvo.nome + ' está com ' + g.dias + ' dias de gestação (' + g.mes + 'º mês). A cobertura foi em ' + br(g.cobertura) + (g.garanhao ? ' com ' + g.garanhao : '') + ', e o parto está previsto para ' + br(g.parto) + ', ' + relativo(g.parto) + '. A estimativa usa ' + GESTACAO_DIAS + ' dias; o veterinário deve confirmar por ultrassonografia.', f: 'Dados do prontuário' };
    }
    if (alvo && has('vacina', 'pendente', 'atras', 'proxim', 'agenda')) {
      const t = ts.filter(x => x.animalId === alvo.id && x.status !== 'futuro');
      if (!t.length) return { t: alvo.nome + ' não tem procedimentos atrasados nem previstos para os próximos 30 dias.', f: 'Motor de regras' };
      return { t: 'Pendências e próximos 30 dias de ' + alvo.nome + ':\n' + lista(t), f: 'Motor de regras' };
    }
    if (has('atrasad', 'pendenc', 'vencid')) {
      const t = ts.filter(x => x.status === 'atrasado');
      if (!t.length) return { t: 'Nenhum procedimento atrasado no plantel.', f: 'Motor de regras' };
      return { t: 'Há ' + t.length + ' procedimento(s) atrasado(s):\n' + lista(t), f: 'Motor de regras' };
    }
    if (has('raiva')) {
      const r = vac('raiva');
      return { t: 'Raiva é obrigatória. 1ª dose aos 4 meses, 2ª dose 30 dias depois e reforço anual. Em estados endêmicos o reforço passa a ser semestral. Neste haras o reforço está configurado como ' + (st.haras.raivaSemestral ? 'semestral' : 'anual') + '. Via ' + (r ? r.via : 'SC ou IM') + ', conforme a bula.', f: 'Protocolo VetJr. UFMG' };
    }
    if (has('gestante', 'prenha', 'gestacao', 'rinopneu', 'herpes')) return { t: 'Para rinopneumonite: 1ª dose na desmama, 2ª dose 3 a 4 semanas depois e 3ª dose 6 meses após a segunda. Éguas gestantes recebem doses no 5º, 7º e 9º mês de gestação. O Haras360 agenda essas doses automaticamente quando um diagnóstico positivo é registrado.', f: 'Protocolo VetJr. UFMG' };
    if (has('reinici', 'perdeu', 'perdi', 'esqueci', 'nunca vacin')) return { t: 'Animais que nunca foram vacinados ou que perderam o prazo do reforço devem refazer a primovacinação daquela vacina, ou seja, reiniciar o esquema desde a 1ª dose. O sistema sinaliza "Reiniciar primovacinação" quando o reforço passa de 15 dias do vencimento.', f: 'Protocolo VetJr. UFMG' };
    if (has('potro', 'potra', 'filhote', '12 meses')) return { t: 'Potros iniciam a vacinação entre 3 e 4 meses (tétano, encefalomielite e influenza a partir de 3; raiva e leptospirose a partir de 4; rinopneumonite na desmama). Concluído o esquema inicial, o primeiro reforço é feito a partir dos 12 meses de idade, e o sistema já programa nessa data.', f: 'Protocolo VetJr. UFMG' };
    if (has('multival', 'trivalen', 'bivalen', 'combinad')) return { t: 'Vacinas multivalentes protegem contra mais de uma doença na mesma aplicação, geralmente com custo menor. No Haras360 basta marcar todas as doenças cobertas em um único registro, e cada protocolo é atualizado.', f: 'Protocolo VetJr. UFMG' };
    if (has('transport', 'gta', 'viagem', 'evento', 'exposic', 'leilao')) return { t: 'Para transporte, a vacina de encefalomielite é obrigatória, e o trânsito de equídeos costuma exigir exames negativos de Anemia Infecciosa (AIE) e Mormo dentro da validade. O sistema usa 60 dias como validade padrão, editável em Protocolos. Confirme a exigência do órgão de defesa agropecuária do seu estado e do evento.', f: 'Protocolo VetJr. UFMG e padrão de mercado' };
    if (has('obrigator')) return { t: 'Pelo protocolo de referência: raiva é obrigatória; encefalomielite é obrigatória para transporte e em alguns estabelecimentos; rinopneumonite é exigida por alguns estabelecimentos. Tétano, influenza e leptospirose são fortemente recomendadas, e garrotilho depende do risco do plantel.', f: 'Protocolo VetJr. UFMG' };
    if (has('dna')) return { t: 'O Relatório de Plantel informa a situação do exame de DNA de cada animal. Quando aparece "Sem exame", o Haras360 abre uma pendência documental, porque o exame é necessário para o registro genealógico.', f: 'Relatório de Plantel ABCCMM' };
    if (has('livro', 'mm5', 'mm6', 'definitivo', 'registro')) return { t: 'O campo "Livro" do relatório indica a categoria em que o animal está inscrito no registro genealógico, por exemplo "MM6 - Definitivo Fechado Fêmea". Animais sem livro e sem número de registro geram a pendência "Registro ABCCMM pendente". Na versão final, o assistente explicará cada categoria citando o artigo do Regulamento do Registro Genealógico.', f: 'Relatório de Plantel ABCCMM' };
    if (has('plano', 'preco', 'mensal', 'cobran', 'pagar', 'gratis', 'gratuito')) { const n = st.animais.filter(a => a.vivo).length; return { t: 'O plano é gratuito até 3 animais. A partir do 4º, cobra-se por animal em faixas decrescentes. Com ' + n + ' animais ativos, a mensalidade simulada é ' + moeda(mensalidade(n)) + '. Os valores atuais são ilustrativos.', f: 'Plano Haras360' }; }
    if (has('vermif', 'verme')) return { t: 'O padrão configurado é vermifugação a cada 90 dias a partir dos 2 meses de idade. Esse intervalo é um padrão de mercado e deve ser ajustado pelo veterinário, de preferência com base em exame de OPG (contagem de ovos nas fezes).', f: 'Padrão de mercado' };
    if (has('dente', 'odonto', 'aparelho')) return { t: 'A avaliação odontológica está programada a cada 12 meses a partir dos 2 anos. Quando um aparelho dentário é registrado, o sistema agenda o retorno em 24 meses.', f: 'Padrão de mercado' };
    if (has('ferra', 'casco')) return { t: 'O ferrageamento é agendado a cada 45 dias a partir do primeiro registro de ferrageamento do animal. Ajuste o intervalo em Protocolos conforme o ferrador.', f: 'Padrão de mercado' };
    return { t: 'Ainda não tenho essa resposta na base atual. Na próxima versão, o assistente será treinado com o Estatuto e o Regulamento do Registro Genealógico da ABCCMM e responderá citando o artigo correspondente. Experimente perguntar sobre vacinas, gestação, transporte, DNA ou plano.', f: 'Demonstração' };
  }

  return {
    hoje, dt, iso, addDias, addMeses, dias, br, brCurta, brParaIso, idadeMeses, idadeTxt, relativo, uid, esc, norm, moeda, mascaraCPF,
    CATS, EVENTOS_REPRO, GESTACAO_DIAS, FAIXAS, LIMITE_ANIMAIS, STATUS_TXT, TIPOS_NOTIF,
    mensalidade,
    protocolo, animal, gestacao, tarefas, notificacoes, tituloRegistro, doseTxt,
    ACOES_AUDIT, GLOSSARIO,
    linhasPDF, lerPlantel, compararImportacao, lerGenealogia, responder
  };
})();

</script>
<script>
/* Haras360 · componentes de interface compartilhados pelos dois portais */
const UI = (function () {
  const { esc, br, brCurta, relativo } = H;
  const $ = s => document.querySelector(s);

  const I = (p, extra) => '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"' + (extra || '') + '>' + p + '</svg>';
  const ICON = {
    plus: I('<path d="M12 5v14M5 12h14"/>'),
    home: I('<path d="M4 11l8-7 8 7v8a1 1 0 0 1-1 1h-5v-6h-4v6H5a1 1 0 0 1-1-1z"/>'),
    horse: I('<path d="M5 20l2-6c-1-2-1-4 1-6l3-3 1 2 3-1c2 0 4 2 4 4l1 3-2 1-2-2-2 2v6"/><path d="M14 20v-4"/>'),
    upload: I('<path d="M12 16V4M7 9l5-5 5 5"/><path d="M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/>'),
    cal: I('<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>'),
    rules: I('<path d="M4 6h10M4 12h16M4 18h7"/><circle cx="17" cy="6" r="2"/><circle cx="14" cy="18" r="2"/>'),
    bell: I('<path d="M6 16V11a6 6 0 1 1 12 0v5l2 2H4z"/><path d="M10 20a2 2 0 0 0 4 0"/>'),
    team: I('<circle cx="9" cy="8" r="3"/><path d="M3 20c0-3 3-5 6-5s6 2 6 5"/><circle cx="17" cy="9" r="2.4"/><path d="M16 15c3 0 5 2 5 4"/>'),
    chat: I('<path d="M4 5h16v11H9l-5 4z"/><path d="M8 9h8M8 12h5"/>'),
    card: I('<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 10h18M7 15h4"/>'),
    back: I('<path d="M15 5l-7 7 7 7"/>'),
    cam: I('<path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/>'),
    check: I('<path d="M5 12l5 5 9-10"/>'),
    file: I('<path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4"/>'),
    send: I('<path d="M4 12l16-8-6 16-3-6z"/>'),
    alert: I('<path d="M12 4l9 16H3z"/><path d="M12 10v4M12 17v.5"/>')
  };

  /* ---------- toast e modal ---------- */
  let tt;
  function toast(msg) {
    let t = $('#toast');
    t.textContent = msg; t.hidden = false;
    clearTimeout(tt); tt = setTimeout(() => { t.hidden = true; }, 4200);
  }
  let onClose = null;
  function abrir({ titulo, corpo, rodape, largo }) {
    const m = $('#modal');
    m.innerHTML = '<div class="sheet' + (largo ? ' wide' : '') + '" role="dialog" aria-modal="true" aria-labelledby="mt"><header><h2 id="mt">' + titulo + '</h2><button class="x" data-act="fechar" aria-label="Fechar">×</button></header><div class="sbody">' + corpo + '</div>' + (rodape ? '<footer>' + rodape + '</footer>' : '') + '</div>';
    m.hidden = false;
    document.body.style.overflow = 'hidden';
    const f = m.querySelector('input:not([type=hidden]):not([type=checkbox]),select,textarea');
    if (f) setTimeout(() => f.focus(), 30);
    return m;
  }
  function fechar() { const m = $('#modal'); m.hidden = true; m.innerHTML = ''; document.body.style.overflow = ''; if (onClose) { const f = onClose; onClose = null; f(); } }
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#modal').hidden) fechar(); });
  document.addEventListener('click', e => { if (e.target.id === 'modal') fechar(); });

  /* ---------- tons ---------- */
  const TOM = { atrasado: 'c-late', hoje: 'c-soon', semana: 'c-soon', mes: 'c-ok', futuro: 'c-muted', pendente: 'c-info' };
  const TOMCAT = t => 'c-' + ((H.CATS[t] || {}).tom || 'muted');
  function chipStatus(s) { return '<span class="chip ' + TOM[s] + '">' + H.STATUS_TXT[s] + '</span>'; }
  function chipCat(c) { return '<span class="chip nodot ' + TOMCAT(c) + '">' + esc((H.CATS[c] || { nome: c }).nome) + '</span>'; }

  /* ---------- linha de tarefa ---------- */
  function linhaTarefa(t, o) {
    o = o || {};
    const quando = t.doc ? '<b>Pend.</b>doc.' : '<b>' + brCurta(t.due) + '</b>' + relativo(t.due);
    const animal = o.semAnimal ? '' : '<a href="#" data-act="ver-animal" data-id="' + t.animalId + '">' + esc(t.animal) + '</a> · ';
    const acao = t.doc ? '' : t.parto ? '<button class="btn sm" data-act="registrar-tarefa" data-id="' + esc(t.id) + '">Registrar parto</button>' : '<button class="btn sm" data-act="registrar-tarefa" data-id="' + esc(t.id) + '">' + ICON.check + 'Registrar</button>';
    return '<div class="task ' + t.status + '"><span class="bar"></span><div class="when">' + quando + '</div><div class="what"><div class="row" style="gap:8px"><strong>' + esc(t.titulo) + '</strong><span class="chip nodot c-muted">' + esc(t.etapa) + '</span>' + (t.status === 'atrasado' ? '<span class="chip c-late">Atrasado</span>' : '') + '</div><div class="sub">' + animal + esc(t.nota || '') + '</div></div><div class="act">' + acao + '</div></div>';
  }

  /* ---------- prontuário ---------- */
  function linhaTempo(st, regs, o) {
    o = o || {};
    if (!regs.length) return '<div class="empty">Nenhum registro nesta categoria.</div>';
    return '<div class="timeline">' + regs.map(r => {
      const meta = [];
      const dose = H.doseTxt(r.dose); if (r.tipo === 'vacina' && dose) meta.push(dose);
      if (r.produto) meta.push('Produto: ' + esc(r.produto));
      if (r.lote) meta.push('Lote <span class="mono">' + esc(r.lote) + '</span>');
      if (r.ferrador) meta.push('Ferrador: ' + esc(r.ferrador));
      if (r.resultado) meta.push('Resultado: ' + esc(r.resultado));
      if (r.garanhao) meta.push('Garanhão: ' + esc(r.garanhao));
      if (r.dataCobertura && r.evento === 'Diagnóstico positivo') meta.push('Cobertura em ' + br(r.dataCobertura));
      if (r.gravidade) meta.push('Gravidade: ' + esc(r.gravidade));
      const fotos = (r.fotos || []).length ? '<div class="thumbs">' + r.fotos.map((f, i) => '<button data-act="ver-foto" data-r="' + r.id + '" data-i="' + i + '" aria-label="Ampliar foto ' + (i + 1) + '"><img src="' + f + '" alt=""></button>').join('') + '</div>' : '';
      const nome = o.comAnimal ? (() => { const a = H.animal(st, r.animalId); return a ? '<a href="#" data-act="ver-animal" data-id="' + a.id + '">' + esc(a.nome) + '</a> · ' : ''; })() : '';
      const del = o.excluir ? '<button class="btn ghost sm danger" data-act="excluir-reg" data-id="' + r.id + '">Excluir</button>' : '';
      return '<div class="ev"><div class="d">' + br(r.data) + '</div><div class="body"><div class="spread"><div class="row" style="gap:8px">' + chipCat(r.tipo) + '<strong>' + esc(H.tituloRegistro(st, r)) + '</strong></div>' + del + '</div>' + (meta.length ? '<div class="meta">' + meta.map(m => '<span>' + m + '</span>').join('') + '</div>' : '') + (r.obs ? '<p class="obs">' + esc(r.obs) + '</p>' : '') + fotos + '<div class="meta">' + nome + '<span>' + esc(r.autor) + ' · ' + esc(r.origem) + '</span></div></div></div>';
    }).join('') + '</div>';
  }

  function verFoto(st, rid, i) {
    const r = st.registros.find(x => x.id === rid); if (!r) return;
    abrir({ titulo: esc(H.tituloRegistro(st, r)), corpo: '<img src="' + r.fotos[i] + '" alt="Foto do registro" style="border-radius:8px;width:100%"><p class="muted small">' + br(r.data) + ' · ' + esc(r.autor) + '</p>', largo: true });
  }

  /* ---------- fotos ---------- */
  function comprimir(file, max, q) {
    max = max || 1600; q = q || 0.8;
    return new Promise((res, rej) => {
      const fr = new FileReader();
      fr.onload = () => {
        const img = new Image();
        img.onload = () => {
          const k = Math.min(1, max / Math.max(img.width, img.height));
          const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
          c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
          res(c.toDataURL('image/jpeg', q));
        };
        img.onerror = () => rej(new Error('Arquivo de imagem inválido'));
        img.src = fr.result;
      };
      fr.onerror = () => rej(new Error('Não foi possível ler o arquivo'));
      fr.readAsDataURL(file);
    });
  }

  /* ---------- logotipo do haras: reduz para 512 px mantendo a transparência ---------- */
  function prepararLogo(file) {
    return new Promise((res, rej) => {
      if (!/^image\/(png|jpeg|webp)$/.test(file.type)) { rej(new Error('Use uma imagem PNG, JPG ou WebP.')); return; }
      const fr = new FileReader();
      fr.onload = () => {
        const img = new Image();
        img.onload = () => {
          // recorta as margens vazias (brancas ou transparentes) para o logotipo ocupar bem o espaço
          const o = document.createElement('canvas'); o.width = img.width; o.height = img.height;
          const ox = o.getContext('2d'); ox.drawImage(img, 0, 0);
          const px = ox.getImageData(0, 0, o.width, o.height).data;
          let x0 = o.width, y0 = o.height, x1 = -1, y1 = -1;
          for (let y = 0; y < o.height; y += 2) for (let x = 0; x < o.width; x += 2) {
            const i = (y * o.width + x) * 4;
            if (px[i + 3] > 24 && (px[i] < 235 || px[i + 1] < 235 || px[i + 2] < 235)) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
          }
          let sx = 0, sy = 0, sw = o.width, sh = o.height;
          if (x1 > x0 && y1 > y0) { const m = Math.round(Math.max(x1 - x0, y1 - y0) * 0.04); sx = Math.max(0, x0 - m); sy = Math.max(0, y0 - m); sw = Math.min(o.width, x1 + m + 2) - sx; sh = Math.min(o.height, y1 + m + 2) - sy; }
          const k = Math.min(1, 512 / Math.max(sw, sh));
          const c = document.createElement('canvas'); c.width = Math.round(sw * k); c.height = Math.round(sh * k);
          c.getContext('2d').drawImage(o, sx, sy, sw, sh, 0, 0, c.width, c.height);
          let url = c.toDataURL('image/png');
          if (url.length > 1300000) url = c.toDataURL('image/webp', 0.9);
          if (url.length > 1300000) { rej(new Error('O logotipo ficou grande demais. Use uma imagem mais simples.')); return; }
          res(url);
        };
        img.onerror = () => rej(new Error('Não foi possível abrir a imagem.'));
        img.src = fr.result;
      };
      fr.onerror = () => rej(new Error('Não foi possível ler o arquivo.'));
      fr.readAsDataURL(file);
    });
  }

  /* ---------- formulário de registro ---------- */
  let fotosPend = [];
  const OPC = (arr, sel) => arr.map(v => { const [val, lab] = Array.isArray(v) ? v : [v, v]; return '<option value="' + esc(val) + '"' + (String(val) === String(sel) ? ' selected' : '') + '>' + esc(lab) + '</option>'; }).join('');

  function extras(st, tipo, p) {
    p = p || {};
    if (tipo === 'vacina') {
      const vs = st.protocolos.filter(x => x.cat === 'vacina');
      return '<div class="field full"><span class="lbl">Doenças cobertas (marque todas em vacinas multivalentes)</span><div class="checks">' + vs.map(v => '<label class="check"><input type="checkbox" name="prot" value="' + v.id + '"' + ((p.protocolos || []).includes(v.id) ? ' checked' : '') + '>' + esc(v.nome) + '</label>').join('') + '</div></div>' +
        '<div class="field"><label for="f-dose">Dose</label><select id="f-dose" class="inp">' + OPC([[1, '1ª dose'], [2, '2ª dose'], [3, '3ª dose'], ['reforco', 'Reforço']], p.dose || 'reforco') + '</select></div>' +
        '<div class="field"><label for="f-lote">Lote</label><input id="f-lote" class="inp" value="' + esc(p.lote || '') + '" placeholder="Ex.: RB2291"></div>' +
        '<div class="field full"><label for="f-produto">Produto / marca</label><input id="f-produto" class="inp" value="' + esc(p.produto || '') + '" placeholder="Ex.: Trivalente tétano + encefalomielite + influenza"></div>';
    }
    if (tipo === 'vermifugacao') return '<div class="field full"><label for="f-produto">Vermífugo (princípio ativo)</label><input id="f-produto" class="inp" value="' + esc(p.produto || '') + '" placeholder="Ex.: Ivermectina + praziquantel"></div>';
    if (tipo === 'odontologia') return '<div class="field full"><label for="f-proc">Procedimento</label><select id="f-proc" class="inp">' + OPC(['Avaliação', 'Avaliação e correção', 'Aparelho dentário instalado', 'Retorno de aparelho', 'Extração', 'Outro'], p.procedimento || ((p.protocolos || []).includes('aparelho') ? 'Retorno de aparelho' : 'Avaliação')) + '</select></div>';
    if (tipo === 'ferrageamento') return '<div class="field full"><label for="f-ferrador">Ferrador</label><input id="f-ferrador" class="inp" value="' + esc(p.ferrador || '') + '"></div>';
    if (tipo === 'exame') {
      const sel = (p.protocolos || []).includes('aie') ? 'Anemia Infecciosa (AIE)' : (p.protocolos || []).includes('mormo') ? 'Mormo' : (p.exame || 'Anemia Infecciosa (AIE)');
      return '<div class="field"><label for="f-exame">Exame</label><select id="f-exame" class="inp">' + OPC(['Anemia Infecciosa (AIE)', 'Mormo', 'Hemograma', 'Ultrassonografia', 'Raio-X', 'Outro'], sel) + '</select></div><div class="field"><label for="f-res">Resultado</label><input id="f-res" class="inp" value="' + esc(p.resultado || '') + '" placeholder="Ex.: Negativo"></div>';
    }
    if (tipo === 'reprodutivo') {
      const machos = st.animais.filter(a => a.sexo === 'M').map(a => '<option value="' + esc(a.nome) + '">');
      return '<div class="field"><label for="f-evento">Evento</label><select id="f-evento" class="inp">' + OPC(H.EVENTOS_REPRO, p.evento || 'Cobertura') + '</select></div><div class="field"><label for="f-garanhao">Garanhão</label><input id="f-garanhao" class="inp" list="dl-machos" value="' + esc(p.garanhao || '') + '"><datalist id="dl-machos">' + machos.join('') + '</datalist></div><div class="field"><label for="f-cob">Data da cobertura (diagnóstico positivo)</label><input id="f-cob" type="date" class="inp" value="' + esc(p.dataCobertura || '') + '"></div>';
    }
    if (tipo === 'ocorrencia') return '<div class="field"><label for="f-titulo">O que aconteceu</label><input id="f-titulo" class="inp" value="' + esc(p.titulo || '') + '" placeholder="Ex.: Mancando da pata traseira"></div><div class="field"><label for="f-grav">Gravidade</label><select id="f-grav" class="inp">' + OPC(['Leve', 'Moderada', 'Grave'], p.gravidade || 'Leve') + '</select></div>';
    return '';
  }

  function formRegistro(st, pre, ctx) {
    pre = pre || {}; fotosPend = [];
    const tipos = Object.keys(H.CATS).filter(k => k !== 'documental');
    const animais = st.animais.filter(a => a.vivo);
    const tipo = pre.tipo || 'vacina';
    const corpo = '<form id="fr" class="stack" novalidate><div class="fgrid">' +
      '<div class="field"><label for="f-animal">Animal</label><select id="f-animal" class="inp">' + OPC(animais.map(a => [a.id, a.nome]), pre.animalId) + '</select></div>' +
      '<div class="field"><label for="f-data">Data</label><input id="f-data" type="date" class="inp" value="' + (pre.data || H.iso(H.hoje())) + '" max="' + H.iso(H.hoje()) + '"></div>' +
      '<div class="field full"><label for="f-tipo">Tipo de registro</label><select id="f-tipo" class="inp">' + OPC(tipos.map(k => [k, H.CATS[k].nome]), tipo) + '</select></div>' +
      '</div><div id="f-extra" class="fgrid">' + extras(st, tipo, pre) + '</div>' +
      '<div class="field"><label for="f-obs">Observações</label><textarea id="f-obs" class="inp" placeholder="Descreva o que foi feito ou observado">' + esc(pre.obs || '') + '</textarea></div>' +
      '<div class="field"><span class="lbl">Fotos (até 4)</span><div class="row"><label class="btn" for="f-fotos">' + ICON.cam + 'Adicionar fotos</label><input id="f-fotos" type="file" accept="image/*" multiple hidden><span class="small muted" id="f-fstat">Nenhuma foto</span></div><div class="thumbs" id="f-thumbs"></div></div>' +
      '<p class="note" id="f-erro" hidden></p></form>';
    abrir({ titulo: pre.tituloModal || 'Novo registro no prontuário', corpo, rodape: '<button class="btn" data-act="fechar">Cancelar</button><button class="btn pri" data-act="salvar-registro">' + ICON.check + 'Salvar registro</button>' });
    $('#f-tipo').addEventListener('change', e => { $('#f-extra').innerHTML = extras(st, e.target.value, {}); });
    $('#f-fotos').addEventListener('change', async e => {
      const files = [...e.target.files].slice(0, 4 - fotosPend.length);
      for (const f of files) { try { fotosPend.push(await comprimir(f)); } catch (err) { toast(err.message); } }
      e.target.value = '';
      desenharFotos();
    });
    formRegistro.ctx = ctx;
  }
  function desenharFotos() {
    $('#f-thumbs').innerHTML = fotosPend.map((f, i) => '<button type="button" data-act="rem-foto" data-i="' + i + '" title="Remover foto" style="cursor:pointer"><img src="' + f + '" alt="Foto ' + (i + 1) + '"></button>').join('');
    $('#f-fstat').textContent = fotosPend.length ? fotosPend.length + ' de 4 · toque para remover' : 'Nenhuma foto';
  }
  function remFoto(i) { fotosPend.splice(i, 1); desenharFotos(); }

  function lerRegistro(st) {
    const v = id => { const el = document.getElementById(id); return el ? el.value.trim() : ''; };
    const tipo = v('f-tipo');
    const r = { id: H.uid(), animalId: v('f-animal'), data: v('f-data'), tipo, protocolos: [], dose: 'unica', obs: v('f-obs'), fotos: fotosPend.slice() };
    const erro = m => { const e = $('#f-erro'); e.textContent = m; e.className = 'note bad'; e.hidden = false; return null; };
    if (!r.animalId) return erro('Escolha o animal.');
    if (!r.data) return erro('Informe a data do registro.');
    if (r.data > H.iso(H.hoje())) return erro('A data não pode ser futura. Para agendar, o sistema calcula a próxima etapa automaticamente.');
    if (tipo === 'vacina') {
      r.protocolos = [...document.querySelectorAll('input[name=prot]:checked')].map(i => i.value);
      if (!r.protocolos.length) return erro('Marque ao menos uma doença coberta pela vacina.');
      const d = v('f-dose'); r.dose = d === 'reforco' ? 'reforco' : Number(d);
      r.produto = v('f-produto'); r.lote = v('f-lote');
    } else if (tipo === 'vermifugacao') { r.protocolos = ['vermi']; r.produto = v('f-produto'); }
    else if (tipo === 'odontologia') { r.procedimento = v('f-proc'); r.protocolos = /aparelho/i.test(r.procedimento) ? ['aparelho'] : ['odonto']; }
    else if (tipo === 'ferrageamento') { r.protocolos = ['ferrag']; r.ferrador = v('f-ferrador'); }
    else if (tipo === 'exame') { r.exame = v('f-exame'); r.resultado = v('f-res'); if (/AIE/.test(r.exame)) r.protocolos = ['aie']; if (/Mormo/.test(r.exame)) r.protocolos = ['mormo']; }
    else if (tipo === 'reprodutivo') {
      r.evento = v('f-evento'); r.garanhao = v('f-garanhao').toUpperCase(); r.dataCobertura = v('f-cob');
      const a = H.animal(st, r.animalId);
      if (a && a.sexo !== 'F' && r.evento !== 'Cobertura') return erro('Eventos de gestação só se aplicam a fêmeas.');
      if (r.evento === 'Diagnóstico positivo' && !r.dataCobertura) return erro('Informe a data da cobertura para calcular a previsão de parto.');
    } else if (tipo === 'ocorrencia') { r.titulo = v('f-titulo'); r.gravidade = v('f-grav'); if (!r.titulo) return erro('Descreva a ocorrência em poucas palavras.'); }
    return r;
  }

  /* pré-preenche o formulário a partir de uma tarefa do motor de regras */
  function preDeTarefa(t) {
    if (t.parto) return { animalId: t.animalId, tipo: 'reprodutivo', evento: 'Parto', tituloModal: 'Registrar parto' };
    return { animalId: t.animalId, tipo: t.cat, protocolos: t.protocoloId ? [t.protocoloId] : [], dose: t.dose, tituloModal: 'Registrar ' + t.titulo.toLowerCase() };
  }

  /* ---------- assistente ---------- */
  const SUGS = ['Quais procedimentos estão atrasados?', 'Quando é o parto da Diva?', 'O que muda na vacina de raiva em região endêmica?', 'Quais exames preciso para transportar um cavalo?', 'Como vacinar uma égua gestante?', 'Perdi o prazo do reforço, o que fazer?'];
  function chatHTML(hist, titulo, sub) {
    return '<div class="card flush chat"><div style="padding:16px 18px;border-bottom:1px solid var(--line)"><h2>' + titulo + '</h2><p class="small muted">' + sub + '</p></div><div class="msgs" id="msgs">' +
      hist.map(m => '<div class="msg ' + m.de + '">' + esc(m.t) + (m.f ? '<span class="src">Base: ' + esc(m.f) + '</span>' : '') + '</div>').join('') +
      '</div>' + (hist.length <= 1 ? '<div class="sugs">' + SUGS.map(s => '<button type="button" data-act="sug" data-q="' + esc(s) + '">' + esc(s) + '</button>').join('') + '</div>' : '') +
      '<form id="chat-f"><input id="chat-q" class="inp" placeholder="Pergunte sobre vacinas, normas, gestação ou o plantel" autocomplete="off"><button class="btn pri" aria-label="Enviar">' + ICON.send + '</button></form></div>';
  }

  /* ---------- barra superior com menus agrupados ---------- */
  const CARET = '<svg class="caret" viewBox="0 0 10 10" aria-hidden="true"><path d="M2 3.5l3 3 3-3" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>';
  const MARCA = '<svg viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" aria-hidden="true"><path d="M11 34V20a9 9 0 0 1 18 0v14"/><path d="M7 34h8M25 34h8"/><circle cx="14" cy="22" r="1.2" fill="currentColor"/><circle cx="26" cy="22" r="1.2" fill="currentColor"/><circle cx="16" cy="14.5" r="1.2" fill="currentColor"/><circle cx="24" cy="14.5" r="1.2" fill="currentColor"/></svg>';
  function itemMenu(it, atual, cls) {
    const sel = atual === it.id || (it.tambem || []).includes(atual);
    if (it.href) return '<a class="' + cls + '" href="' + it.href + '" target="_blank" rel="noopener">' + esc(it.rotulo) + (it.desc ? '<small>' + esc(it.desc) + '</small>' : '') + '</a>';
    if (it.off) return '<button class="' + cls + ' off" data-act="fora-plano" data-m="' + esc(it.rotulo) + '" title="Disponível em outro plano">' + esc(it.rotulo) + '<span class="tag">Plano</span></button>';
    return '<button class="' + cls + '" data-act="nav" data-v="' + it.id + '"' + (sel ? ' aria-current="page"' : '') + '>' + (cls === 'di' && it.desc ? '<span>' + esc(it.rotulo) + '<small>' + esc(it.desc) + '</small></span>' : esc(it.rotulo)) + '</button>';
  }
  function topbar(o) {
    const menu = o.menu.map((m, i) => {
      if (!m.itens) return '<div>' + itemMenu(m, o.atual, 'mi') + '</div>';
      const sel = m.itens.some(it => it.id === o.atual || (it.tambem || []).includes(o.atual));
      const todosOff = m.itens.every(it => it.off);
      return '<div><button class="mi' + (todosOff ? ' off' : '') + '" data-dd="g' + i + '" aria-expanded="false" aria-haspopup="true"' + (sel ? ' aria-current="page"' : '') + '>' + esc(m.grupo) + CARET + '</button>' +
        '<div class="drop-m" id="dd-g' + i + '" hidden>' + m.itens.map(it => it.sep ? '<div class="dsep"></div>' : itemMenu(it, o.atual, 'di')).join('') + '</div></div>';
    }).join('');
    const ini = (o.usuario.nome || '?').split(' ').map(p => p[0]).slice(0, 2).join('').toUpperCase();
    const userMenu = '<div class="drop-m" id="dd-user" hidden><div style="padding:8px 10px"><b>' + esc(o.usuario.nome) + '</b><small class="muted" style="display:block">' + esc(o.usuario.email) + '</small></div><div class="dsep"></div>' +
      o.usuarioItens.map(it => '<button class="di" data-act="' + it.act + '">' + esc(it.rotulo) + '</button>').join('') + '<div class="dsep"></div><button class="di" data-act="sair">Sair</button></div>';
    const marca = o.logo ? '<span class="logo-h"><img src="' + esc(o.logo) + '" alt="Logotipo de ' + esc(o.sub) + '"></span><div><b class="nome-h">' + esc(o.sub) + '</b><small>Haras360</small></div>' : MARCA + '<div><b>Haras360</b><small>' + esc(o.sub) + '</small></div>';
    return '<div class="topbar-in"><a class="brand" href="' + o.home + '">' + marca + '</a>' +
      '<nav class="menu" id="menu-principal" aria-label="Menu principal">' + menu + '</nav>' +
      '<div class="tb-acts">' + (o.sino ? '<button class="tb-ic" data-act="nav" data-v="' + o.sino.view + '" aria-label="Notificações">' + ICON.bell + (o.sino.n ? '<span class="badge">' + o.sino.n + '</span>' : '') + '</button>' : '') +
      '<div style="position:relative"><button class="userbtn" data-dd="user" aria-expanded="false" aria-haspopup="true"><span class="avatar">' + esc(ini) + '</span><span class="n">' + esc(o.usuario.nome.split(' ')[0]) + '<small>' + esc(o.perfilTxt) + '</small></span></button>' + userMenu + '</div>' +
      '<button class="tb-ic hamb" data-act="hamb" aria-label="Abrir menu" aria-controls="menu-principal" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button></div></div>';
  }
  function fecharMenus(exceto) {
    document.querySelectorAll('[data-dd][aria-expanded="true"]').forEach(b => { if (b !== exceto) { b.setAttribute('aria-expanded', 'false'); const d = document.getElementById('dd-' + b.dataset.dd); if (d) d.hidden = true; } });
  }
  document.addEventListener('click', e => {
    const b = e.target.closest('[data-dd]');
    if (b) { const ab = b.getAttribute('aria-expanded') === 'true'; fecharMenus(b); b.setAttribute('aria-expanded', String(!ab)); const d = document.getElementById('dd-' + b.dataset.dd); if (d) d.hidden = ab; return; }
    if (e.target.closest('[data-act="hamb"]')) { const m = document.getElementById('menu-principal'), h = e.target.closest('[data-act="hamb"]'); const ab = m.classList.toggle('aberto'); h.setAttribute('aria-expanded', String(ab)); return; }
    if (!e.target.closest('.drop-m') || e.target.closest('[data-act]')) { fecharMenus(); const m = document.getElementById('menu-principal'); if (m && e.target.closest('[data-act="nav"]')) m.classList.remove('aberto'); }
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') fecharMenus(); });

  /* confirmação na própria página: o primeiro clique arma, o segundo executa */
  function confirmar(el, txt, fn) {
    if (el.dataset.armed) { delete el.dataset.armed; fn(); return; }
    el.dataset.armed = '1'; const old = el.innerHTML; el.innerHTML = txt; el.classList.add('danger');
    setTimeout(() => { if (el.isConnected && el.dataset.armed) { delete el.dataset.armed; el.innerHTML = old; el.classList.remove('danger'); } }, 4000);
  }

  /* códigos de recuperação do 2FA: mostrados uma única vez */
  function mostrarCodigos(codigos, titulo) {
    abrir({ titulo: titulo || 'Códigos de recuperação', corpo: '<p>Guarde estes códigos em local seguro, fora do celular. Cada um permite entrar uma única vez se você perder o aplicativo autenticador.</p><div class="codigos mono" style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;font-size:1rem;background:var(--surface-2);padding:14px;border-radius:8px">' + codigos.map(c => '<span>' + esc(c) + '</span>').join('') + '</div><p class="note warn">Estes códigos não serão mostrados de novo.</p>', rodape: '<button class="btn" data-act="copiar-codigos">Copiar</button><button class="btn pri" data-act="fechar">Já guardei</button>' });
    mostrarCodigos.atual = codigos;
  }
  document.addEventListener('click', async e => {
    if (!e.target.closest('[data-act="copiar-codigos"]')) return;
    try { await navigator.clipboard.writeText((mostrarCodigos.atual || []).join('\n')); toast('Códigos copiados.'); } catch (err) { toast('Selecione os códigos e copie manualmente.'); }
  });

  return { ICON, toast, topbar, prepararLogo, fecharMenus, confirmar, mostrarCodigos, abrir, fechar, chipStatus, chipCat, linhaTarefa, linhaTempo, verFoto, formRegistro, lerRegistro, remFoto, preDeTarefa, chatHTML, comprimir, TOM, set onClose(f) { onClose = f; } };
})();

</script>
<script>
(function () {
  let S = null;
  const $ = s => document.querySelector(s);
  const esc = H.esc, br = H.br, IC = UI.ICON;
  let view = 'hoje', param = null, notifFiltro = 'todas';
  let chat = [{ de: 'bot', t: 'Olá. Posso dizer o que está pendente no plantel, explicar a vacinação e tirar dúvidas do dia a dia.', f: 'Haras360' }];
  async function recarregar() { S = await API.get('/api/estado'); }
  async function executar(el, fn, ok) {
    if (el && el.disabled) return null;
    const txt = el ? el.innerHTML : '';
    if (el) { el.disabled = true; el.innerHTML = 'Enviando...'; }
    try { const r = await fn(); await recarregar(); if (ok !== false) UI.toast(typeof ok === 'string' ? ok : (r && r.resumo) || 'Salvo.'); return r || true; }
    catch (e) { UI.toast(e.message); return null; }
    finally { if (el && el.isConnected) { el.disabled = false; el.innerHTML = txt; } }
  }
  const avisos = () => H.notificacoes(S).filter(n => n.tipo !== 'campo' && n.tipo !== 'documental');
  const naoLidos = () => avisos().filter(n => !S.lidas.includes(n.id)).length;

  const NAV_TODOS = [['hoje', 'Hoje', IC.home], ['animais', 'Animais', IC.horse], ['registrar', 'Registrar', IC.plus], ['avisos', 'Avisos', IC.bell], ['assistente', 'Assistente', IC.chat]];
  const NAV = [];
  function go(v, p) { view = v; param = p || null; render(); window.scrollTo(0, 0); }
  function render() {
    const nl = naoLidos();
    if (S.haras.logo) { const b = document.querySelector('.hdr .brand'); if (!b.querySelector('.logo-h')) b.innerHTML = '<span class="logo-h"><img src="' + esc(S.haras.logo) + '" alt="Logotipo de ' + esc(S.haras.nome) + '"></span><div><b class="nome-h">' + esc(S.haras.nome) + '</b><small>Haras360 · Campo</small></div>'; }
    else $('#haras-n').textContent = 'Campo · ' + S.haras.nome;
    $('#me-n').textContent = S.usuario.nome;
    $('#av').textContent = S.usuario.nome.split(' ').map(p => p[0]).slice(0, 2).join('').toUpperCase();
    $('#tnav').innerHTML = NAV.map(([id, l, ic]) => '<button data-act="' + (id === 'registrar' ? 'registrar' : 'nav') + '" data-v="' + id + '"' + ((view === id || (view === 'ficha' && id === 'animais')) ? ' aria-current="page"' : '') + '>' + ic + '<span>' + l + '</span>' + (id === 'avisos' && nl ? '<span class="badge">' + nl + '</span>' : '') + '</button>').join('');
    const v = $('#view'); v.classList.remove('view-in'); void v.offsetWidth; v.classList.add('view-in');
    v.innerHTML = VIEWS[view](param);
    if (AFTER[view]) AFTER[view](param);
  }

  function vHoje() {
    const ts = H.tarefas(S).filter(t => !t.doc);
    const at = ts.filter(t => t.status === 'atrasado'), hj = ts.filter(t => t.status === 'hoje'), sm = ts.filter(t => t.status === 'semana');
    const d0 = new Date().toLocaleDateString('pt-BR', { weekday: 'long', day: 'numeric', month: 'long' }); const d = d0.charAt(0).toUpperCase() + d0.slice(1);
    const bloco = (tit, arr, vazio) => '<div class="card flush"><div class="card-h" style="padding:14px 16px 0"><h3>' + tit + '</h3><span class="small muted">' + arr.length + '</span></div><div class="tasks" style="padding:2px 16px 6px 0">' + (arr.length ? arr.map(t => UI.linhaTarefa(t)).join('') : '<div class="empty">' + vazio + '</div>') + '</div></div>';
    return '<div class="sec"><div class="daybar"><div><div class="eyebrow">Tarefas do dia</div><h1>' + d + '</h1></div></div>' +
      '<div class="cnt"><div class="late"><b>' + at.length + '</b><span>Atrasadas</span></div><div class="soon"><b>' + hj.length + '</b><span>Para hoje</span></div><div><b>' + sm.length + '</b><span>Próximos 7 dias</span></div></div>' +
      '<div class="quick"><button data-act="registrar">' + IC.check + '<span>Novo registro<small>Vacina, vermífugo, casco, exame</small></span></button><button data-act="ocorrencia">' + IC.alert + '<span>Registrar ocorrência<small>Algo diferente com um animal</small></span></button></div>' +
      bloco('Atrasadas', at, 'Nada atrasado. Bom trabalho.') + bloco('Para hoje', hj, 'Nada marcado para hoje.') + bloco('Próximos 7 dias', sm, 'Nada previsto para a semana.') + '</div>';
  }

  function vAnimais() {
    const ts = H.tarefas(S);
    return '<div class="sec"><div><div class="eyebrow">Plantel</div><h1>Animais</h1></div><div class="acards">' + S.animais.filter(a => a.vivo).map(a => {
      const t = ts.filter(x => x.animalId === a.id && !x.doc);
      const at = t.filter(x => x.status === 'atrasado').length, sm = t.filter(x => ['hoje', 'semana'].includes(x.status)).length;
      const g = H.gestacao(S, a);
      return '<button class="acard" data-act="ver-animal" data-id="' + a.id + '"><b>' + esc(a.nome) + '</b><span class="small muted">' + (a.sexo === 'F' ? 'Fêmea' : 'Macho') + ' · ' + H.idadeTxt(a.nascimento) + '</span><div class="row" style="gap:4px">' + (at ? '<span class="chip c-late">' + at + ' atrasada' + (at > 1 ? 's' : '') + '</span>' : '') + (sm ? '<span class="chip c-soon">' + sm + ' na semana</span>' : '') + (g ? '<span class="chip c-accent">Gestante ' + g.mes + 'º mês</span>' : '') + (!at && !sm ? '<span class="chip c-ok">Em dia</span>' : '') + '</div></button>';
    }).join('') + '</div></div>';
  }

  function vFicha(id) {
    const a = H.animal(S, id); if (!a) return '<div class="empty">Animal não encontrado.</div>';
    const g = H.gestacao(S, a);
    const ts = H.tarefas(S, { animalId: a.id }).filter(t => !t.doc && t.status !== 'futuro');
    const regs = S.registros.filter(r => r.animalId === a.id).sort((x, y) => x.data < y.data ? 1 : -1);
    return '<div class="sec"><div class="spread"><button class="btn ghost" data-act="nav" data-v="animais">' + IC.back + 'Animais</button><button class="btn pri" data-act="registrar" data-id="' + a.id + '">' + IC.plus + 'Registrar</button></div>' +
      '<div><div class="eyebrow">' + (a.sexo === 'F' ? 'Fêmea' : 'Macho') + ' · ' + H.idadeTxt(a.nascimento) + '</div><h1>' + esc(a.nome) + '</h1></div>' +
      '<div class="card"><dl class="facts"><div><dt>Registro</dt><dd class="mono">' + esc(a.registro || 'Sem registro') + '</dd></div><div><dt>Microchip</dt><dd class="mono">' + esc(a.chip || '-') + '</dd></div><div><dt>Nascimento</dt><dd>' + br(a.nascimento) + '</dd></div></dl>' +
      (g ? '<div class="gest" style="margin-top:14px;padding-top:14px;border-top:1px solid var(--line-2)"><div class="spread"><b>Gestação</b><span class="chip c-accent">' + g.mes + 'º mês · ' + g.dias + ' dias</span></div><div class="gbar"><i style="width:' + g.pct + '%"></i></div><p class="small muted">Parto previsto para ' + br(g.parto) + ', ' + H.relativo(g.parto) + '.</p></div>' : '') + '</div>' +
      '<div class="card flush"><div class="card-h" style="padding:14px 16px 0"><h3>A fazer</h3></div><div class="tasks" style="padding:2px 16px 6px 0">' + (ts.length ? ts.map(t => UI.linhaTarefa(t, { semAnimal: true })).join('') : '<div class="empty">Nada pendente nos próximos 30 dias.</div>') + '</div></div>' +
      '<div class="card"><h3 style="margin-bottom:4px">Histórico</h3>' + UI.linhaTempo(S, regs) + '</div></div>';
  }

  function vAvisos() {
    let ns = avisos(); if (notifFiltro === 'naolidas') ns = ns.filter(n => !S.lidas.includes(n.id));
    return '<div class="sec"><div class="spread"><div><div class="eyebrow">Notificações</div><h1>Avisos</h1></div><button class="btn ghost sm" data-act="ler-todas">Marcar todos como lidos</button></div>' +
      '<div class="seg" role="group" aria-label="Filtro"><button data-act="notif-f" data-f="todas" aria-pressed="' + (notifFiltro === 'todas') + '">Todos</button><button data-act="notif-f" data-f="naolidas" aria-pressed="' + (notifFiltro === 'naolidas') + '">Não lidos</button></div>' +
      '<div class="card flush"><div style="padding:4px 16px 6px 0">' + (ns.length ? ns.map(n => { const lida = S.lidas.includes(n.id); return '<div class="notif ' + n.sev + (lida ? ' lida' : '') + '"><span class="bar"></span><div class="stack" style="gap:6px"><div><b>' + esc(n.titulo) + '</b><p class="small muted">' + esc(n.texto) + '</p></div><div class="row" style="gap:6px">' + (n.tarefa ? '<button class="btn sm" data-act="registrar-tarefa" data-id="' + esc(n.tarefa.id) + '">' + IC.check + 'Registrar</button>' : '<button class="btn sm" data-act="ver-animal" data-id="' + n.animalId + '">Ver animal</button>') + (lida ? '' : '<button class="btn ghost sm" data-act="ler" data-id="' + esc(n.id) + '">Marcar como lido</button>') + '</div></div></div>'; }).join('') : '<div class="empty">Nenhum aviso.</div>') + '</div></div>' +
      '<p class="small muted">Com o aplicativo, estes avisos também chegarão como notificação no celular.</p></div>';
  }

  function vAssistente() { return UI.chatHTML(chat, 'Assistente', 'Pergunte sobre o que precisa ser feito, vacinação e cuidados com éguas gestantes.'); }
  function perguntar(q) { q = (q || '').trim(); if (!q) return; chat.push({ de: 'me', t: q }); const r = H.responder(S, q); chat.push({ de: 'bot', t: r.t, f: r.f }); render(); }

  const VIEWS = { hoje: vHoje, animais: vAnimais, ficha: vFicha, avisos: vAvisos, assistente: vAssistente };
  const AFTER = {
    assistente() {
      const m = $('#msgs'); m.scrollTop = m.scrollHeight;
      $('#chat-f').addEventListener('submit', e => { e.preventDefault(); perguntar($('#chat-q').value); setTimeout(() => { const q = $('#chat-q'); if (q) q.focus(); }, 0); });
    }
  };
  const ACT = {
    nav: el => go(el.dataset.v),
    'ver-animal': el => { UI.fechar(); go('ficha', el.dataset.id); },
    registrar: el => UI.formRegistro(S, { animalId: el.dataset.id || (view === 'ficha' ? param : undefined) }),
    ocorrencia: () => UI.formRegistro(S, { tipo: 'ocorrencia', tituloModal: 'Registrar ocorrência' }),
    'registrar-tarefa': el => { const t = H.tarefas(S).find(x => x.id === el.dataset.id); if (t) UI.formRegistro(S, UI.preDeTarefa(t)); },
    fechar: () => UI.fechar(),
    'rem-foto': el => UI.remFoto(Number(el.dataset.i)),
    'ver-foto': el => UI.verFoto(S, el.dataset.r, Number(el.dataset.i)),
    'salvar-registro': async el => {
      const r = UI.lerRegistro(S); if (!r) return;
      if (await executar(el, () => API.post('/api/registros', r))) { UI.fechar(); render(); }
    },
    'notif-f': el => { notifFiltro = el.dataset.f; render(); },
    ler: async el => { if (await executar(el, () => API.post('/api/notificacoes/lidas', { ids: [el.dataset.id] }), false)) render(); },
    'ler-todas': async el => { const ids = avisos().map(n => n.id).filter(id => !S.lidas.includes(id)); if (!ids.length) return; if (await executar(el, () => API.post('/api/notificacoes/lidas', { ids }), 'Avisos marcados como lidos.')) render(); },
    'minha-senha': () => UI.abrir({ titulo: 'Alterar minha senha', corpo: '<form class="stack" novalidate><div class="field"><label for="m-atual">Senha atual</label><input id="m-atual" type="password" class="inp" autocomplete="current-password"></div><div class="field"><label for="m-nova">Nova senha (mín. 8)</label><input id="m-nova" type="password" class="inp" autocomplete="new-password"></div></form>', rodape: '<button class="btn" data-act="fechar">Cancelar</button><button class="btn pri" data-act="salvar-minha-senha">Alterar</button>' }),
    'salvar-minha-senha': async el => {
      const n = document.getElementById('m-nova').value; if (n.length < 8) { UI.toast('A nova senha precisa ter pelo menos 8 caracteres.'); return; }
      if (await executar(el, () => API.post('/api/me/senha', { atual: document.getElementById('m-atual').value, nova: n }), 'Senha alterada.')) UI.fechar();
    },
    sair: async () => { try { await API.post('/api/logout'); } catch (e) { } location.href = '/entrar'; },
    sug: el => perguntar(el.dataset.q)
  };
  document.addEventListener('click', e => {
    const el = e.target.closest('[data-act]'); if (!el) return;
    const f = ACT[el.dataset.act]; if (!f) return;
    if (el.tagName === 'A' || el.closest('form')) e.preventDefault();
    f(el, e);
  });
  (async () => {
    $('#view').innerHTML = '<div class="empty">Carregando...</div>';
    try {
      await recarregar();
      NAV_TODOS.forEach(n => { if (n[0] !== 'assistente' || S.plano.modulos.assistente !== false) NAV.push(n); });
      render();
    } catch (e) {
      if (/usuários de um haras/.test(e.message)) { location.href = '/admin'; return; }
      $('#view').innerHTML = '<div class="note bad">' + esc(e.message) + '</div>';
    }
  })();
})();
</script>

</body>
</html>
